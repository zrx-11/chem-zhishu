<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>普通化学原理：大学化学的主干</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/picocss/2.0.6/dist/css/pico.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>

<div class="layout">
  <aside class="sidebar">
    <h1>普通化学原理：大学化学的主干</h1>

解平衡", "file": "chapters/ch07-沉淀溶解平衡.md", "difficulty": 2, "source": "《普通化学原理》第9章", "prerequisites": ["ch05", "ch06"]}, {"id": "ch08", "title": "第 8 章：氧化还原与电化学", "file": "chapters/ch08-电化学.md", "difficulty": 3, "source": "《普通化学原理》第10章", "prerequisites": ["ch04", "ch05"]}, {"id": "ch09", "title": "第 9 章：化学反应速率", "file": "chapters/ch09-反应速率.md", "difficulty": 2, "source": "《普通化学原理》第7章", "prerequisites": ["ch05"]}, {"id": "ch10", "title": "第 10 章：原子结构", "file": "chapters/ch10-原子结构.md", "difficulty": 3, "source": "《普通化学原理》第11章", "prerequisites": ["ch04"]}, {"id": "ch11", "title": "第 11 章：化学键与分子结构", "file": "chapters/ch11-分子结构.md", "difficulty": 3, "source": "《普通化学原理》第12章", "prerequisites": ["ch10"]}, {"id": "ch12", "title": "第 12 章：晶体结构与配位化合物", "file": "chapters/ch12-晶体与配位.md", "difficulty": 3, "source": "《普通化学原理》第13、14章", "prerequisites": ["ch11"]}], "concepts": [{"id": "c01", "title": "化学平衡常数", "file": "concepts/c01-化学平衡常数.md", "chapterIds": ["ch05"], "difficulty": "进阶", "source": "《普通化学原理》第6章", "prerequisites": ["ch04"]}, {"id": "c02", "title": "吉布斯自由能", "file": "concepts/c02-吉布斯自由能.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": "《普通化学原理》第5章", "prerequisites": ["ch02", "ch03"], "depthFragment": "concepts/c02-吉布斯自由能-depth.md"}, {"id": "c03", "title": "电极电势与 Nernst 方程", "file": "concepts/c03-电极电势.md", "chapterIds": ["ch08"], "difficulty": "高难", "source": "《普通化学原理》第10章", "prerequisites": ["c02", "ch05"], "depthFragment": "concepts/c03-电极电势-depth.md"}, {"id": "c04", "title": "原子轨道与量子数", "file": "concepts/c04-原子轨道.md", "chapterIds": ["ch10"], "difficulty": "高难", "source": "《普通化学原理》第11章", "prerequisites": []}, {"id": "c05", "title": "杂化轨道", "file": "concepts/c05-杂化轨道.md", "chapterIds": ["ch11"], "difficulty": "高难", "source": "《普通化学原理》第12章", "prerequisites": ["c04"], "depthFragment": "concepts/c05-杂化轨道-depth.md"}], "glossary": [{"term": "状态函数", "def": "只由体系当前状态决定、与路径无关的物理量", "chapterId": "ch02"}, {"term": "焓", "def": "H = U + pV，恒压热等于 ΔH", "chapterId": "ch02"}, {"term": "熵", "def": "体系混乱度的量度，单位 J/(mol·K)", "chapterId": "ch04"}, {"term": "吉布斯自由能", "def": "G = H - TS，恒温恒压下 ΔG<0 自发", "chapterId": "ch04"}, {"term": "平衡常数", "def": "平衡时生成物浓度幂之积与反应物浓度幂之积的比值", "chapterId": "ch05"}, {"term": "缓冲溶液", "def": "能抵抗少量酸碱、pH 基本不变的溶液", "chapterId": "ch06"}, {"term": "溶度积", "def": "难溶电解质饱和溶液中离子浓度幂之积", "chapterId": "ch07"}, {"term": "标准电极电势", "def": "电极相对标准氢电极的电势", "chapterId": "ch08"}, {"term": "活化能", "def": "反应物分子变成活化分子所需的最小能量", "chapterId": "ch09"}, {"term": "杂化", "def": "原子轨道重新组合成能量相同、方向更合理的新轨道", "chapterId": "ch11"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "25℃、100 kPa 下 2 mol N2 的体积约为？", "options": ["24.8 L", "49.6 L", "22.4 L", "98.2 L"], "answer": 1, "explain": "V=nRT/p=2×8.314×298.15/100000≈0.0496 m3=49.6 L。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "容器中 0.2 mol O2 与 0.8 mol N2，总压 100 kPa，O2 分压为？", "options": ["20 kPa", "80 kPa", "100 kPa", "8 kPa"], "answer": 0, "explain": "摩尔分数 0.2，分压=0.2×100=20 kPa。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q03", "chapterId": "ch02", "type": "single", "question": "下列属于状态函数的是？", "options": ["Q", "W", "H", "反应热"], "answer": 2, "explain": "焓只由状态决定，Q、W 是过程量。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "恒压下某反应放热 50 kJ，ΔH 为？", "options": ["+50 kJ", "-50 kJ", "0", "无法判断"], "answer": 1, "explain": "放热 Qp<0，恒压热等于 ΔH。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q05", "chapterId": "ch03", "type": "single", "question": "热化学方程式中 ΔH=+58 kJ/mol 表示？", "options": ["放热", "吸热", "不吸不放", "无法判断"], "answer": 1, "explain": "ΔH 为正表示体系吸热。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q06", "chapterId": "ch03", "type": "single", "question": "N2+3H2→2NH3，ΔH=-92 kJ/mol；写成 ½N2+1.5H2→NH3 时 ΔH 为？", "options": ["-92 kJ/mol", "-46 kJ/mol", "+46 kJ/mol", "-184 kJ/mol"], "answer": 1, "explain": "系数减半，ΔH 也减半。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q07", "chapterId": "ch04", "type": "single", "question": "下列过程熵增的是？", "options": ["水结冰", "气体液化", "CaCO3 分解产生 CO2", "溶液结晶"], "answer": 2, "explain": "固体分解出气体，混乱度增大。", "relatedConceptId": "c02", "optionMisconceptions": []}, {"id": "q08", "chapterId": "ch04", "type": "single", "question": "ΔH=-50 kJ/mol、ΔS=-100 J/(mol·K)，298 K 时反应？", "options": ["自发", "不自发", "处于平衡", "无法判断"], "answer": 0, "explain": "ΔG=-50-298×(-0.1)=-20.2 kJ/mol<0，自发。单位要先换成 kJ。", "relatedConceptId": "c02", "optionMisconceptions": []}, {"id": "q09", "chapterId": "ch05", "type": "single", "question": "C(s)+CO2(g)⇌2CO(g) 的 Kc 表达式是？", "options": ["[CO]2/[CO2]", "[CO]2/([C][CO2])", "[CO2]/[CO]2", "[C][CO2]/[CO]2"], "answer": 0, "explain": "纯固体 C 不写入平衡常数表达式。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q10", "chapterId": "ch05", "type": "single", "question": "某温度 K=10，当前 Q=5，反应向？", "options": ["正方向", "逆方向", "不移动", "先正后逆"], "answer": 0, "explain": "Q<K，生成物不足，向正方向进行。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q11", "chapterId": "ch06", "type": "single", "question": "0.01 mol/L HCl 的 pH 是？", "options": ["1", "2", "7", "12"], "answer": 1, "explain": "强酸完全电离，[H+]=0.01，pH=2。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q12", "chapterId": "ch06", "type": "single", "question": "缓冲溶液 pH 的计算式是？", "options": ["pH=pKa+lg([碱]/[酸])", "pH=pKa-lg([碱]/[酸])", "pH=pKw-pKa", "pH=-lgKa"], "answer": 0, "explain": "Henderson-Hasselbalch 方程：pH=pKa+lg([A-]/[HA])。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q13", "chapterId": "ch07", "type": "single", "question": "BaSO4 的 Ksp 表达式是？", "options": ["[Ba2+][SO4^2-]", "[Ba2+]+[SO4^2-]", "[BaSO4]/([Ba2+][SO4^2-])", "[Ba2+][SO4^2-]/[BaSO4]"], "answer": 0, "explain": "固体不写入 Ksp 表达式。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q14", "chapterId": "ch07", "type": "single", "question": "AgCl 在 0.10 mol/L NaCl 中的溶解度比纯水中？", "options": ["更大", "更小", "相同", "无法比较"], "answer": 1, "explain": "同离子效应使平衡向沉淀方向移动，溶解度降低。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q15", "chapterId": "ch08", "type": "single", "question": "原电池中电子从？", "options": ["正极流向负极", "负极流向正极", "溶液流向电极", "盐桥流向电极"], "answer": 1, "explain": "负极失电子，电子经外电路流向正极。", "relatedConceptId": "c03", "optionMisconceptions": []}, {"id": "q16", "chapterId": "ch08", "type": "single", "question": "E°(Ag+/Ag)=+0.80 V，E°(Cu2+/Cu)=+0.34 V，Cu+2Ag+→Cu2++2Ag 的电动势是？", "options": ["1.14 V", "0.46 V", "-0.46 V", "0.23 V"], "answer": 1, "explain": "E=0.80-0.34=0.46 V。", "relatedConceptId": "c03", "optionMisconceptions": []}, {"id": "q17", "chapterId": "ch09", "type": "single", "question": "某反应浓度加倍，速率变为 4 倍，反应级数是？", "options": ["0", "1", "2", "3"], "answer": 2, "explain": "v∝[A]^2，浓度 2 倍则速率 4 倍。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q18", "chapterId": "ch09", "type": "single", "question": "催化剂对平衡的影响是？", "options": ["向正方向移动", "向逆方向移动", "不移动", "改变 K"], "answer": 2, "explain": "催化剂同等加快正逆反应，不改变平衡位置和 K。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q19", "chapterId": "ch10", "type": "single", "question": "n=3 时 l 可以取？", "options": ["0、1、2", "1、2、3", "0、1、2、3", "只有 3"], "answer": 0, "explain": "l 取 0 到 n-1，即 0、1、2。", "relatedConceptId": "c04", "optionMisconceptions": []}, {"id": "q20", "chapterId": "ch10", "type": "single", "question": "1s2 2s2 2p6 3s2 3p5 是几号元素？", "options": ["15", "16", "17", "18"], "answer": 2, "explain": "电子总数 2+2+6+2+5=17，是氯。", "relatedConceptId": "c04", "optionMisconceptions": []}, {"id": "q21", "chapterId": "ch11", "type": "single", "question": "CH4 的中心原子杂化类型是？", "options": ["sp", "sp2", "sp3", "未杂化"], "answer": 2, "explain": "4 个 σ 键、无孤对，4 对电子，sp3。", "relatedConceptId": "c05", "optionMisconceptions": []}, {"id": "q22", "chapterId": "ch11", "type": "single", "question": "NH3 的空间构型是？", "options": ["平面三角形", "三角锥", "正四面体", "直线形"], "answer": 1, "explain": "4 对电子中有 1 对孤对，三角锥。", "relatedConceptId": "c05", "optionMisconceptions": []}, {"id": "q23", "chapterId": "ch12", "type": "single", "question": "下列晶体中熔点最高的是？", "options": ["NaCl", "干冰", "金刚石", "冰"], "answer": 2, "explain": "金刚石是共价晶体，整个晶体由共价键连接。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "q24", "chapterId": "ch12", "type": "single", "question": "[Cu(NH3)4]2+ 的中心离子和配位数是？", "options": ["Cu2+、4", "Cu2+、6", "Cu+、4", "NH3、4"], "answer": 0, "explain": "中心离子 Cu2+，4 个 NH3 配体，配位数 4。", "relatedConceptId": "", "optionMisconceptions": []}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "气体：一句话核心是什么？", "back": "理想气体把分子当成没有体积、彼此不吸引的质点，pV=nRT 是这种假设下的状态方程。", "tags": ["ch01"]}, {"id": "f02", "chapterId": "ch01", "front": "气体最容易错在哪？", "back": "温度必须用 K，不能用摄氏度。", "tags": ["ch01", "易错"]}, {"id": "f03", "chapterId": "ch02", "front": "热力学第一定律与焓：一句话核心是什么？", "back": "能量守恒：体系内能的改变，等于它吸收的热加上外界对它做的功。", "tags": ["ch02"]}, {"id": "f04", "chapterId": "ch02", "front": "热力学第一定律与焓最容易错在哪？", "back": "焓不是热，只有恒压且只做体积功时 ΔH 才等于 Qp。", "tags": ["ch02", "易错"]}, {"id": "f05", "chapterId": "ch03", "front": "热化学与盖斯定律：一句话核心是什么？", "back": "反应热只由始末态决定，可以把已知反应像代数式一样相加。", "tags": ["ch03"]}, {"id": "f06", "chapterId": "ch03", "front": "热化学与盖斯定律最容易错在哪？", "back": "热化学方程式必须标物质状态。", "tags": ["ch03", "易错"]}, {"id": "f07", "chapterId": "ch04", "front": "熵与吉布斯自由能：一句话核心是什么？", "back": "自发性由放热和熵增共同决定，ΔG = ΔH - TΔS 把两者合成一个判据。", "tags": ["ch04"]}, {"id": "f08", "chapterId": "ch04", "front": "熵与吉布斯自由能最容易错在哪？", "back": "ΔG<0 只说明方向，不说明速率。", "tags": ["ch04", "易错"]}, {"id": "f09", "chapterId": "ch05", "front": "化学平衡：一句话核心是什么？", "back": "平衡常数 K 只随温度变化；Q 与 K 的比较告诉你反应往哪边走。", "tags": ["ch05"]}, {"id": "f10", "chapterId": "ch05", "front": "化学平衡最容易错在哪？", "back": "催化剂不改变 K。", "tags": ["ch05", "易错"]}, {"id": "f11", "chapterId": "ch06", "front": "酸碱电离平衡与缓冲溶液：一句话核心是什么？", "back": "酸碱反应是质子转移；弱酸的 Ka 与共轭碱的 Kb 通过 Kw 联系。", "tags": ["ch06"]}, {"id": "f12", "chapterId": "ch06", "front": "酸碱电离平衡与缓冲溶液最容易错在哪？", "back": "pH=7 只在 25℃ 是中性。", "tags": ["ch06", "易错"]}, {"id": "f13", "chapterId": "ch07", "front": "沉淀溶解平衡：一句话核心是什么？", "back": "难溶电解质并非完全不溶，Ksp 是溶解与沉淀平衡的定量表达。", "tags": ["ch07"]}, {"id": "f14", "chapterId": "ch07", "front": "沉淀溶解平衡最容易错在哪？", "back": "Ksp 小的先沉淀，不是大的先沉淀。", "tags": ["ch07", "易错"]}, {"id": "f15", "chapterId": "ch08", "front": "氧化还原与电化学：一句话核心是什么？", "back": "氧化还原是电子转移；原电池把这种转移拆成两半，让电子走外电路做功。", "tags": ["ch08"]}, {"id": "f16", "chapterId": "ch08", "front": "氧化还原与电化学最容易错在哪？", "back": "原电池负极是阳极（氧化），别和电解池混。", "tags": ["ch08", "易错"]}, {"id": "f17", "chapterId": "ch09", "front": "化学反应速率：一句话核心是什么？", "back": "速率由活化能和碰撞频率决定；催化剂降低能垒，不改平衡。", "tags": ["ch09"]}, {"id": "f18", "chapterId": "ch09", "front": "化学反应速率最容易错在哪？", "back": "反应级数不一定等于方程式系数。", "tags": ["ch09", "易错"]}, {"id": "f19", "chapterId": "ch10", "front": "原子结构：一句话核心是什么？", "back": "电子没有确定轨道，只有概率分布；量子数描述这种分布的形状、方向和能量。", "tags": ["ch10"]}, {"id": "f20", "chapterId": "ch10", "front": "原子结构最容易错在哪？", "back": "Cr、Cu 的排布是半充满/全充满特例。", "tags": ["ch10", "易错"]}, {"id": "f21", "chapterId": "ch11", "front": "化学键与分子结构：一句话核心是什么？", "back": "分子形状由中心原子周围电子对互相排斥决定；杂化轨道是为成键重组的轨道。", "tags": ["ch11"]}, {"id": "f22", "chapterId": "ch11", "front": "化学键与分子结构最容易错在哪？", "back": "有极性键的分子不一定有极性。", "tags": ["ch11", "易错"]}, {"id": "f23", "chapterId": "ch12", "front": "晶体结构与配位化合物：一句话核心是什么？", "back": "晶体性质由构成粒子和粒子间作用力决定；配合物是中心离子与配体通过配位键结合的整体。", "tags": ["ch12"]}, {"id": "f24", "chapterId": "ch12", "front": "晶体结构与配位化合物最容易错在哪？", "back": "配位数不一定等于配体个数。", "tags": ["ch12", "易错"]}], "companion": "学习伴侣.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第2章<\/div><h1>第 1 章：气体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：入门篇第 5 章（物质的量）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 <span class=\"katex-inline\">pV=nRT<\/span> 算压强、体积、温度、物质的量中的任意一个；\n<\/li><li>\n用分压定律处理混合气体；\n<\/li><li>\n说出实际气体偏离理想气体的原因。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>理想气体把分子当成&quot;没有体积、彼此不吸引&quot;的质点，<span class=\"katex-inline\">pV=nRT<\/span> 就是这种假设下的状态方程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：理想气体状态方程（难度：基础）<\/h3>\n<div class=\"katex-block\">pV = nRT<\/div>\n<p>p 是压强（Pa），V 是体积（m³），n 是物质的量（mol），T 是热力学温度（K），R 是气体常数 8.314 J/(mol·K)。<\/p>\n<p>用这个方程必须用热力学温度：<span class=\"katex-inline\">T = t + 273.15<\/span>。0 ℃ 就是 273.15 K。用摄氏度直接代入会算错。<\/p>\n<p>变形可以求密度：<span class=\"katex-inline\">pM = \\rho RT<\/span>，其中 M 是摩尔质量，ρ 是密度。这个式子常用来由密度反推气体摩尔质量。<\/p>\n<h3>概念 2：分压定律（难度：进阶）<\/h3>\n<p>混合气体中，某组分气体的<strong>分压<\/strong>等于它单独占据整个容器时产生的压强。Dalton 分压定律：<\/p>\n<div class=\"katex-block\">p_{\\text{总}} = p_1 + p_2 + \\cdots<\/div>\n<p>且 <span class=\"katex-inline\">p_i = x_i p_{\\text{总}}<\/span>，<span class=\"katex-inline\">x_i<\/span> 是摩尔分数。排水集气法收集的气体里混有水蒸气，计算时要先减去饱和水蒸气压：<span class=\"katex-inline\">p_{\\text{干气}} = p_{\\text{总}} - p_{\\text{水}}<\/span>。<\/p>\n<h3>概念 3：分子速率分布（难度：进阶）<\/h3>\n<p>气体分子速率并不相同，服从 Maxwell 分布。温度升高，分布曲线变宽、峰值右移，说明高速分子比例增加。<\/p>\n<p>三个统计速率：最概然速率、平均速率、方均根速率。它们都和 <span class=\"katex-inline\">\\sqrt{T/M}<\/span> 成正比：温度越高、摩尔质量越小，分子跑得越快。这解释了为什么氢气比氧气扩散快。<\/p>\n<h3>概念 4：实际气体（难度：进阶）<\/h3>\n<p>理想气体假设分子不占体积、没有相互作用。真实气体在高压、低温下分子靠得近，这两条假设失效，实际压强会比理想值低（分子间有引力），体积会比理想值大（分子有体积）。<\/p>\n<p>van der Waals 方程做了修正：<\/p>\n<div class=\"katex-block\">\\left(p + \\frac{a n^2}{V^2}\\right)(V - nb) = nRT<\/div>\n<p>a 修正分子间引力，b 修正分子体积。a、b 越大，这种气体越&quot;不理想&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[p V n T 四个量] --&gt; B{已知三个求一个}\n  B --&gt; C[用 pV=nRT]\n  C --&gt; D{混合气体?}\n  D --&gt;|是| E[分压定律 求各组分]\n  D --&gt;|否| F[直接求]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先判断是不是混合气体，单一气体直接套方程，混合气体先拆组分再求和。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：理想气体像高峰期的地铁乘客，假设每个人没有体积、互不碰撞，只按平均速度流动。真实气体像带着行李箱的乘客，人与人之间有距离、有摩擦，高压时这些因素就显出来了。<\/p>\n<p>实例：25 ℃、100 kPa 下，2.0 mol N₂ 占多大体积？ T = 298.15 K，V = nRT/p = 2.0 × 8.314 × 298.15 / 100000 = 0.0496 m³ = 49.6 L。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;温度可以直接用摄氏度代入&quot;——必须换成 K。\n<\/li><li>\n别以为&quot;分压是气体真实存在的压强&quot;——分压是组分单独占容器时的等效压强，总压才是容器承受的压强。\n<\/li><li>\n别以为&quot;实际气体方程可以随便替代理想气体方程&quot;——低压高温时理想气体已经够准，van der Waals 主要用于高压低温。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n标况下 1 mol 理想气体的体积约为多少？\n<p>（答案：22.4 L；解析：V = nRT/p = 1×8.314×273.15/101325 ≈ 0.0224 m³。）<\/p>\n<\/ol>\n<ol><li>\n容器中有 0.2 mol O₂ 和 0.8 mol N₂，总压 100 kPa，O₂ 的分压是多少？\n<p>（答案：20 kPa；解析：摩尔分数 0.2，分压 = 0.2×100。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;温度升高，气体分子平均速率增大，所以所有分子速率都增大。&quot;\n<p>（答案：不对。分布曲线整体右移，但仍有慢分子，是统计上的平均速率增大。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n<span class=\"katex-inline\">pV=nRT<\/span> 四个量、一个常数，单位要统一。\n<\/li><li>\n分压 = 摩尔分数 × 总压。\n<\/li><li>\n高压低温时理想气体模型失效，用 van der Waals 修正。\n<\/ul>", "kind": "chapter", "title": "第 1 章：气体"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第5章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：气体<\/a><\/span><\/div><h1>第 2 章：热力学第一定律与焓<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分体系与环境、状态函数与过程量；\n<\/li><li>\n用 <span class=\"katex-inline\">\\Delta U = Q + W<\/span> 算内能变化；\n<\/li><li>\n说清焓 H 是怎么来的，为什么恒压热等于 ΔH。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>能量守恒：体系内能的改变，等于它吸收的热加上外界对它做的功。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：体系、环境、状态函数（难度：基础）<\/h3>\n<p>被研究的对象叫<strong>体系<\/strong>，体系之外与之相互作用的部分叫<strong>环境<\/strong>。体系分三类：敞开体系（能量和物质都能交换）、封闭体系（只交换能量）、孤立体系（都不交换）。<\/p>\n<p><strong>状态函数<\/strong>只由体系当前状态决定，与怎么走到这个状态无关：温度 T、压强 p、体积 V、内能 U、焓 H、熵 S、吉布斯自由能 G。<strong>过程量<\/strong>与路径有关：热 Q、功 W。<\/p>\n<p>状态函数有个重要性质：循环一圈回到起点，变化量为零。所以 <span class=\"katex-inline\">\\Delta U<\/span> 只看始末态，不看路径。<\/p>\n<h3>概念 2：热与功（难度：进阶）<\/h3>\n<p><strong>热 Q<\/strong> 是因温度差而传递的能量。体系吸热 Q &gt; 0，放热 Q &lt; 0。 <strong>功 W<\/strong> 是除热以外其他方式传递的能量。本书采用&quot;环境对体系做功为正&quot;的约定，W &gt; 0 表示外界压缩体系、对体系做功。<\/p>\n<p>体积功的计算：<span class=\"katex-inline\">W = -p_{\\text{外}}\\Delta V<\/span>（环境对体系做功）。恒外压膨胀时，体系对外做功，W &lt; 0。<\/p>\n<h3>概念 3：热力学第一定律（难度：进阶）<\/h3>\n<div class=\"katex-block\">\\Delta U = Q + W<\/div>\n<p>内能变化 = 吸收的热 + 外界做的功。这是能量守恒定律在热力学中的表达。<\/p>\n<p>对封闭体系、只做体积功的过程，<span class=\"katex-inline\">W = -p_{\\text{外}}\\Delta V<\/span>，所以 <span class=\"katex-inline\">\\Delta U = Q - p_{\\text{外}}\\Delta V<\/span>。<\/p>\n<h3>概念 4：焓与恒压热（难度：高难）<\/h3>\n<p><strong>焓<\/strong>定义为 <span class=\"katex-inline\">H = U + pV<\/span>。它本身没有直观的物理意义，是一个为了处理恒压过程而构造的量。<\/p>\n<p>恒压过程：<span class=\"katex-inline\">\\Delta H = \\Delta U + p\\Delta V = Q_p - p\\Delta V + p\\Delta V = Q_p<\/span>。<\/p>\n<p>所以恒压下吸收的热等于焓变。这就是为什么热化学方程式里写的反应热，通常就是 ΔH。恒容过程则 <span class=\"katex-inline\">Q_V = \\Delta U<\/span>。<\/p>\n<p>焓是状态函数，ΔH 只与始末态有关，这为盖斯定律打下基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[体系内能 U] --&gt; B{能量交换方式}\n  B --&gt; C[热 Q 温度差]\n  B --&gt; D[功 W 除热以外]\n  C --&gt; E[ΔU = Q + W]\n  D --&gt; E\n  E --&gt; F[恒压时 Qp = ΔH]\n  E --&gt; G[恒容时 Qv = ΔU]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：能量通过热和功两条通道进出体系，第一定律把它们合起来。恒压和恒容分别对应两种常用测量条件。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：内能像银行卡余额，热是转账收入，功是刷卡消费。余额变化只看进账和出账的总和，不看中间转了几次。这个类比在&quot;体系对外做功&quot;时符号要反过来记：刷卡消费是负的。<\/p>\n<p>实例：1 mol 理想气体在 300 K 恒温可逆膨胀，体积从 1 L 到 2 L。恒温下 ΔU = 0（理想气体内能只与温度有关），所以 Q = −W。体系对外做功，W &lt; 0，Q &gt; 0，吸热。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;焓就是热量&quot;——焓是状态函数，只有在恒压、只做体积功的条件下，ΔH 才等于 Qp。\n<\/li><li>\n别以为&quot;状态函数和路径无关，所以 Q 和 W 也无关&quot;——Q、W 是过程量，路径不同数值不同。\n<\/li><li>\n别以为&quot;ΔU = Q + W 里的 W 一定是正的&quot;——看约定，本书环境对体系做功为正。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列属于状态函数的是（ ）。A. Q B. W C. H D. 反应热\n<p>（答案：C；解析：焓只由状态决定。Q、W 是过程量。）<\/p>\n<\/ol>\n<ol><li>\n恒压下某反应放热 50 kJ，则 ΔH 为多少？\n<p>（答案：−50 kJ；解析：放热 Qp &lt; 0，ΔH = Qp。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;体系对外做功，内能一定减少。&quot;\n<p>（答案：不一定。若同时吸热且吸热量大于做功量，内能反而增加。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\Delta U = Q + W<\/span>，符号约定先记牢。\n<\/li><li>\n焓 H = U + pV，恒压热等于 ΔH。\n<\/li><li>\n状态函数看始末，过程量看路径。\n<\/ul>", "kind": "chapter", "title": "第 2 章：热力学第一定律与焓"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第5章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：热力学第一定律与焓<\/a><\/span><\/div><h1>第 3 章：热化学与盖斯定律<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n正确书写热化学方程式（标状态、标 ΔH）；\n<\/li><li>\n用盖斯定律算难以直接测量的反应热；\n<\/li><li>\n用标准生成焓或键焓估算 ΔH。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>反应热只由始末态决定，所以可以把几个已知反应像代数式一样相加，得到目标反应的热效应。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：热化学方程式（难度：基础）<\/h3>\n<p>热化学方程式比普通方程式多三样东西：物质的状态、化学计量数对应的 ΔH、ΔH 的符号和单位。<\/p>\n<div class=\"katex-block\">H_2(g) + \\frac{1}{2}O_2(g) \\rightarrow H_2O(l) \\quad \\Delta H = -285.8\\ \\text{kJ/mol}<\/div>\n<p>写法要点：<\/p>\n<ul><li>\n必须标状态：(g) 气、(l) 液、(s) 固、(aq) 水溶液。\n<\/li><li>\nΔH 写在方程式右边，放热为负、吸热为正。\n<\/li><li>\n系数表示物质的量，可以是分数；系数翻倍，ΔH 也翻倍。\n<\/li><li>\n逆反应的 ΔH 与正反应数值相等、符号相反。\n<\/ul>\n<h3>概念 2：盖斯定律（难度：进阶）<\/h3>\n<p>一个反应无论一步完成还是分几步完成，总热效应相同。因为 ΔH 是状态函数，只与始末态有关。<\/p>\n<p>用法：把目标反应拆成几个已知反应，调整系数和方向，让中间产物消掉，ΔH 相应相加。<\/p>\n<p>例：已知 (1) C(s) + O₂(g) → CO₂(g)，ΔH₁ = −393.5 kJ/mol (2) CO(g) + ½O₂(g) → CO₂(g)，ΔH₂ = −283.0 kJ/mol 求 C(s) + ½O₂(g) → CO(g) 的 ΔH。<\/p>\n<p>目标反应 = (1) − (2)：ΔH = −393.5 − (−283.0) = −110.5 kJ/mol。<\/p>\n<h3>概念 3：标准生成焓（难度：进阶）<\/h3>\n<p><strong>标准摩尔生成焓<\/strong> ΔH_f° 是在标准状态（298.15 K、100 kPa）下，由稳定单质生成 1 mol 该物质时的焓变。稳定单质的生成焓规定为零。<\/p>\n<p>反应焓变 = 产物生成焓之和 − 反应物生成焓之和：<\/p>\n<div class=\"katex-block\">\\Delta H = \\sum \\nu_i \\Delta H_f^\\circ(\\text{产物}) - \\sum \\nu_i \\Delta H_f^\\circ(\\text{反应物})<\/div>\n<p>注意系数要乘进去，别漏。<\/p>\n<h3>概念 4：键焓估算（难度：进阶）<\/h3>\n<p><strong>键焓<\/strong>是断开 1 mol 某化学键所需的能量。反应热约等于断键吸收的能量减去成键放出的能量：<\/p>\n<div class=\"katex-block\">\\Delta H \\approx \\sum E_{\\text{断}} - \\sum E_{\\text{成}}<\/div>\n<p>键焓是平均值，不同分子里的同种键并不完全相同，所以这是估算，不是精确值。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[目标反应] --&gt; B[拆成已知反应]\n  B --&gt; C[调整方向 逆反应变号]\n  C --&gt; D[调整系数 ΔH 同比缩放]\n  D --&gt; E[相加 消去中间物]\n  E --&gt; F[得到目标 ΔH]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：盖斯定律本质是&quot;路径可加&quot;。方向反了 ΔH 变号，系数变了 ΔH 按比例变。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：盖斯定律像换乘地铁。从 A 到 C，可以直达，也可以 A→B→C，票价（能量变化）只与起点终点有关，与换乘几次无关。这个类比在&quot;非状态函数&quot;处失效，比如时间、路程就与路径有关。<\/p>\n<p>实例：用生成焓算甲烷燃烧。 CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l) ΔH_f°：CH₄ −74.8，CO₂ −393.5，H₂O(l) −285.8，O₂ 0。 ΔH = (−393.5 + 2×−285.8) − (−74.8 + 0) = −890.3 kJ/mol。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;热化学方程式可以不标状态&quot;——状态不同，ΔH 差很多（气态水和液态水差 44 kJ/mol）。\n<\/li><li>\n别以为&quot;ΔH 为负表示反应不能发生&quot;——负只表示放热，能不能自发还要看熵和吉布斯自由能。\n<\/li><li>\n别以为&quot;盖斯定律只能用于燃烧反应&quot;——只要始末态确定，任何反应都能用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n热化学方程式中，ΔH = +58 kJ/mol 表示（ ）。A. 放热 B. 吸热 C. 不吸不放 D. 无法判断\n<p>（答案：B；解析：ΔH 为正表示体系吸热。）<\/p>\n<\/ol>\n<ol><li>\n已知 N₂ + 3H₂ → 2NH₃，ΔH = −92 kJ/mol。若写成 ½N₂ + 1.5H₂ → NH₃，ΔH 为多少？\n<p>（答案：−46 kJ/mol；解析：系数减半，ΔH 也减半。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;石墨和金刚石燃烧的 ΔH 相同，因为都是碳。&quot;\n<p>（答案：不对。石墨和金刚石是不同状态，生成焓不同，燃烧热不同。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n热化学方程式三要素：状态、系数、ΔH。\n<\/li><li>\n盖斯定律：反应相加，ΔH 相加；逆向变号。\n<\/li><li>\n生成焓算反应热：产物减反应物，系数别漏。\n<\/ul>", "kind": "chapter", "title": "第 3 章：热化学与盖斯定律"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第5章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：热力学第一定律与焓<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：热化学与盖斯定律<\/a><\/span><\/div><h1>第 4 章：熵与吉布斯自由能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 2、3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个过程的熵增还是熵减；\n<\/li><li>\n用 <span class=\"katex-inline\">\\Delta G = \\Delta H - T\\Delta S<\/span> 判断反应自发方向；\n<\/li><li>\n解释&quot;放热反应不一定自发&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>自发性由两个因素共同决定：体系趋于最低能量（放热），同时趋于最大混乱度（熵增）；吉布斯自由能把两者合成一个判据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：熵（难度：进阶）<\/h3>\n<p><strong>熵 S<\/strong> 是体系混乱度（微观状态数）的量度。熵越大，体系越无序。单位 J/(mol·K)。<\/p>\n<p>经验规律：<\/p>\n<ul><li>\n同一物质：气态熵 &gt; 液态熵 &gt; 固态熵。\n<\/li><li>\n升温、增大体积、增加物质的量，熵增大。\n<\/li><li>\n固体溶解、气体分子数增加的反应，通常熵增。\n<\/ul>\n<p>标准摩尔熵 S° 是 1 mol 物质在标准状态下的熵。与生成焓不同，<strong>稳定单质的标准熵不为零<\/strong>，因为任何物质都有混乱度。<\/p>\n<h3>概念 2：热力学第二定律（难度：进阶）<\/h3>\n<p>孤立体系中，自发过程总是朝着熵增的方向进行：<span class=\"katex-inline\">\\Delta S_{\\text{总}} \\geq 0<\/span>。<\/p>\n<p>注意是&quot;总熵&quot;（体系 + 环境），不是只看体系。体系熵减的过程也可能自发，只要环境熵增更多。比如水结冰，体系熵减，但放出的凝固热使环境熵增，总熵仍增。<\/p>\n<h3>概念 3：吉布斯自由能（难度：高难）<\/h3>\n<p>定义 <span class=\"katex-inline\">G = H - TS<\/span>。恒温恒压下：<\/p>\n<div class=\"katex-block\">\\Delta G = \\Delta H - T\\Delta S<\/div>\n<p>判据：<span class=\"katex-inline\">\\Delta G &lt; 0<\/span> 自发；<span class=\"katex-inline\">\\Delta G = 0<\/span> 平衡；<span class=\"katex-inline\">\\Delta G &gt; 0<\/span> 非自发（逆过程自发）。<\/p>\n<p>四种组合要会判断：<\/p>\n<ul><li>\nΔH &lt; 0、ΔS &gt; 0：任何温度都自发。\n<\/li><li>\nΔH &gt; 0、ΔS &lt; 0：任何温度都不自发。\n<\/li><li>\nΔH &lt; 0、ΔS &lt; 0：低温自发，高温不自发。\n<\/li><li>\nΔH &gt; 0、ΔS &gt; 0：高温自发，低温不自发。\n<\/ul>\n<p>转折温度 <span class=\"katex-inline\">T = \\Delta H / \\Delta S<\/span>，此时 ΔG = 0。<\/p>\n<h3>概念 4：标准吉布斯自由能与平衡常数（难度：高难）<\/h3>\n<div class=\"katex-block\">\\Delta G^\\circ = -RT\\ln K<\/div>\n<p>ΔG° 越负，K 越大，反应进行得越彻底。这条式子把热力学和平衡常数连起来，是第 5 章的基础。<\/p>\n<p>也可以用 <span class=\"katex-inline\">\\Delta G^\\circ = \\Delta G_f^\\circ(\\text{产物}) - \\Delta G_f^\\circ(\\text{反应物})<\/span> 计算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[ΔH 与 ΔS] --&gt; B{ΔH 符号}\n  B --&gt;|负| C{ΔS 符号}\n  B --&gt;|正| D{ΔS 符号}\n  C --&gt;|正| E[任意温度自发]\n  C --&gt;|负| F[低温自发]\n  D --&gt;|正| G[高温自发]\n  D --&gt;|负| H[任意温度不自发]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两个符号组合出四种情况，核心是看温度能否让 TΔS 项压过 ΔH 项。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：ΔG 像一个人的月度收支。ΔH 是固定支出（放热为负，相当于省钱），TΔS 是随气温变化的浮动收入。两项合起来为正还是为负，决定这个月能不能撑下去。这个类比在&quot;ΔG 是状态函数、与路径无关&quot;这一点上要补充说明，收支过程则有路径。<\/p>\n<p>实例：碳酸钙分解 CaCO₃(s) → CaO(s) + CO₂(g)，ΔH = +178 kJ/mol，ΔS = +160 J/(mol·K)。 ΔG = 178 − T×0.160。令 ΔG = 0，T = 1112 K ≈ 839 ℃。所以石灰窑要烧到 900 ℃ 以上。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;放热反应一定自发&quot;——若熵减很大，低温下可能自发，高温下不自发；有些放热反应在特定温度下反而不自发。\n<\/li><li>\n别以为&quot;ΔG &lt; 0 表示反应很快&quot;——ΔG 只判断方向，不判断速率。速率看活化能。\n<\/li><li>\n别以为&quot;单质的标准熵为零&quot;——只有生成焓规定为零，熵不为零。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列过程熵增的是（ ）。A. 水结冰 B. 气体液化 C. CaCO₃分解产生CO₂ D. 溶液结晶\n<p>（答案：C；解析：固体分解出气体，混乱度增大。）<\/p>\n<\/ol>\n<ol><li>\n某反应 ΔH = −50 kJ/mol，ΔS = −100 J/(mol·K)，在 298 K 时是否自发？\n<p>（答案：自发；解析：先把 ΔS 换成 kJ 单位，−100 J/(mol·K) = −0.100 kJ/(mol·K)。ΔG = −50 − 298×(−0.100) = −50 + 29.8 = −20.2 kJ/mol &lt; 0，所以自发。这里容易错在单位：J 和 kJ 混用会差 1000 倍。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;ΔG° 越负，反应速率越快。&quot;\n<p>（答案：不对。ΔG° 只反映热力学趋势，速率由活化能决定。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n熵看混乱度：气 &gt; 液 &gt; 固。\n<\/li><li>\nΔG = ΔH − TΔS，四种符号组合决定温度依赖。\n<\/li><li>\nΔG° = −RT ln K，热力学与平衡的桥梁。\n<\/ul>", "kind": "chapter", "title": "第 4 章：熵与吉布斯自由能"}, "ch05": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第6章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：热化学与盖斯定律<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：熵与吉布斯自由能<\/a><\/span><\/div><h1>第 5 章：化学平衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 3、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出平衡常数表达式并计算 K；\n<\/li><li>\n用反应商 Q 与 K 比较判断反应方向；\n<\/li><li>\n用 ICE 表算平衡浓度；\n<\/li><li>\n判断浓度、压强、温度改变时平衡如何移动。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>平衡常数 K 只随温度变化；Q 与 K 的比较告诉你反应往哪边走。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：平衡常数（难度：进阶）<\/h3>\n<p>对一般反应 <span class=\"katex-inline\">aA + bB \\rightleftharpoons cC + dD<\/span>，平衡时：<\/p>\n<div class=\"katex-block\">K_c = \\frac{[C]^c [D]^d}{[A]^a [B]^b}<\/div>\n<p>纯固体和纯液体不写进表达式，因为它们的&quot;浓度&quot;是常数。气体可以用分压表示，得到 Kp：<\/p>\n<div class=\"katex-block\">K_p = \\frac{p_C^c p_D^d}{p_A^a p_B^b}<\/div>\n<p>Kp 与 Kc 的关系：<span class=\"katex-inline\">K_p = K_c (RT)^{\\Delta n}<\/span>，Δn 是气体分子数变化。<\/p>\n<p>K 的大小说明反应进行的程度：K 很大（&gt;10⁵），基本进行完全；K 很小（&lt;10⁻⁵），几乎不反应；K 在中间，是可逆反应。<\/p>\n<h3>概念 2：反应商 Q（难度：进阶）<\/h3>\n<p>把当前浓度（不是平衡浓度）代入 K 的表达式，得到反应商 Q。<\/p>\n<ul><li>\nQ &lt; K：生成物还不够，反应向正方向进行。\n<\/li><li>\nQ = K：已达平衡。\n<\/li><li>\nQ &gt; K：生成物过多，反应向逆方向进行。\n<\/ul>\n<p>Q 和 K 的表达式形式完全一样，区别只是&quot;当前&quot;还是&quot;平衡&quot;。<\/p>\n<h3>概念 3：ICE 表计算（难度：高难）<\/h3>\n<p>ICE 表是 Initial（初始）、Change（变化）、Equilibrium（平衡）三行表。<\/p>\n<p>例：1.00 L 容器中，初始 0.100 mol H₂ 和 0.100 mol I₂，反应 H₂ + I₂ ⇌ 2HI，K = 64.0，求平衡浓度。<\/p>\n<p>设反应掉 x mol/L：<\/p>\n<ul><li>\nH₂：0.100 − x\n<\/li><li>\nI₂：0.100 − x\n<\/li><li>\nHI：2x\n<\/ul>\n<p>代入 K：<span class=\"katex-inline\">64.0 = \\frac{(2x)^2}{(0.100-x)^2}<\/span>。开方得 <span class=\"katex-inline\">8 = \\frac{2x}{0.100-x}<\/span>，解得 x = 0.080。 平衡浓度：H₂ = I₂ = 0.020 mol/L，HI = 0.160 mol/L。<\/p>\n<p>开方时要注意正负号，浓度不能为负，取正根。<\/p>\n<h3>概念 4：平衡移动（难度：进阶）<\/h3>\n<p>勒夏特列原理：改变条件，平衡向减弱这种改变的方向移动。<\/p>\n<ul><li>\n加反应物：正向移动。\n<\/li><li>\n升温：向吸热方向移动，K 随之改变。\n<\/li><li>\n加压：向气体分子数少的方向移动，K 不变。\n<\/li><li>\n加催化剂：不移动，K 不变。\n<\/ul>\n<p>注意，K 只受温度影响。浓度、压强改变的是 Q，平衡移动是因为 Q 暂时不等于 K。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[计算 Q] --&gt; B{Q 与 K 比较}\n  B --&gt;|Q &lt; K| C[正向移动]\n  B --&gt;|Q = K| D[平衡]\n  B --&gt;|Q &gt; K| E[逆向移动]\n  C --&gt; F[重新平衡 Q=K]\n  E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：任何移动都是让 Q 重新回到 K。K 本身只有在温度改变时才变。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：K 是&quot;目标水位&quot;，Q 是&quot;当前水位&quot;。水位低于目标就注水（正向），高于目标就排水（逆向）。这个类比在&quot;温度改变会改变目标水位&quot;这一点上要补一句：升温相当于把刻度线挪了。<\/p>\n<p>实例：合成氨 N₂ + 3H₂ ⇌ 2NH₃，Kp 随温度升高而减小。所以工业上低温有利于产率，但速率太慢，实际取 400–500 ℃。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;平衡常数会随浓度改变&quot;——K 只与温度有关，浓度变了 K 不变。\n<\/li><li>\n别以为&quot;加催化剂能提高 K&quot;——催化剂只缩短达到平衡的时间。\n<\/li><li>\n别以为&quot;固体不能写进 K 表达式是因为它不参加反应&quot;——它参加反应，只是活度视为 1。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n对反应 C(s) + CO₂(g) ⇌ 2CO(g)，Kc 的表达式是（ ）。\n<p>（答案：<span class=\"katex-inline\">K_c = \\frac{[CO]^2}{[CO_2]}<\/span>；解析：固体 C 不写入表达式。）<\/p>\n<\/ol>\n<ol><li>\n某温度下 K = 10，当前 Q = 5，反应向哪个方向进行？\n<p>（答案：正方向；解析：Q &lt; K，生成物不足。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;增大压强，所有反应的平衡都向气体分子数少的方向移动。&quot;\n<p>（答案：不对。只有反应前后气体分子数不同的反应，加压才会明显移动；若两边气体分子数相等，加压不移动。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nK 只随温度变，Q 随浓度变。\n<\/li><li>\nQ &lt; K 正向，Q &gt; K 逆向。\n<\/li><li>\nICE 表：初始、变化、平衡三行，代入 K 解方程。\n<\/ul>", "kind": "chapter", "title": "第 5 章：化学平衡"}, "ch06": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第8章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：化学平衡<\/a><\/span><\/div><h1>第 6 章：酸碱电离平衡与缓冲溶液<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 Brønsted 理论判断共轭酸碱对；\n<\/li><li>\n算强酸、弱酸、弱碱溶液的 pH；\n<\/li><li>\n用 Henderson–Hasselbalch 方程算缓冲溶液 pH；\n<\/li><li>\n判断盐溶液的水解酸碱性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>酸碱反应是质子转移；弱酸的 Ka 和它的共轭碱 Kb 通过 Kw 联系在一起。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Brønsted 酸碱理论（难度：基础）<\/h3>\n<p><strong>酸<\/strong>是能给出质子（H⁺）的物质，<strong>碱<\/strong>是能接受质子的物质。酸给出质子后变成它的<strong>共轭碱<\/strong>，碱接受质子后变成它的<strong>共轭酸<\/strong>。<\/p>\n<p>HCl + H₂O ⇌ H₃O⁺ + Cl⁻：HCl 是酸，Cl⁻ 是它的共轭碱；H₂O 是碱，H₃O⁺ 是它的共轭酸。<\/p>\n<p>水既能当酸又能当碱，叫两性物质。NH₃ 也是碱，接受质子变 NH₄⁺。<\/p>\n<h3>概念 2：水的电离与 pH（难度：基础）<\/h3>\n<div class=\"katex-block\">H_2O \\rightleftharpoons H^+ + OH^-,\\quad K_w = [H^+][OH^-] = 1.0\\times10^{-14}\\ (25℃)<\/div>\n<p>pH = −lg[H⁺]。中性水 pH = 7，酸性 pH &lt; 7，碱性 pH &gt; 7。注意这个&quot;7&quot;只在 25 ℃ 成立，温度升高 Kw 变大，中性 pH 会小于 7。<\/p>\n<h3>概念 3：弱酸弱碱的电离（难度：进阶）<\/h3>\n<p>弱酸 HA 的电离：<span class=\"katex-inline\">K_a = \\frac{[H^+][A^-]}{[HA]}<\/span>。Ka 越大，酸性越强。<\/p>\n<p>计算 0.10 mol/L CH₃COOH（Ka = 1.8×10⁻⁵）的 pH： 设 [H⁺] = x，近似 <span class=\"katex-inline\">K_a \\approx \\frac{x^2}{0.10 - x} \\approx \\frac{x^2}{0.10}<\/span>。 <span class=\"katex-inline\">x = \\sqrt{K_a \\times 0.10} = \\sqrt{1.8\\times10^{-6}} = 1.34\\times10^{-3}<\/span>，pH = 2.87。<\/p>\n<p>近似条件：Ka 很小、解离度 &lt; 5% 时，可以忽略分母里的 x。若不能忽略，就要解一元二次方程。<\/p>\n<p>共轭碱的 Kb 与 Ka 的关系：<span class=\"katex-inline\">K_a \\cdot K_b = K_w<\/span>。所以酸越弱，其共轭碱越强。<\/p>\n<h3>概念 4：缓冲溶液（难度：高难）<\/h3>\n<p>缓冲溶液由弱酸及其共轭碱（或弱碱及其共轭酸）组成，能抵抗少量酸碱，pH 基本不变。<\/p>\n<p>Henderson–Hasselbalch 方程：<\/p>\n<div class=\"katex-block\">pH = pK_a + \\lg\\frac{[A^-]}{[HA]}<\/div>\n<p>当 [A⁻] = [HA] 时，pH = pKa，缓冲能力最强。缓冲范围大约是 pKa ± 1。<\/p>\n<p>例：0.10 mol/L CH₃COOH 与 0.10 mol/L CH₃COONa 等体积混合，pKa = 4.74，pH = 4.74。<\/p>\n<h3>概念 5：盐的水解（难度：进阶）<\/h3>\n<p>盐溶于水后，离子与水反应改变 pH：<\/p>\n<ul><li>\n强酸强碱盐（NaCl）：不水解，中性。\n<\/li><li>\n强酸弱碱盐（NH₄Cl）：NH₄⁺ 水解显酸性。\n<\/li><li>\n强碱弱酸盐（Na₂CO₃）：CO₃²⁻ 水解显碱性。\n<\/li><li>\n弱酸弱碱盐（NH₄Ac）：两者都水解，酸碱性看 Ka 与 Kb 的相对大小。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[盐溶液] --&gt; B{哪一离子水解?}\n  B --&gt;|阳离子| C[显酸性 NH4Cl]\n  B --&gt;|阴离子| D[显碱性 Na2CO3]\n  B --&gt;|都不水解| E[中性 NaCl]\n  B --&gt;|都水解| F[比较 Ka 与 Kb]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先看盐由谁构成，再判断哪个离子能水解。两边都水解时，比较常数大小。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：缓冲溶液像水库。加一点水（加酸）水位上升不多，放一点水（加碱）水位下降不多，因为库容大。这个类比在&quot;缓冲容量有限&quot;处要补一句：加太多酸，水库也会溢。<\/p>\n<p>实例：人体血液 pH 维持在 7.35–7.45，主要靠 H₂CO₃ / HCO₃⁻ 缓冲体系。如果 pH 低于 7.35 就是酸中毒，高于 7.45 是碱中毒。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;pH = 7 一定是中性&quot;——只在 25 ℃ 成立，高温下中性 pH 小于 7。\n<\/li><li>\n别以为&quot;弱酸稀释一倍，pH 升高 0.3&quot;——那是强酸的规律，弱酸稀释时电离度增大，pH 变化更小。\n<\/li><li>\n别以为&quot;缓冲溶液能无限抵抗酸碱&quot;——缓冲容量有限，超过范围就失效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n0.01 mol/L HCl 的 pH 是多少？\n<p>（答案：2；解析：强酸完全电离，[H⁺] = 0.01，pH = −lg0.01 = 2。）<\/p>\n<\/ol>\n<ol><li>\n已知 CH₃COOH 的 Ka = 1.8×10⁻⁵，其共轭碱 CH₃COO⁻ 的 Kb 是多少？\n<p>（答案：<span class=\"katex-inline\">5.6\\times10^{-10}<\/span>；解析：Kb = Kw/Ka = 1.0×10⁻¹⁴ / 1.8×10⁻⁵。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;NH₄Cl 溶液显酸性，是因为 NH₄⁺ 能电离出 H⁺。&quot;\n<p>（答案：说法不准确。NH₄⁺ 本身不能直接电离出 H⁺，是它作为弱酸与水反应（水解）放出 H⁺，本质是质子转移。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n酸碱看质子转移，共轭成对。\n<\/li><li>\nKa·Kb = Kw；酸越弱，共轭碱越强。\n<\/li><li>\n缓冲 pH = pKa + lg([碱]/[酸])。\n<\/ul>", "kind": "chapter", "title": "第 6 章：酸碱电离平衡与缓冲溶液"}, "ch07": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第9章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：化学平衡<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch06\">第 6 章：酸碱电离平衡与缓冲溶液<\/a><\/span><\/div><h1>第 7 章：沉淀溶解平衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 5、6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写溶度积 Ksp 表达式；\n<\/li><li>\n用 Q 与 Ksp 判断沉淀生成或溶解；\n<\/li><li>\n计算同离子效应下的溶解度；\n<\/li><li>\n判断沉淀转化和分步沉淀的顺序。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>难溶电解质并非&quot;完全不溶&quot;，而是溶解与沉淀达到平衡；Ksp 是这种平衡的定量表达。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：溶度积（难度：基础）<\/h3>\n<p>对难溶电解质 <span class=\"katex-inline\">A_mB_n(s) \\rightleftharpoons mA^{n+} + nB^{m-}<\/span>：<\/p>\n<div class=\"katex-block\">K_{sp} = [A^{n+}]^m [B^{m-}]^n<\/div>\n<p>纯固体不写入表达式。Ksp 只随温度变化，和浓度无关。<\/p>\n<p>例：AgCl 的 Ksp = 1.8×10⁻¹⁰，则饱和溶液中 [Ag⁺][Cl⁻] = 1.8×10⁻¹⁰，溶解度 s = √Ksp ≈ 1.34×10⁻⁵ mol/L。<\/p>\n<h3>概念 2：溶度积规则（难度：进阶）<\/h3>\n<p>把当前离子浓度代入 Ksp 表达式得到 Q：<\/p>\n<ul><li>\nQ &lt; Ksp：不饱和，沉淀溶解。\n<\/li><li>\nQ = Ksp：饱和，达到平衡。\n<\/li><li>\nQ &gt; Ksp：过饱和，生成沉淀。\n<\/ul>\n<p>这是判断&quot;加两种溶液会不会产生沉淀&quot;的标准方法。<\/p>\n<h3>概念 3：同离子效应（难度：进阶）<\/h3>\n<p>在饱和溶液中加入含有相同离子的强电解质，平衡向生成沉淀方向移动，溶解度降低。<\/p>\n<p>例：AgCl 在 0.10 mol/L NaCl 中的溶解度。设 s 为溶解度，[Ag⁺] = s，[Cl⁻] ≈ 0.10（来自 NaCl，远大于 s）。 Ksp = s × 0.10 = 1.8×10⁻¹⁰，s = 1.8×10⁻⁹ mol/L。比纯水中的 1.34×10⁻⁵ 小约一万倍。<\/p>\n<h3>概念 4：沉淀转化与分步沉淀（难度：高难）<\/h3>\n<p><strong>沉淀转化<\/strong>：溶解度大的沉淀转化为溶解度小的沉淀。如 AgCl 加 KI 变 AgI： AgCl(s) + I⁻ → AgI(s) + Cl⁻ 平衡常数 K = Ksp(AgCl)/Ksp(AgI) = 1.8×10⁻¹⁰ / 8.5×10⁻¹⁷ ≈ 2×10⁶，反应很彻底。<\/p>\n<p><strong>分步沉淀<\/strong>：溶液中同时有多种离子，加沉淀剂时，Ksp 小的先沉淀。判断谁先沉淀，要算&quot;开始沉淀所需的沉淀剂浓度&quot;，需要浓度小的先沉淀。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[混合溶液] --&gt; B[计算 Q]\n  B --&gt; C{Q 与 Ksp}\n  C --&gt;|Q &lt; Ksp| D[不沉淀 溶解]\n  C --&gt;|Q = Ksp| E[饱和]\n  C --&gt;|Q &gt; Ksp| F[沉淀]\n  F --&gt; G{多种离子?}\n  G --&gt;|是| H[Ksp 小的先沉淀]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：Q 与 Ksp 的关系就是&quot;过饱和与否&quot;。多种离子共存时，分别算各自的 Q，先达到 Ksp 的先沉淀。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：Ksp 像电影院满座的票数上限。人少于上限还能进（不饱和），正好满座（饱和），再来人就进不去（沉淀）。这个类比在&quot;同离子效应&quot;处很贴切：门口已经排了同一部电影的长队，能进的人更少。<\/p>\n<p>实例：判断 0.010 mol/L AgNO₃ 与 0.010 mol/L NaCl 等体积混合是否沉淀。混合后浓度各减半，Q = 0.005×0.005 = 2.5×10⁻⁵ &gt; Ksp(AgCl) = 1.8×10⁻¹⁰，产生沉淀。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;Ksp 越小，溶解度一定越小&quot;——只有同类型（如都是 AB 型）才能直接比，AB₂ 与 AB 型不能直接比。\n<\/li><li>\n别以为&quot;沉淀完全就是离子浓度为 0&quot;——通常指残余离子浓度小于 10⁻⁵ mol/L。\n<\/li><li>\n别以为&quot;加沉淀剂越多越好&quot;——过量可能引起络合溶解或增加杂质。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出 BaSO₄ 的 Ksp 表达式。\n<p>（答案：Ksp = [Ba²⁺][SO₄²⁻]；解析：固体不写入。）<\/p>\n<\/ol>\n<ol><li>\nAgCl 的 Ksp = 1.8×10⁻¹⁰，在纯水中的溶解度约为多少？\n<p>（答案：1.34×10⁻⁵ mol/L；解析：s² = Ksp，开方。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;Ksp(AgCl) &gt; Ksp(AgI)，所以向含 Cl⁻、I⁻ 的溶液中加 AgNO₃，AgCl 先沉淀。&quot;\n<p>（答案：不对。Ksp 小的 AgI 先沉淀。Ksp 大反而需要更高的 Ag⁺ 浓度才能达到沉淀条件。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nKsp 只与温度有关，固体不写进表达式。\n<\/li><li>\nQ &gt; Ksp 沉淀，Q &lt; Ksp 溶解。\n<\/li><li>\n同离子效应降低溶解度；Ksp 小的先沉淀。\n<\/ul>", "kind": "chapter", "title": "第 7 章：沉淀溶解平衡"}, "ch08": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第10章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：熵与吉布斯自由能<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：化学平衡<\/a><\/span><\/div><h1>第 8 章：氧化还原与电化学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用氧化数配平氧化还原方程式；\n<\/li><li>\n画出原电池并写出正负极反应；\n<\/li><li>\n用标准电极电势判断氧化剂还原剂强弱；\n<\/li><li>\n用 Nernst 方程算非标准状态下的电动势。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>氧化还原是电子转移；原电池把这种转移拆成两半，让电子走外电路做功。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：氧化数与配平（难度：进阶）<\/h3>\n<p><strong>氧化数<\/strong>是假设把成键电子完全归给电负性大的原子后，某原子所带的电荷数。规则：<\/p>\n<ul><li>\n单质中为 0。\n<\/li><li>\nO 通常为 −2（过氧化物中为 −1，OF₂ 中为 +2）。\n<\/li><li>\nH 通常为 +1（与活泼金属形成的氢化物中为 −1）。\n<\/li><li>\n化合物中各氧化数代数和为 0，离子等于其电荷。\n<\/ul>\n<p>配平步骤：标氧化数 → 找升降 → 配电子 → 配原子 → 配电荷（酸性补 H⁺，碱性补 OH⁻）→ 查。<\/p>\n<h3>概念 2：原电池（难度：进阶）<\/h3>\n<p>原电池把化学能转成电能。以锌铜电池为例：<\/p>\n<ul><li>\n负极（Zn）：Zn → Zn²⁺ + 2e⁻，发生氧化。\n<\/li><li>\n正极（Cu）：Cu²⁺ + 2e⁻ → Cu，发生还原。\n<\/li><li>\n盐桥：平衡两侧电荷，Cl⁻ 向锌侧移动，K⁺ 向铜侧移动。\n<\/ul>\n<p>电子从负极经外电路流向正极，电流方向相反。记法：负极失电子、正极得电子。<\/p>\n<h3>概念 3：标准电极电势（难度：高难）<\/h3>\n<p><strong>标准电极电势<\/strong> E° 是电极相对于标准氢电极（E° = 0）的电势，单位 V。代数值越大，氧化型得电子能力越强，是越强的氧化剂。<\/p>\n<p>判断反应方向：E°(氧化剂) &gt; E°(还原剂对应的氧化型)，反应自发。电池电动势：<\/p>\n<div class=\"katex-block\">E^\\circ_{\\text{电池}} = E^\\circ_{\\text{正极}} - E^\\circ_{\\text{负极}}<\/div>\n<p>E° 越正，反应趋势越大。<span class=\"katex-inline\">\\Delta G^\\circ = -nFE^\\circ<\/span>，n 是转移电子数，F = 96500 C/mol。<\/p>\n<h3>概念 4：Nernst 方程（难度：高难）<\/h3>\n<p>非标准状态下：<\/p>\n<div class=\"katex-block\">E = E^\\circ - \\frac{RT}{nF}\\ln Q = E^\\circ - \\frac{0.0592}{n}\\lg Q\\ (25℃)<\/div>\n<p>Q 是反应商，形式与平衡常数相同。浓度降低、分压减小，电极电势改变。例：Cu²⁺ 浓度从 1 mol/L 降到 0.01 mol/L，E 下降约 0.059 V。<\/p>\n<h3>概念 5：电解与化学电源（难度：进阶）<\/h3>\n<p><strong>电解<\/strong>是用外加电源迫使非自发反应进行。电解池的阳极接电源正极，发生氧化；阴极接负极，发生还原。<\/p>\n<p>常见化学电源：锌锰干电池、铅酸蓄电池、锂离子电池、氢氧燃料电池。燃料电池的特点是反应物从外部持续输入，能量转换效率高。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[负极 Zn] --&gt;|电子| B[外电路]\n  B --&gt; C[正极 Cu]\n  A --&gt; D[Zn2+ 进入溶液]\n  C --&gt; E[Cu2+ 得到电子]\n  D --&gt; F[盐桥平衡电荷]\n  E --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：电子只走外电路，离子只走溶液和盐桥。两条路线闭合，电流才能持续。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：原电池像两个人传球。负极把电子&quot;传&quot;出去，正极接住。盐桥是场边的补给员，保持两边电荷平衡。这个类比在&quot;电极电势决定谁能当负极&quot;这一点上要补一句：传球方向由电势差决定，不是随便定的。<\/p>\n<p>实例：判断 Zn + Cu²⁺ → Zn²⁺ + Cu 能否自发。E°(Cu²⁺/Cu) = +0.34 V，E°(Zn²⁺/Zn) = −0.76 V，电池电动势 = 0.34 − (−0.76) = 1.10 V &gt; 0，自发。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;负极就是阴极&quot;——原电池负极是阳极（氧化），电解池阴极是还原。名称要对准装置类型。\n<\/li><li>\n别以为&quot;电极电势越负，金属越不活泼&quot;——越负表示越容易失电子，金属越活泼。\n<\/li><li>\n别以为&quot;E° 与浓度有关&quot;——E° 是标准态的值，浓度影响的是实际电极电势 E。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n原电池中，电子从（ ）极流向（ ）极。\n<p>（答案：负、正；解析：负极失电子，电子经外电路流向正极。）<\/p>\n<\/ol>\n<ol><li>\n已知 E°(Ag⁺/Ag) = +0.80 V，E°(Cu²⁺/Cu) = +0.34 V，反应 Cu + 2Ag⁺ → Cu²⁺ + 2Ag 的电动势是多少？\n<p>（答案：0.46 V；解析：E = 0.80 − 0.34。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;电极电势越大的电对，其氧化型一定是越强的氧化剂。&quot;\n<p>（答案：对。E° 越大，得电子能力越强。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n氧化数配平：电子守恒优先。\n<\/li><li>\n原电池负极氧化、正极还原；电子走外电路。\n<\/li><li>\nE° 比大小判方向，Nernst 方程修浓度。\n<\/ul>", "kind": "chapter", "title": "第 8 章：氧化还原与电化学"}, "ch09": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第7章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch05\">第 5 章：化学平衡<\/a><\/span><\/div><h1>第 9 章：化学反应速率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n由实验数据确定速率方程和反应级数；\n<\/li><li>\n用 Arrhenius 方程算活化能；\n<\/li><li>\n解释温度、催化剂、浓度对速率的影响；\n<\/li><li>\n区分基元反应和复杂反应机理。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>速率由活化能和碰撞频率决定；温度升高靠&quot;更多分子越过能垒&quot;，催化剂靠&quot;把能垒降低&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：速率方程与反应级数（难度：进阶）<\/h3>\n<p>对反应 aA + bB → 产物，速率方程写成：<\/p>\n<div class=\"katex-block\">v = k[A]^m[B]^n<\/div>\n<p>m、n 是实验测得的反应级数，不一定等于方程式系数。只有基元反应，级数才等于系数。<\/p>\n<p>常见类型：<\/p>\n<ul><li>\n零级：v = k，浓度变化不影响速率（如表面催化饱和）。\n<\/li><li>\n一级：v = k[A]，半衰期与初始浓度无关。\n<\/li><li>\n二级：v = k[A]² 或 k[A][B]。\n<\/ul>\n<p>由实验数据求级数：看初始浓度加倍时速率变化几倍。浓度加倍、速率加倍 → 一级；速率变 4 倍 → 二级。<\/p>\n<h3>概念 2：活化能与 Arrhenius 方程（难度：高难）<\/h3>\n<p><strong>活化能<\/strong> Ea 是反应物分子变成活化分子所需的最小能量。只有能量 ≥ Ea 的分子才能发生有效碰撞。<\/p>\n<p>Arrhenius 方程：<\/p>\n<div class=\"katex-block\">k = A e^{-E_a/RT}<\/div>\n<p>取对数：<span class=\"katex-inline\">\\ln k = \\ln A - \\frac{E_a}{RT}<\/span>。用两个温度下的 k 值可以求 Ea：<\/p>\n<div class=\"katex-block\">\\ln\\frac{k_2}{k_1} = \\frac{E_a}{R}\\left(\\frac{1}{T_1} - \\frac{1}{T_2}\\right)<\/div>\n<p>经验规律：温度每升高 10 ℃，速率约变为原来的 2–4 倍。这不是精确公式，是数量级估计。<\/p>\n<h3>概念 3：催化剂（难度：进阶）<\/h3>\n<p>催化剂改变反应路径，降低活化能，使更多分子能越过能垒。催化剂不改变始末态，所以不影响 ΔH、ΔG 和平衡常数。<\/p>\n<p>催化剂有选择性：一种催化剂只对特定反应有效。酶是生物催化剂，选择性极高。<\/p>\n<h3>概念 4：反应机理（难度：进阶）<\/h3>\n<p>复杂反应由多个基元步骤组成，其中最慢的一步叫<strong>决速步<\/strong>，它决定整体速率。机理必须满足：各基元步骤相加等于总反应；速率方程与实验一致。<\/p>\n<p>例：H₂ + I₂ → 2HI 曾被当作一步反应，后来实验发现是两步：I₂ ⇌ 2I（快），2I + H₂ → 2HI（慢）。决速步是第二步。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[反应物] --&gt;|吸收活化能| B[活化络合物]\n  B --&gt;|释放能量| C[产物]\n  A --&gt; D[反应进程]\n  B --&gt; D\n  C --&gt; D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：活化络合物是能量最高点，Ea 是起点到峰顶的高度。催化剂让峰顶变低，反应更容易发生。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：活化能像翻墙。墙越高，能翻过去的人越少（速率越慢）。升温相当于给每个人更多助跑能量，催化剂相当于在墙上开一个门。这个类比在&quot;催化剂不改变终点高度&quot;这点上正好成立。<\/p>\n<p>实例：某反应 300 K 时 k = 1.0×10⁻³，310 K 时 k = 2.5×10⁻³，求 Ea。 ln(2.5) = Ea/8.314 × (1/300 − 1/310) = Ea/8.314 × 1.075×10⁻⁴。 Ea = 0.916 × 8.314 / 1.075×10⁻⁴ ≈ 70.8 kJ/mol。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;反应级数等于方程式系数&quot;——只有基元反应才相等，复杂反应要实验测。\n<\/li><li>\n别以为&quot;催化剂能改变平衡常数&quot;——催化剂只改变速率，K 只受温度影响。\n<\/li><li>\n别以为&quot;活化能越低反应一定越快&quot;——还要看指前因子 A（碰撞频率、取向）。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n某反应浓度加倍，速率变为原来的 4 倍，反应级数是（ ）。\n<p>（答案：2；解析：v ∝ [A]²，浓度 2 倍 → 速率 4 倍。）<\/p>\n<\/ol>\n<ol><li>\n升高温度，活化分子百分数（ ）。A. 增大 B. 减小 C. 不变 D. 无法判断\n<p>（答案：A；解析：能量分布右移，超过 Ea 的分子比例增大。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;催化剂使正反应速率加快，所以平衡向正方向移动。&quot;\n<p>（答案：不对。催化剂同等加快正逆反应，平衡不移动。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n速率方程由实验定，级数看浓度加倍后的倍数。\n<\/li><li>\nArrhenius：ln k 与 1/T 成直线，斜率 −Ea/R。\n<\/li><li>\n决速步是最慢的基元步骤。\n<\/ul>", "kind": "chapter", "title": "第 9 章：化学反应速率"}, "ch10": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第11章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch04\">第 4 章：熵与吉布斯自由能<\/a><\/span><\/div><h1>第 10 章：原子结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 4 章、入门篇第 8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清四个量子数的含义和取值；\n<\/li><li>\n写出前 36 号元素的电子排布式；\n<\/li><li>\n用 Hund 规则、Pauli 原理、能量最低原理解释排布；\n<\/li><li>\n解释原子半径、电离能、电负性的周期性变化。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>电子没有确定轨道，只有&quot;出现在某处的概率&quot;；量子数描述的就是这种概率分布的形状、方向和能量。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从 Bohr 到量子力学（难度：进阶）<\/h3>\n<p>Bohr 模型假设电子在固定轨道上绕核运动，能解释氢原子光谱，但解释不了多电子原子。量子力学改用<strong>波函数<\/strong>描述电子，波函数绝对值的平方表示电子出现的概率密度。<\/p>\n<p><strong>原子轨道<\/strong>不是&quot;轨道&quot;，而是电子出现概率最大的空间区域。<\/p>\n<h3>概念 2：四个量子数（难度：高难）<\/h3>\n<ul><li>\n<strong>主量子数 n<\/strong>：决定电子层和能量，n = 1, 2, 3…，对应 K、L、M 层。\n<\/li><li>\n<strong>角量子数 l<\/strong>：决定轨道形状，取值 0 到 n−1，对应 s、p、d、f。\n<\/li><li>\n<strong>磁量子数 m<\/strong>：决定轨道方向，取值 −l 到 +l，共 2l+1 个。\n<\/li><li>\n<strong>自旋量子数 ms<\/strong>：只有 +½ 和 −½ 两个值。\n<\/ul>\n<p>一个原子轨道由 n、l、m 三个量子数确定，最多容纳 2 个电子（自旋相反）。第 n 层最多容纳 2n² 个电子。<\/p>\n<h3>概念 3：电子排布三原则（难度：高难）<\/h3>\n<ul><li>\n<strong>能量最低原理<\/strong>：电子先填能量低的轨道。\n<\/li><li>\n<strong>Pauli 不相容原理<\/strong>：一个轨道最多 2 个电子，且自旋相反。\n<\/li><li>\n<strong>Hund 规则<\/strong>：简并轨道（能量相同的轨道）上，电子先单独占据，自旋平行。\n<\/ul>\n<p>能级顺序要记：1s &lt; 2s &lt; 2p &lt; 3s &lt; 3p &lt; 4s &lt; 3d &lt; 4p &lt; 5s &lt; 4d &lt; 5p。4s 低于 3d，这是&quot;能级交错&quot;。<\/p>\n<p>例：Fe（26 号）的排布：1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s²。写成简化式：[Ar]3d⁶4s²。<\/p>\n<h3>概念 4：元素性质的周期性（难度：进阶）<\/h3>\n<ul><li>\n<strong>原子半径<\/strong>：同周期从左到右减小（核电荷增大，吸引增强）；同主族从上到下增大（电子层增多）。\n<\/li><li>\n<strong>电离能<\/strong>：气态原子失去 1 个电子所需的最小能量。同周期从左到右增大，同主族从上到下减小。稀有气体电离能最大，碱金属最小。\n<\/li><li>\n<strong>电负性<\/strong>：原子在化合物中吸引电子的能力。F 最大（4.0），Cs 最小（0.7）。同周期从左到右增大，同主族从上到下减小。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[原子轨道] --&gt; B[n 电子层]\n  A --&gt; C[l 形状 s p d f]\n  A --&gt; D[m 方向]\n  A --&gt; E[ms 自旋]\n  B --&gt; F[能量]\n  C --&gt; F\n  D --&gt; G[空间取向]\n  E --&gt; H[每个轨道最多2e]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四个量子数各管一件事，合起来唯一确定一个电子的状态。Pauli 原理限制每个轨道最多两个电子。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：原子轨道像酒店房间。n 是楼层，l 是房间类型（单间/套房），m 是房间号，ms 是同一张床上最多睡两个人的性别搭配（必须相反）。这个类比在&quot;电子没有确定位置、只有概率&quot;这一点上失效，酒店房间是确定的。<\/p>\n<p>实例：写出 Cr（24 号）的排布。按常规应是 [Ar]3d⁴4s²，但半充满 3d⁵ 更稳定，实际是 [Ar]3d⁵4s¹。这种&quot;半充满、全充满更稳定&quot;的特例要单独记：Cr、Cu。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;电子在固定轨道上绕圈&quot;——量子力学里只有概率分布。\n<\/li><li>\n别以为&quot;4s 一定比 3d 先填满&quot;——能级交错，4s 先填，但失电子时先失 4s。\n<\/li><li>\n别以为&quot;电负性越大，非金属性一定越强&quot;——总体成立，但要结合具体反应判断。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nn = 3 时，l 可以取哪些值？\n<p>（答案：0、1、2；解析：l 取 0 到 n−1。）<\/p>\n<\/ol>\n<ol><li>\n某元素排布为 1s²2s²2p⁶3s²3p⁵，它是（ ）号元素。\n<p>（答案：17，氯；解析：电子总数 2+2+6+2+5=17。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;同一周期从左到右，原子半径逐渐增大。&quot;\n<p>（答案：不对。核电荷增大，对电子吸引增强，半径逐渐减小。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四个量子数：n 层、l 形、m 向、ms 旋。\n<\/li><li>\n排布三原则：能量最低、Pauli、Hund。\n<\/li><li>\n周期规律：同周期右移半径减小、电负性增大。\n<\/ul>", "kind": "chapter", "title": "第 10 章：原子结构"}, "ch11": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第12章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch10\">第 10 章：原子结构<\/a><\/span><\/div><h1>第 11 章：化学键与分子结构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n画出常见分子的 Lewis 结构；\n<\/li><li>\n用 VSEPR 理论判断分子空间构型；\n<\/li><li>\n判断中心原子的杂化类型；\n<\/li><li>\n解释分子的极性和分子间作用力。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>分子形状由&quot;中心原子周围电子对互相排斥&quot;决定；杂化轨道是原子为了成键而重新组合的轨道。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Lewis 结构（难度：进阶）<\/h3>\n<p>Lewis 结构用短线表示共用电子对，用点表示孤对电子。画法：<\/p>\n<ol><li>\n算总价电子数（各原子价电子之和，阴离子加电荷、阳离子减电荷）。\n<\/li><li>\n确定中心原子，通常电负性小的放中间。\n<\/li><li>\n用单键连接，剩余电子先给外围原子补满八隅体。\n<\/li><li>\n不够就形成双键或三键。\n<\/li><li>\n检查形式电荷，尽量小。\n<\/ol>\n<p>例：CO₂ 共 16 个价电子，O=C=O，每个 O 有两对孤对电子。<\/p>\n<h3>概念 2：VSEPR 理论（难度：高难）<\/h3>\n<p><strong>价层电子对互斥理论<\/strong>：中心原子周围的电子对（成键对 + 孤对）互相排斥，尽量远离，形成特定构型。<\/p>\n<p>先算中心原子的价层电子对数：<\/p>\n<div class=\"katex-block\">\\text{对数} = \\frac{\\text{中心原子价电子数} + \\text{配体提供的电子数} \\pm \\text{电荷}}{2}<\/div>\n<p>配体 H、卤素各提供 1 个电子，O、S 提供 0 个（按双键算）。<\/p>\n<p>电子对数与构型：<\/p>\n<ul><li>\n2 对：直线形（CO₂、BeCl₂）\n<\/li><li>\n3 对：平面三角形（BF₃）；有 1 对孤对时 V 形（SO₂）\n<\/li><li>\n4 对：四面体（CH₄）；1 对孤对三角锥（NH₃）；2 对孤对 V 形（H₂O）\n<\/li><li>\n5 对：三角双锥（PCl₅）\n<\/li><li>\n6 对：八面体（SF₆）\n<\/ul>\n<p>孤对电子排斥力大于成键电子对，所以键角会被压缩：CH₄ 109.5°，NH₃ 107°，H₂O 104.5°。<\/p>\n<h3>概念 3：杂化轨道（难度：高难）<\/h3>\n<p>杂化是原子轨道重新组合，形成能量相同、方向更合理的新轨道，便于成键。<\/p>\n<ul><li>\nsp³ 杂化：1 个 s + 3 个 p，4 个等价轨道，四面体，键角 109.5°。CH₄、NH₃、H₂O 的中心原子都是 sp³。\n<\/li><li>\nsp² 杂化：1 个 s + 2 个 p，3 个轨道，平面三角形，键角 120°。C₂H₄ 的双键碳、BF₃、苯环碳。\n<\/li><li>\nsp 杂化：1 个 s + 1 个 p，2 个轨道，直线形，键角 180°。C₂H₂、CO₂。\n<\/ul>\n<p>判断杂化：看中心原子的价层电子对数（σ 键数 + 孤对数），2 → sp，3 → sp²，4 → sp³。注意双键、三键里只有 1 个 σ 键参与杂化判断。<\/p>\n<h3>概念 4：分子极性与分子间作用力（难度：进阶）<\/h3>\n<p><strong>极性分子<\/strong>：正负电荷中心不重合，如 HCl、H₂O、NH₃。 <strong>非极性分子<\/strong>：正负电荷中心重合，如 CO₂、CH₄、CCl₄、BF₃。<\/p>\n<p>判断要看两步：键是否有极性 + 分子是否对称。CO₂ 的 C=O 键有极性，但分子直线对称，整体非极性。<\/p>\n<p>分子间作用力包括色散力、取向力、诱导力和氢键。色散力所有分子都有，分子越大越强。氢键只发生在 H 与 N、O、F 相连时。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[中心原子价层电子对数] --&gt; B{2}\n  A --&gt; C{3}\n  A --&gt; D{4}\n  B --&gt; E[sp 直线 180°]\n  C --&gt; F[sp2 平面三角 120°]\n  D --&gt; G[sp3 四面体 109.5°]\n  G --&gt; H{孤对数}\n  H --&gt;|1| I[三角锥 107°]\n  H --&gt;|2| J[V形 104.5°]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：电子对数先定杂化和大构型，孤对数再修正键角。两步走，不要跳。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：杂化像把四把长短不一的椅子腿锯齐、重新摆方向，好让四条腿稳稳落地。s 和 p 轨道原本形状能量不同，杂化后变成四把一样的&quot;椅子腿&quot;。这个类比在&quot;杂化需要能量输入&quot;这一点上要补一句：杂化本身耗能，但成键放出的能量更多，总体有利。<\/p>\n<p>实例：判断 H₂O 的构型。O 有 6 个价电子，2 个 H 各提供 1 个，共 8 个 → 4 对电子，sp³ 杂化。其中 2 对是孤对，所以是 V 形，键角 104.5°。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;有极性键的分子一定是极性分子&quot;——CO₂、CCl₄ 有极性键，但分子对称，整体非极性。\n<\/li><li>\n别以为&quot;VSEPR 只看成键电子对&quot;——孤对也要算，而且排斥更强。\n<\/li><li>\n别以为&quot;杂化轨道数等于原子轨道数&quot;——几轨道参与就生成几轨道，数目守恒。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nCH₄ 的中心原子杂化类型是（ ）。A. sp B. sp² C. sp³ D. 未杂化\n<p>（答案：C；解析：4 个 σ 键、无孤对，4 对电子，sp³。）<\/p>\n<\/ol>\n<ol><li>\nNH₃ 的空间构型是（ ）。A. 平面三角形 B. 三角锥 C. 四面体 D. 直线形\n<p>（答案：B；解析：4 对电子中有 1 对孤对，三角锥。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;CO₂ 是极性分子，因为 C=O 键是极性键。&quot;\n<p>（答案：不对。分子直线对称，正负电荷中心重合，是非极性分子。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nLewis 先数电子，VSEPR 再算电子对。\n<\/li><li>\n电子对数 2/3/4 对应 sp/sp²/sp³。\n<\/li><li>\n极性 = 键有极性 + 分子不对称。\n<\/ul>", "kind": "chapter", "title": "第 11 章：化学键与分子结构"}, "ch12": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第13、14章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch11\">第 11 章：化学键与分子结构<\/a><\/span><\/div><h1>第 12 章：晶体结构与配位化合物<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分四类晶体并判断其性质；\n<\/li><li>\n说出配位化合物的组成；\n<\/li><li>\n写出配离子的电荷和中心离子配位数；\n<\/li><li>\n命名常见的配位化合物。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>晶体的性质由&quot;构成晶体的粒子种类和粒子间作用力&quot;决定；配合物是中心离子与配体通过配位键结合的统一整体。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：四类晶体（难度：进阶）<\/h3>\n<table><thead><tr><th>晶体类型<\/th><th>构成粒子<\/th><th>作用力<\/th><th>熔点<\/th><th>导电性<\/th><th>例子<\/th><\/tr><\/thead><tbody><tr><td>离子晶体<\/td><td>阴、阳离子<\/td><td>离子键<\/td><td>较高<\/td><td>熔融或水溶液导电<\/td><td>NaCl、MgO<\/td><\/tr><tr><td>分子晶体<\/td><td>分子<\/td><td>范德华力/氢键<\/td><td>低<\/td><td>一般不导电<\/td><td>冰、干冰、I₂<\/td><\/tr><tr><td>原子晶体（共价晶体）<\/td><td>原子<\/td><td>共价键<\/td><td>很高<\/td><td>一般不导电<\/td><td>金刚石、SiO₂、SiC<\/td><\/tr><tr><td>金属晶体<\/td><td>金属阳离子+自由电子<\/td><td>金属键<\/td><td>差异大<\/td><td>良导电<\/td><td>Cu、Fe、Na<\/td><\/tr><\/tbody><\/table>\n<p>判断晶体类型，先看构成粒子，再看作用力强弱。金刚石硬度最大，因为整个晶体是一个巨大的共价网络。<\/p>\n<h3>概念 2：配位化合物的组成（难度：进阶）<\/h3>\n<p>配合物由<strong>中心离子（或原子）<\/strong>和<strong>配体<\/strong>通过<strong>配位键<\/strong>结合成<strong>配离子<\/strong>，再与外界离子组成。<\/p>\n<p>例：[Cu(NH₃)₄]SO₄<\/p>\n<ul><li>\n中心离子：Cu²⁺\n<\/li><li>\n配体：NH₃\n<\/li><li>\n配位数：4\n<\/li><li>\n内界：[Cu(NH₃)₄]²⁺\n<\/li><li>\n外界：SO₄²⁻\n<\/ul>\n<p>配位键是配体提供孤对电子、中心离子提供空轨道形成的。配位数常见 2、4、6。<\/p>\n<h3>概念 3：命名（难度：进阶）<\/h3>\n<p>命名顺序：阴离子在前，阳离子在后；配体数用一、二、三表示；配体名称加&quot;合&quot;；中心离子用罗马数字标氧化数。<\/p>\n<ul><li>\n[Cu(NH₃)₄]SO₄：硫酸四氨合铜(Ⅱ)\n<\/li><li>\nK₃[Fe(CN)₆]：六氰合铁(Ⅲ)酸钾\n<\/li><li>\n[Ag(NH₃)₂]⁺：二氨合银(Ⅰ)配离子\n<\/ul>\n<p>常见配体名称：NH₃ 氨、H₂O 水、CN⁻ 氰、Cl⁻ 氯、OH⁻ 羟、CO 羰。<\/p>\n<h3>概念 4：配合物的稳定性与异构（难度：高难）<\/h3>\n<p>配合物的稳定程度用<strong>稳定常数<\/strong> K稳 表示，K稳 越大越稳定。例如 [Cu(NH₃)₄]²⁺ 的 K稳 = 2.1×10¹³。<\/p>\n<p>配合物也有异构现象：<\/p>\n<ul><li>\n电离异构：[Co(NH₃)₅Br]SO₄ 与 [Co(NH₃)₅SO₄]Br\n<\/li><li>\n几何异构：平面正方形配合物的顺反异构\n<\/li><li>\n旋光异构：手性配合物\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[晶体] --&gt; B{构成粒子}\n  B --&gt;|离子| C[离子晶体 离子键]\n  B --&gt;|分子| D[分子晶体 范德华力]\n  B --&gt;|原子| E[共价晶体 共价键]\n  B --&gt;|金属阳离子+电子| F[金属晶体 金属键]\n  C --&gt; G[熔点较高 熔融导电]\n  D --&gt; H[熔点低 不导电]\n  E --&gt; I[熔点很高 硬度大]\n  F --&gt; J[导电导热 延展性好]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先认粒子，再推性质。四类晶体的性质差异都能从作用力强弱解释。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：配合物像&quot;中心离子当主人，配体当客人围着坐&quot;。客人数量就是配位数，客人坐的位置决定几何构型。这个类比在&quot;配体可以交换、配合物会解离&quot;这一点上要补一句：客人可以来去，配合物在溶液中是动态平衡。<\/p>\n<p>实例：计算 [Fe(CN)₆]³⁻ 中 Fe 的氧化数。CN⁻ 带 1 个单位负电，6 个共 −6；配离子总电荷 −3，设 Fe 为 x，x − 6 = −3，x = +3。所以是铁(Ⅲ)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;分子晶体的分子内没有共价键&quot;——分子内是共价键，分子间才是范德华力。\n<\/li><li>\n别以为&quot;配位数等于配体个数&quot;——一个多齿配体可以占多个配位位点，配位数看配位原子数。\n<\/li><li>\n别以为&quot;配合物一定溶于水&quot;——有些配合物难溶，如 AgCl 加氨水生成可溶配合物是特例。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列晶体中熔点最高的是（ ）。A. NaCl B. 干冰 C. 金刚石 D. 冰\n<p>（答案：C；解析：金刚石是共价晶体，整个晶体由共价键连接。）<\/p>\n<\/ol>\n<ol><li>\n[Cu(NH₃)₄]²⁺ 的中心离子和配位数分别是（ ）。\n<p>（答案：Cu²⁺、4；解析：4 个 NH₃ 配体，配位数 4。）<\/p>\n<\/ol>\n<ol><li>\n命名 K₃[Fe(CN)₆]。\n<p>（答案：六氰合铁(Ⅲ)酸钾；解析：配体 CN⁻ 6 个，Fe 为 +3，外界 K⁺。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四类晶体：离子、分子、共价、金属，性质由作用力定。\n<\/li><li>\n配合物 = 中心离子 + 配体 + 配位键。\n<\/li><li>\n命名：配体数 + 配体名 + 合 + 中心离子(氧化数)。\n<\/ul>", "kind": "chapter", "title": "第 12 章：晶体结构与配位化合物"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第6章<\/div><h1>化学平衡常数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>平衡常数 K 是平衡时生成物浓度幂之积与反应物浓度幂之积的比值，只随温度变化。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;反应能进行到什么程度&quot;变成一个数。K 大，反应几乎进行完全；K 小，反应几乎不发生。它也是判断反应方向的标尺：Q 与 K 比较，就知道该往哪边走。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[任意时刻浓度] --&gt; B[算 Q]\n  B --&gt; C{Q 与 K}\n  C --&gt;|Q &lt; K| D[正向]\n  C --&gt;|Q = K| E[平衡]\n  C --&gt;|Q &gt; K| F[逆向]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>K 的表达式中，纯固体和纯液体不写，因为它们的浓度视为常数。气体用分压时得到 Kp，Kp = Kc(RT)^Δn。<\/p>\n<p>K 只与温度有关：升温，放热反应的 K 减小，吸热反应的 K 增大。浓度、压强、催化剂都不改变 K。<\/p>\n<p>计算平衡浓度用 ICE 表：初始、变化、平衡三行。设变化量为 x，代入 K 解方程，注意取正根、检查浓度不为负。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;加催化剂能提高 K&quot;——K 只受温度影响。\n<\/li><li>\n别以为&quot;平衡时各物质浓度相等&quot;——相等的是正逆反应速率，不是浓度。\n<\/li><li>\n别以为&quot;K 越大反应越快&quot;——K 是热力学量，速率看活化能。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>普化第 4 章<\/td><td>ΔG° = −RTlnK<\/td><td>热力学与平衡的桥梁<\/td><\/tr><tr><td>普化第 5 章<\/td><td>K、Q、ICE 表<\/td><td>判断方向与算浓度<\/td><\/tr><tr><td>普化第 6 章<\/td><td>Ka、Kb、Kw<\/td><td>K 在酸碱中的具体形式<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：吉布斯自由能、浓度\n<\/li><li>\n后续：酸碱平衡、沉淀溶解平衡、电极电势\n<\/ul>", "kind": "concept", "title": "化学平衡常数"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第5章<\/div><h1>吉布斯自由能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>吉布斯自由能 G = H − TS，恒温恒压下 ΔG &lt; 0 的过程自发。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;放热&quot;和&quot;熵增&quot;两个自发趋势合成一个判据。只看焓会误判（有些吸热反应也自发），只看熵也会误判（水结冰熵减却自发）。ΔG 是化学热力学的总开关。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[ΔH] --&gt; C[ΔG = ΔH − TΔS]\n  B[ΔS] --&gt; C\n  C --&gt; D{ΔG 符号}\n  D --&gt;|负| E[自发]\n  D --&gt;|零| F[平衡]\n  D --&gt;|正| G[非自发]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>ΔG 是状态函数，只与始末态有关。标准吉布斯自由能变 ΔG° 对应标准态，非标准态要用 ΔG = ΔG° + RTlnQ 修正。<\/p>\n<p>四种符号组合决定温度依赖。转折温度 T = ΔH/ΔS，此时 ΔG = 0。<\/p>\n<p>ΔG° 与 K 的关系：ΔG° = −RTlnK。这个式子说明，K 是 ΔG° 的指数形式：ΔG° 越负，K 越大。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;ΔG &lt; 0 反应就一定快&quot;——ΔG 只管方向，不管速率。\n<\/li><li>\n别以为&quot;ΔG &lt; 0 反应一定能观察到&quot;——若活化能极高，动力学上可能几乎不发生。\n<\/li><li>\n别以为&quot;ΔG 与浓度无关&quot;——ΔG° 与浓度无关，实际 ΔG 与 Q 有关。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>普化第 4 章<\/td><td>自发判据<\/td><td>ΔG = ΔH − TΔS<\/td><\/tr><tr><td>普化第 5 章<\/td><td>ΔG° = −RTlnK<\/td><td>K 的热力学来源<\/td><\/tr><tr><td>普化第 8 章<\/td><td>ΔG° = −nFE°<\/td><td>电化学与热力学<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：焓、熵\n<\/li><li>\n后续：化学平衡、电化学\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（吉布斯自由能）<\/summary><div class=\"depth-body\"><h2>为什么&quot;放热&quot;和&quot;熵增&quot;要合成一个判据<\/h2>\n<p>先把两个日常观察摆出来。<\/p>\n<p>观察一：高山上的水往低处流，释放势能。化学里对应&quot;体系趋于最低能量&quot;，表现为放热，ΔH &lt; 0。<\/p>\n<p>观察二：房间不打理会越来越乱。化学里对应&quot;体系趋于最大混乱度&quot;，表现为熵增，ΔS &gt; 0。<\/p>\n<p>单看第一条，会得出&quot;所有放热反应都自发&quot;。但硝酸铵溶于水吸热，却自发。单看第二条，会得出&quot;所有熵增过程都自发&quot;。但水在低温下结冰（熵减）也自发。两条都不够，必须合起来。<\/p>\n<h3>第一步：先定义&quot;自发&quot;到底在问什么<\/h3>\n<p>自发不是&quot;反应快&quot;，也不是&quot;反应一定能看到现象&quot;。自发问的是：在给定温度、压强下，体系加环境的总熵会不会增加。总熵增，过程就能自己往前走。<\/p>\n<div class=\"katex-block\">\\Delta S_{\\text{总}} = \\Delta S_{\\text{体系}} + \\Delta S_{\\text{环境}} \\geq 0<\/div>\n<h3>第二步：把环境的熵变换成可测的量<\/h3>\n<p>环境很大，它只跟体系交换热。环境吸收热量 Q_环境，其熵变是<\/p>\n<div class=\"katex-block\">\\Delta S_{\\text{环境}} = \\frac{Q_{\\text{环境}}}{T}<\/div>\n<p>恒压条件下，体系放出的热等于 −ΔH（体系焓变），环境吸收的热就是 +ΔH。所以<\/p>\n<div class=\"katex-block\">\\Delta S_{\\text{环境}} = -\\frac{\\Delta H}{T}<\/div>\n<p>这里出现一个负号，含义很直白：体系放热（ΔH &lt; 0），环境吸热，环境熵增；体系吸热（ΔH &gt; 0），环境放热，环境熵减。<\/p>\n<h3>第三步：把两项加起来<\/h3>\n<div class=\"katex-block\">\\Delta S_{\\text{总}} = \\Delta S - \\frac{\\Delta H}{T} \\geq 0<\/div>\n<p>两边乘 −T。注意乘负数要变号：<\/p>\n<div class=\"katex-block\">-T\\Delta S_{\\text{总}} = \\Delta H - T\\Delta S \\leq 0<\/div>\n<p>左边这个量，定义为吉布斯自由能变 ΔG：<\/p>\n<div class=\"katex-block\">\\boxed{\\Delta G = \\Delta H - T\\Delta S}<\/div>\n<p>判据随之变成 ΔG ≤ 0。这不是新原理，只是把&quot;总熵增&quot;换了件衣服，让它只用体系的量就能算。<\/p>\n<h3>第四步：为什么叫&quot;自由能&quot;<\/h3>\n<p>ΔG 的绝对值，代表恒温恒压下体系能对外做的最大非体积功。自由能&quot;自由&quot;在：这部分能量可以被拿出来干活，剩下的 TΔS 部分必须留给混乱度，动不了。电池做功靠的就是这部分。<\/p>\n<h3>第五步：用数字走一遍<\/h3>\n<p>过氧化氢分解：2H₂O₂(l) → 2H₂O(l) + O₂(g) ΔH = −196 kJ/mol，ΔS = +125 J/(mol·K) = +0.125 kJ/(mol·K)。<\/p>\n<p>298 K 时： ΔG = −196 − 298×0.125 = −196 − 37.3 = −233.3 kJ/mol &lt; 0，自发。<\/p>\n<p>如果换成吸热反应，比如 CaCO₃ 分解，ΔH = +178 kJ/mol，ΔS = +0.160 kJ/(mol·K)： ΔG = 178 − 0.160T。低温时为正，不自发；T &gt; 1112 K 后为负，自发。石灰窑必须烧到 900 ℃ 以上，原因就在这里。<\/p>\n<h3>这个判据的边界<\/h3>\n<p>ΔG 只回答&quot;能不能自发&quot;，不回答&quot;多快&quot;。金刚石转石墨 ΔG &lt; 0，但室温下几乎不发生，因为活化能太高。动力学是另一套判据。<\/p>\n<p>另外，ΔG 判据默认恒温恒压、只做体积功。如果不是这个条件（比如 OPEN 体系、做电功），要改用别的判据。<\/p><\/div><\/details>", "kind": "concept", "title": "吉布斯自由能"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第10章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">吉布斯自由能<\/a><\/span><\/div><h1>电极电势与 Nernst 方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>电极电势 E 是电极相对于标准氢电极的电势，衡量电对得失电子能力；Nernst 方程把浓度对 E 的影响写成一个可算的修正项。<\/p>\n<h2>为什么重要<\/h2>\n<p>它决定原电池的正负极、反应方向、电池电压。没有它，只能靠&quot;金属活动性顺序&quot;做粗略判断；有了它，任何两个电对的方向都能算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[标准电极电势 E°] --&gt; B[比较大小]\n  B --&gt; C[大的作正极]\n  C --&gt; D[E电池 = E正 − E负]\n  D --&gt; E[ΔG° = −nFE°]\n  E --&gt; F[判断自发]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>E° 越正，氧化型越容易得电子，是越强的氧化剂；E° 越负，还原型越容易失电子，是越强的还原剂。<\/p>\n<p>标准氢电极规定 E° = 0。所有 E° 都是相对值，单独一个电极的绝对电势无法测量，但这不影响算电池电动势，因为相减时基准抵消。<\/p>\n<p>Nernst 方程：<\/p>\n<div class=\"katex-block\">E = E^\\circ - \\frac{0.0592}{n}\\lg Q<\/div>\n<p>Q 的写法与平衡常数相同。浓度降低，Q 变小，lgQ 变负，E 升高还是降低要看电极反应的方向，代入时别把 Q 写反。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;E° 越负金属越不活泼&quot;——越负越易失电子，金属越活泼。\n<\/li><li>\n别以为&quot;E° 与浓度有关&quot;——E° 是标准态，浓度影响实际 E。\n<\/li><li>\n别以为&quot;电极电势是电极的绝对电势&quot;——它是相对标准氢电极的差值。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>普化第 8 章<\/td><td>原电池<\/td><td>正极减负极<\/td><\/tr><tr><td>普化第 8 章<\/td><td>Nernst<\/td><td>浓度修正<\/td><\/tr><tr><td>无机第 4 章<\/td><td>过渡金属<\/td><td>多价态电对<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：氧化还原、吉布斯自由能\n<\/li><li>\n后续：电解、化学电源\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（电极电势与 Nernst 方程）<\/summary><div class=\"depth-body\"><h2>Nernst 方程是怎么来的<\/h2>\n<p>先别背公式，先问一个问题：为什么浓度会影响电极电势？<\/p>\n<h3>第一步：把电极反应写成半反应<\/h3>\n<p>以 Cu²⁺/Cu 电极为例：<\/p>\n<div class=\"katex-block\">\\mathrm{Cu^{2+} + 2e^- \\rightleftharpoons Cu(s)}<\/div>\n<p>这个半反应的&quot;驱动力&quot;来自两件事：Cu²⁺ 得电子的趋势（由 E° 衡量），以及当前 Cu²⁺ 的浓度。浓度越高，Cu²⁺ 越&quot;想&quot;得电子，电极电势越高。<\/p>\n<h3>第二步：用热力学把浓度接进来<\/h3>\n<p>第 4 章给过：ΔG = ΔG° + RTlnQ。电化学里，ΔG 与电势的关系是<\/p>\n<div class=\"katex-block\">\\Delta G = -nFE<\/div>\n<p>n 是转移电子数，F 是法拉第常数 96500 C/mol，E 是电池电动势。把两式联立：<\/p>\n<div class=\"katex-block\">-nFE = -nFE^\\circ + RT\\ln Q<\/div>\n<p>两边除以 −nF：<\/p>\n<div class=\"katex-block\">E = E^\\circ - \\frac{RT}{nF}\\ln Q<\/div>\n<p>这就是 Nernst 方程的一般形式。25 ℃ 时，RT/F = 0.0257 V，换常用对数乘 2.303：<\/p>\n<div class=\"katex-block\">E = E^\\circ - \\frac{0.0592}{n}\\lg Q<\/div>\n<h3>第三步：Q 到底怎么写<\/h3>\n<p>Q 的形式与平衡常数一致：生成物活度幂之积除以反应物活度幂之积，纯固体和纯液体取 1。<\/p>\n<p>对 Cu²⁺ + 2e⁻ → Cu，Q = 1/[Cu²⁺]。代入：<\/p>\n<div class=\"katex-block\">E = E^\\circ + \\frac{0.0592}{2}\\lg[\\mathrm{Cu^{2+}}]<\/div>\n<p>注意符号变成了加号：因为 Cu²⁺ 在反应物侧，浓度在分母，lg(1/c) = −lg c，负负得正。浓度每降为 1/10，E 下降约 0.0296 V。<\/p>\n<h3>第四步：数字算一遍<\/h3>\n<p>E°(Cu²⁺/Cu) = +0.34 V。当 [Cu²⁺] = 0.001 mol/L：<\/p>\n<div class=\"katex-block\">E = 0.34 + \\frac{0.0592}{2}\\lg(0.001) = 0.34 + 0.0296\\times(-3) = 0.34 - 0.0888 = 0.251\\ \\text{V}<\/div>\n<p>浓度降了 1000 倍，电势只降了 0.089 V。这说明 E° 是主项，浓度是修正项。也解释了为什么&quot;金属活动性顺序&quot;在标准浓度附近够用，一旦浓度极端偏离，顺序可能翻转。<\/p>\n<h3>第五步：为什么能斯特方程能判断方向<\/h3>\n<p>若 E电池 &gt; 0，则 ΔG = −nFE &lt; 0，反应自发。E电池 = E正 − E负，所以 E° 大的电对作正极。浓度改变时，比较的是实际 E，不是 E°。<\/p>\n<h3>边界<\/h3>\n<p>Nernst 方程假设活度可用浓度近似，适用于稀溶液。浓溶液、强电解质、非理想体系要用活度系数修正。它也不处理动力学：E &gt; 0 只说明热力学允许，反应可能因活化能高而很慢。<\/p><\/div><\/details>", "kind": "concept", "title": "电极电势与 Nernst 方程"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第11章<\/div><h1>原子轨道与量子数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>原子轨道是电子出现概率最大的空间区域，由 n、l、m 三个量子数确定形状、方向和能量。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释周期表为什么这样排、元素性质为什么周期性变化。没有轨道概念，电子排布就只能死记；有了它，4s 先于 3d、Cr 和 Cu 的反常，都能推出来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[n 主量子数] --&gt; B[电子层 能量]\n  C[l 角量子数] --&gt; D[形状 s p d f]\n  E[m 磁量子数] --&gt; F[空间方向]\n  G[ms 自旋] --&gt; H[每个轨道2e]\n  B --&gt; I[原子轨道]\n  D --&gt; I\n  F --&gt; I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>n = 1,2,3…，对应 K、L、M 层。l = 0…n−1，l=0 是 s（球形），l=1 是 p（哑铃形），l=2 是 d，l=3 是 f。m = −l…+l，共 2l+1 个方向。ms = ±½。<\/p>\n<p>每层最多 2n² 个电子：n=1 有 2 个，n=2 有 8 个，n=3 有 18 个。<\/p>\n<p>电子排布三原则：能量最低、Pauli 不相容、Hund 规则。能级顺序 1s&lt;2s&lt;2p&lt;3s&lt;3p&lt;4s&lt;3d&lt;4p，4s 与 3d 交错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;电子沿固定轨道运动&quot;——只有概率分布。\n<\/li><li>\n别以为&quot;4s 填满后才填 3d&quot;——4s 先填，但失电子时先失 4s。\n<\/li><li>\n别以为&quot;轨道是圆的&quot;——s 是球形，p 是哑铃形，d、f 更复杂。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>普化第 10 章<\/td><td>量子数与排布<\/td><td>2n²、能级交错<\/td><\/tr><tr><td>普化第 11 章<\/td><td>成键<\/td><td>轨道重叠形成共价键<\/td><\/tr><tr><td>无机第 1 章<\/td><td>分区<\/td><td>价电子构型决定分区<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：原子结构、电子\n<\/li><li>\n后续：化学键、杂化轨道\n<\/ul>", "kind": "concept", "title": "原子轨道与量子数"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：《普通化学原理》第12章<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">原子轨道与量子数<\/a><\/span><\/div><h1>杂化轨道<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>杂化是中心原子的若干原子轨道重新组合成一组能量相同、方向更合理的新轨道，用来解释分子的空间构型。<\/p>\n<h2>为什么重要<\/h2>\n<p>没有杂化，碳的 2s 和 2p 轨道一个是球形、三个是哑铃形，无法解释 CH₄ 的四个等价 C—H 键和 109.5° 键角。杂化把&quot;观测到的构型&quot;和&quot;原子轨道&quot;对上号。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[ns + np] --&gt; B[sp 杂化 2个 180°]\n  A --&gt; C[sp2 杂化 3个 120°]\n  A --&gt; D[sp3 杂化 4个 109.5°]\n  D --&gt; E[CH4 NH3 H2O]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判断杂化类型，数中心原子的价层电子对数（σ 键数 + 孤对数）：<\/p>\n<ul><li>\n2 对 → sp，直线形；\n<\/li><li>\n3 对 → sp²，平面三角形；\n<\/li><li>\n4 对 → sp³，四面体。\n<\/ul>\n<p>孤对会压缩键角：CH₄ 109.5°，NH₃ 107°，H₂O 104.5°。孤对排斥大于成键对，因为孤对只受一个原子核束缚，电子云更&quot;胖&quot;。<\/p>\n<p>杂化轨道只用于形成 σ 键和容纳孤对；π 键由未参与杂化的 p 轨道肩并肩形成。所以双键 = 1 个 σ + 1 个 π，三键 = 1 个 σ + 2 个 π。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;杂化后轨道数变了&quot;——几个轨道参与，就生成几个杂化轨道，数目守恒。\n<\/li><li>\n别以为&quot;杂化一定降低能量&quot;——杂化本身耗能，但成键放能更多，总体有利。\n<\/li><li>\n别以为&quot;所有分子都要杂化&quot;——H₂ 这类双原子分子不需要，直接用 s 轨道重叠。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>普化第 11 章<\/td><td>VSEPR 与杂化<\/td><td>电子对数定杂化<\/td><\/tr><tr><td>有机第 2 章<\/td><td>烷烃<\/td><td>sp³ 四面体<\/td><\/tr><tr><td>有机第 3 章<\/td><td>烯烃<\/td><td>sp² 平面，π 键<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：原子轨道、VSEPR\n<\/li><li>\n后续：共轭、芳香性\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（杂化轨道）<\/summary><div class=\"depth-body\"><h2>为什么甲烷是正四面体，而不是平面正方形<\/h2>\n<p>这是化学里最经典的一个&quot;为什么&quot;。碳的基态电子排布是 1s²2s²2p²，2s 轨道有两个电子，2p 有三个轨道但只填了两个电子。如果直接用这些轨道成键，会得到两种不同类型的 C—H 键：一个来自 2s，三个来自 2p。但实验测出甲烷的四个 C—H 键完全等价，键角都是 109.5°。矛盾出在哪？<\/p>\n<h3>第一步：先看&quot;不杂化&quot;会怎样<\/h3>\n<p>2s 轨道是球形，2p 轨道是哑铃形，沿 x、y、z 三个方向伸展。用它们与 H 的 1s 重叠：<\/p>\n<ul><li>\n2s 与 H 1s 重叠，形成一种键；\n<\/li><li>\n2p 与 H 1s 重叠，形成另一种键，方向沿坐标轴。\n<\/ul>\n<p>这样会得到 1 个 s 型键 + 3 个 p 型键，键长、键能都不同。实验上四个键一模一样，所以这个模型不对。<\/p>\n<h3>第二步：轨道可以&quot;混合&quot;<\/h3>\n<p>量子力学允许同一原子中能量相近的轨道线性组合。2s 和 2p 能量接近（同一层），可以组合成四个新轨道：<\/p>\n<div class=\"katex-block\">\\psi_{sp^3} = c_1\\psi_{2s} + c_2\\psi_{2p_x} + c_3\\psi_{2p_y} + c_4\\psi_{2p_z}<\/div>\n<p>每个新轨道含 1/4 s 成分、3/4 p 成分，四个轨道完全等价。这就是 sp³ 杂化。<\/p>\n<h3>第三步：为什么是四面体<\/h3>\n<p>四个等价轨道要互相远离。三维空间中，让四个向量两两夹角最大的排列，是指向正四面体的四个顶点，夹角 109.47°。<\/p>\n<p>可以用向量验证：正四面体中心到顶点，任意两个向量点积为 −1/3，所以 cosθ = −1/3，θ = 109.47°。这不是巧合，是&quot;四个等价方向最大分离&quot;的唯一解。<\/p>\n<h3>第四步：为什么键角会变小<\/h3>\n<p>NH₃ 也是 sp³ 杂化，但有一对孤对电子占据一个杂化轨道。孤对电子只受 N 一个核吸引，电子云更靠近核、更&quot;胖&quot;，对相邻成键电子对排斥更强，把三个 N—H 键往下压，键角从 109.5° 降到 107°。<\/p>\n<p>H₂O 有两对孤对，压缩更明显，键角 104.5°。<\/p>\n<h3>第五步：乙烯为什么是平面<\/h3>\n<p>乙烯 C₂H₄ 的每个碳连两个 H 和一个 C，共 3 个 σ 键、0 个孤对，价层电子对数 3 → sp² 杂化。三个 sp² 轨道在同一平面内，夹角 120°。每个碳还剩一个未杂化的 p 轨道，垂直于该平面，两个 p 轨道肩并肩形成 π 键。所以乙烯的六个原子共平面，双键不能旋转。<\/p>\n<h3>边界与常见误用<\/h3>\n<p>杂化是一种&quot;模型&quot;，不是物理上真的先把轨道混合再成键。它提供的是可计算的、与实验一致的解释。对过渡金属配合物，要用 d 轨道参与杂化（dsp²、sp³d² 等），情况更复杂，不能直接套 s/p 的规则。<\/p><\/div><\/details>", "kind": "concept", "title": "杂化轨道"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：气体与状态方程<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：气体<\/a><br>检查点：能算 p、V、n、T 与分压<\/li><li class='path-step' id='path-02'><strong>步骤 02：能量与焓<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：热力学第一定律与焓<\/a>、<a href=\"#/chapter/ch03\">第 3 章：热化学与盖斯定律<\/a><br>检查点：能写热化学方程式并用盖斯定律算 ΔH<\/li><li class='path-step' id='path-03'><strong>步骤 03：自发方向<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：熵与吉布斯自由能<\/a><br>检查点：能判断四种 ΔH/ΔS 组合并算转折温度<\/li><li class='path-step' id='path-04'><strong>步骤 04：平衡<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：化学平衡<\/a><br>检查点：能写 K、算 Q、用 ICE 表算浓度<\/li><li class='path-step' id='path-05'><strong>步骤 05：水溶液平衡<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：酸碱电离平衡与缓冲溶液<\/a>、<a href=\"#/chapter/ch07\">第 7 章：沉淀溶解平衡<\/a><br>检查点：能算 pH、缓冲、Ksp 与沉淀顺序<\/li><li class='path-step' id='path-06'><strong>步骤 06：电化学<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：氧化还原与电化学<\/a><br>检查点：能写电极反应并用 Nernst 算电动势<\/li><li class='path-step' id='path-07'><strong>步骤 07：速率<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：化学反应速率<\/a><br>检查点：能定级数、算活化能<\/li><li class='path-step' id='path-08'><strong>步骤 08：结构<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：原子结构<\/a>、<a href=\"#/chapter/ch11\">第 11 章：化学键与分子结构<\/a>、<a href=\"#/chapter/ch12\">第 12 章：晶体结构与配位化合物<\/a><br>检查点：能写排布、判构型与杂化、认晶体与配合物<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：气体<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 25℃、100 kPa 下 2 mol N2 的体积约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 24.8 L<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 49.6 L<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 22.4 L<\/label><label class='quiz-opt'><i
