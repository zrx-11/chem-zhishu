<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>学习总手册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.brand{font-size:17px;font-weight:700;display:inline-block;margin-right:18px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tabs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tab{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{float:right;display:flex;gap:8px;align-items:center;margin-top:2px}
#q{width:260px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:6px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
#progress-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.book-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel)}
.book-card h3{margin:0 0 6px;font-size:16px}
.book-card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.book-card .enter{font-size:13px}
.empty{color:var(--muted);padding:20px 0}
@media print{header,.sidebar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
@media (max-width:820px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .hdr-right{float:none;margin-top:8px}#q{width:100%}}
</style>
</head>
<body>
<header>
  <span class="brand">学习总手册<span>点化学习系统 · 统一入口</span></span>
  <span class="tabs" id="tabs"></span>
  <span class="hdr-right">
    <input id="q" type="search" placeholder="全书搜索…">
    <button id="theme-btn">🌙 深色</button>
  </span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-label">进度 0%</div>
    <nav id="nav"></nav>
  </aside>
  <main class="main"><div id="view" class="page"></div></main>
</div>
<script>
const BOOKS = {"zero-basis-chem":{"manifest": {"slug": "zero-basis-chem", "title": "零基础入门：化学的第一套语言", "subtitle": "给几乎没学过化学的人，从物质分类讲到有机初识", "book": {"title": "基础概念 + 高中化学基础知识大全", "author": "自编讲义 / 一龙", "source": ["基础概念.pdf", "五彩绳 高中化学基础知识大全.pdf"]}, "audience": "文科零基础、化学几乎没学过", "goal": "建立化学的语言与符号系统，能读懂方程式、会算物质的量、会写离子方程式", "learningPath": [{"step": "01", "title": "先学会给物质分类", "chapterIds": ["ch01"], "checkpoint": "能独立判断 6 种常见物质的类别"}, {"step": "02", "title": "看懂微观粒子和符号", "chapterIds": ["ch02", "ch03"], "checkpoint": "能写常见化学式并检查化合价"}, {"step": "03", "title": "会写会配平方程式", "chapterIds": ["ch04"], "checkpoint": "独立配平 3 个方程式"}, {"step": "04", "title": "掌握化学计算的语言", "chapterIds": ["ch05"], "checkpoint": "四条换算各做对 2 题"}, {"step": "05", "title": "进入溶液与离子", "chapterIds": ["ch06"], "checkpoint": "能写出 3 个离子方程式"}, {"step": "06", "title": "理解电子转移", "chapterIds": ["ch07"], "checkpoint": "能判断氧化剂还原剂并配平"}, {"step": "07", "title": "结构与周期律", "chapterIds": ["ch08"], "checkpoint": "能判断键型和金属性顺序"}, {"step": "08", "title": "反应快慢与限度", "chapterIds": ["ch09"], "checkpoint": "能判断平衡移动方向"}, {"step": "09", "title": "有机入门", "chapterIds": ["ch10"], "checkpoint": "能认出四种官能团"}], "chapters": [{"id": "ch01", "title": "第 1 章：物质怎么分类", "file": "chapters/ch01-物质分类.md", "difficulty": 1, "source": "《基础概念》第一节 + 高中化学基础知识大全", "prerequisites": []}, {"id": "ch02", "title": "第 2 章：原子、分子、离子", "file": "chapters/ch02-微观粒子.md", "difficulty": 1, "source": "《基础概念》第二节", "prerequisites": ["ch01"]}, {"id": "ch03", "title": "第 3 章：化学式与化合价", "file": "chapters/ch03-化学式与化合价.md", "difficulty": 1, "source": "《基础概念》第三节", "prerequisites": ["ch02"]}, {"id": "ch04", "title": "第 4 章：化学方程式与配平", "file": "chapters/ch04-化学方程式与配平.md", "difficulty": 2, "source": "《基础概念》第三节 + 高中化学基础知识大全", "prerequisites": ["ch03"]}, {"id": "ch05", "title": "第 5 章：物质的量", "file": "chapters/ch05-物质的量.md", "difficulty": 2, "source": "《基础概念》第二节 核心计算体系", "prerequisites": ["ch04"]}, {"id": "ch06", "title": "第 6 章：电解质与离子反应", "file": "chapters/ch06-离子反应.md", "difficulty": 2, "source": "《基础概念》第四节", "prerequisites": ["ch04", "ch05"]}, {"id": "ch07", "title": "第 7 章：氧化还原反应", "file": "chapters/ch07-氧化还原.md", "difficulty": 3, "source": "《基础概念》第三节 + 高中化学基础知识大全", "prerequisites": ["ch04", "ch06"]}, {"id": "ch08", "title": "第 8 章：元素周期表与化学键", "file": "chapters/ch08-元素周期表与化学键.md", "difficulty": 2, "source": "《基础概念》第五节 + 高中化学基础知识大全", "prerequisites": ["ch02", "ch07"]}, {"id": "ch09", "title": "第 9 章：反应速率与化学平衡", "file": "chapters/ch09-速率与平衡.md", "difficulty": 2, "source": "《基础概念》第六节", "prerequisites": ["ch07"]}, {"id": "ch10", "title": "第 10 章：有机化学初识", "file": "chapters/ch10-有机化学初识.md", "difficulty": 2, "source": "《基础概念》第七节", "prerequisites": ["ch08"]}], "concepts": [{"id": "c01", "title": "物质的量", "file": "concepts/c01-物质的量.md", "chapterIds": ["ch05"], "difficulty": "进阶", "source": "《基础概念》核心计算体系", "prerequisites": ["ch03"]}, {"id": "c02", "title": "离子方程式", "file": "concepts/c02-离子方程式.md", "chapterIds": ["ch06"], "difficulty": "进阶", "source": "《基础概念》第四节", "prerequisites": ["ch04", "ch05"]}, {"id": "c03", "title": "氧化还原反应", "file": "concepts/c03-氧化还原.md", "chapterIds": ["ch07"], "difficulty": "高难", "source": "《基础概念》第三节", "prerequisites": ["ch04", "c02"]}], "glossary": [{"term": "纯净物", "def": "只由一种物质组成、有固定化学式的体系", "chapterId": "ch01"}, {"term": "电解质", "def": "在水溶液或熔融状态下能导电的化合物", "chapterId": "ch06"}, {"term": "离子方程式", "def": "删去旁观离子后只保留实际参加反应离子的方程式", "chapterId": "ch06"}, {"term": "氧化剂", "def": "得电子、化合价降低、被还原的物质", "chapterId": "ch07"}, {"term": "还原剂", "def": "失电子、化合价升高、被氧化的物质", "chapterId": "ch07"}, {"term": "物质的量", "def": "表示微粒集合份数的物理量，单位 mol", "chapterId": "ch05"}, {"term": "摩尔质量", "def": "1 mol 物质的质量，单位 g/mol", "chapterId": "ch05"}, {"term": "官能团", "def": "决定有机物化学性质的原子或原子团", "chapterId": "ch10"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "下列属于纯净物的是？", "options": ["洁净的空气", "冰水混合物", "生理盐水", "大理石"], "answer": 1, "explain": "冰和水都是 H2O，只有一种物质；其余都含多种物质。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "下列物质中属于氧化物的是？", "options": ["O2", "KClO3", "Fe3O4", "H2SO4"], "answer": 2, "explain": "Fe3O4 只含 Fe、O 两种元素；A 是单质，B、D 含三种元素。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "17O 的质子数、中子数、电子数分别是？", "options": ["8、9、8", "9、8、9", "8、9、9", "17、8、17"], "answer": 0, "explain": "O 的原子序数 8，质子数 8；中子数 17-8=9；中性原子电子数=质子数=8。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch02-q04", "chapterId": "ch02", "type": "blank", "question": "Mg2+ 的质子数为 12，它的电子数是多少？", "options": [], "answer": "10", "explain": "带 2 个单位正电，电子比质子少 2 个：12-2=10。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "氧化铁的化学式是？", "options": ["FeO", "Fe2O3", "Fe3O4", "Fe(OH)3"], "answer": 1, "explain": "铁为 +3，氧为 -2，交叉得 Fe2O3。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch03-q06", "chapterId": "ch03", "type": "blank", "question": "KMnO4 中 Mn 的化合价是多少？（写带符号的数字，如 +7）", "options": [], "answer": "+7", "explain": "K 为 +1，O 为 -2，设 Mn 为 x：1+x+4×(-2)=0，x=+7。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "配平 Al + O2 → Al2O3，正确系数是？", "options": ["2、1、1", "4、3、2", "2、3、2", "4、2、2"], "answer": 1, "explain": "2 个 Al2O3 含 4 个 Al、6 个 O，需要 3 个 O2。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "配平时允许改动的是？", "options": ["化学式右下角的下标", "元素符号", "前面的系数", "反应条件"], "answer": 2, "explain": "只能改系数，改下标就改变了物质本身。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch05-q09", "chapterId": "ch05", "type": "single", "question": "18 g 水的物质的量是多少？（M=18 g/mol）", "options": ["0.5 mol", "1 mol", "2 mol", "18 mol"], "answer": 1, "explain": "n=m/M=18/18=1 mol。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "ch05-q10", "chapterId": "ch05", "type": "blank", "question": "标准状况下 11.2 L CO2 的质量是多少克？（M=44 g/mol，填数字）", "options": [], "answer": "22", "explain": "n=11.2/22.4=0.5 mol；m=0.5×44=22 g。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "ch06-q11", "chapterId": "ch06", "type": "single", "question": "下列物质属于强电解质的是？", "options": ["CH3COOH", "NH3·H2O", "NaCl", "蔗糖"], "answer": 2, "explain": "NaCl 是盐，完全电离；A、B 是弱电解质，D 是非电解质。", "relatedConceptId": "c02", "optionMisconceptions": []}, {"id": "ch06-q12", "chapterId": "ch06", "type": "single", "question": "CaCO3 与盐酸反应的离子方程式中，CaCO3 应怎么写？", "options": ["拆成 Ca2+ 和 CO3^2-", "写化学式不拆", "写成 CaO 和 CO2", "删掉不写"], "answer": 1, "explain": "CaCO3 难溶，不能拆，必须写化学式。", "relatedConceptId": "c02", "optionMisconceptions": []}, {"id": "ch07-q13", "chapterId": "ch07", "type": "single", "question": "下列反应属于氧化还原反应的是？", "options": ["NaOH+HCl→NaCl+H2O", "CaCO3→CaO+CO2", "Zn+CuSO4→ZnSO4+Cu", "CO2+Ca(OH)2→CaCO3+H2O"], "answer": 2, "explain": "Zn 0→+2，Cu +2→0，有化合价变化。", "relatedConceptId": "c03", "optionMisconceptions": []}, {"id": "ch07-q14", "chapterId": "ch07", "type": "single", "question": "Fe + 2HCl → FeCl2 + H2 中，氧化剂是？", "options": ["Fe", "HCl", "FeCl2", "H2"], "answer": 1, "explain": "HCl 中的 H 从 +1 降到 0，得电子，是氧化剂。", "relatedConceptId": "c03", "optionMisconceptions": []}, {"id": "ch08-q15", "chapterId": "ch08", "type": "single", "question": "下列化合物中只含共价键的是？", "options": ["NaCl", "NaOH", "CO2", "K2O"], "answer": 2, "explain": "CO2 由 C、O 非金属原子通过共价键结合。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch08-q16", "chapterId": "ch08", "type": "single", "question": "Na、Mg、Al 金属性由强到弱的顺序是？", "options": ["Al>Mg>Na", "Na>Mg>Al", "Mg>Na>Al", "Na>Al>Mg"], "answer": 1, "explain": "同周期从左到右金属性减弱。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch09-q17", "chapterId": "ch09", "type": "single", "question": "升高温度，反应速率通常？", "options": ["一定加快", "一定减慢", "不变", "无法判断"], "answer": 0, "explain": "升温使活化分子比例增加，正逆反应速率都加快。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch09-q18", "chapterId": "ch09", "type": "single", "question": "2SO2+O2⇌2SO3（放热）增大压强，平衡向？", "options": ["正反应方向", "逆反应方向", "不移动", "先正后逆"], "answer": 0, "explain": "右边气体分子数少，加压向分子数少的方向移动。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch10-q19", "chapterId": "ch10", "type": "single", "question": "下列属于有机物的是？", "options": ["CO2", "CH4", "Na2CO3", "H2CO3"], "answer": 1, "explain": "CH4 是含碳的烃；其余归为无机物。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch10-q20", "chapterId": "ch10", "type": "single", "question": "乙烯与溴水反应属于？", "options": ["取代反应", "加成反应", "酯化反应", "复分解反应"], "answer": 1, "explain": "碳碳双键打开，溴原子加在两个碳上。", "relatedConceptId": "", "optionMisconceptions": []}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "物质怎么分类：一句话核心是什么？", "back": "分类只看两件事：里面是不是只有一种东西，以及它由几种元素组成。", "tags": ["ch01"]}, {"id": "f02", "chapterId": "ch01", "front": "物质怎么分类最容易错在哪？", "back": "冰水混合物是纯净物，不是混合物。", "tags": ["ch01", "易错"]}, {"id": "f03", "chapterId": "ch02", "front": "原子、分子、离子：一句话核心是什么？", "back": "化学反应只动最外层电子，原子核不变；带电与否看质子数和电子数是否相等。", "tags": ["ch02"]}, {"id": "f04", "chapterId": "ch02", "front": "原子、分子、离子最容易错在哪？", "back": "NaCl 固体不导电，但里面有离子，只是不能自由移动。", "tags": ["ch02", "易错"]}, {"id": "f05", "chapterId": "ch03", "front": "化学式与化合价：一句话核心是什么？", "back": "化学式是物质的配方标签：元素种类不能错，正负化合价代数和必须为零。", "tags": ["ch03"]}, {"id": "f06", "chapterId": "ch03", "front": "化学式与化合价最容易错在哪？", "back": "配平不能改化学式右下角的下标。", "tags": ["ch03", "易错"]}, {"id": "f07", "chapterId": "ch04", "front": "化学方程式与配平：一句话核心是什么？", "back": "方程式是化学反应的账单：反应前后每种元素的原子个数必须一模一样。", "tags": ["ch04"]}, {"id": "f08", "chapterId": "ch04", "front": "化学方程式与配平最容易错在哪？", "back": "有化合价变化时，先电子守恒，再数原子。", "tags": ["ch04", "易错"]}, {"id": "f09", "chapterId": "ch05", "front": "物质的量：一句话核心是什么？", "back": "摩尔把数不清的微粒换成可以称量的份数，1 mol 就是 6.02×10²³ 个。", "tags": ["ch05"]}, {"id": "f10", "chapterId": "ch05", "front": "物质的量最容易错在哪？", "back": "22.4 L/mol 只对气体、只在标准状况成立。", "tags": ["ch05", "易错"]}, {"id": "f11", "chapterId": "ch06", "front": "电解质与离子反应：一句话核心是什么？", "back": "离子方程式只留下真正参加反应的离子，但难溶物、气体、水、弱电解质不能拆。", "tags": ["ch06"]}, {"id": "f12", "chapterId": "ch06", "front": "电解质与离子反应最容易错在哪？", "back": "能导电的铜不是电解质，电解质必须是化合物。", "tags": ["ch06", "易错"]}, {"id": "f13", "chapterId": "ch07", "front": "氧化还原反应：一句话核心是什么？", "back": "升失氧、降得还：化合价升高、失电子、被氧化；降低、得电子、被还原。", "tags": ["ch07"]}, {"id": "f14", "chapterId": "ch07", "front": "氧化还原反应最容易错在哪？", "back": "氧化剂被还原，不是被氧化。", "tags": ["ch07", "易错"]}, {"id": "f15", "chapterId": "ch08", "front": "元素周期表与化学键：一句话核心是什么？", "back": "周期表按电子层数分行、按最外层电子数分列；原子靠凑成稳定电子结构成键。", "tags": ["ch08"]}, {"id": "f16", "chapterId": "ch08", "front": "元素周期表与化学键最容易错在哪？", "back": "NaOH 有共价键，但它是离子化合物。", "tags": ["ch08", "易错"]}, {"id": "f17", "chapterId": "ch09", "front": "反应速率与化学平衡：一句话核心是什么？", "back": "速率管多快，平衡管最终生成多少；催化剂只改速率，不改平衡。", "tags": ["ch09"]}, {"id": "f18", "chapterId": "ch09", "front": "反应速率与化学平衡最容易错在哪？", "back": "平衡时反应没有停止，v正 = v逆 ≠ 0。", "tags": ["ch09", "易错"]}, {"id": "f19", "chapterId": "ch10", "front": "有机化学初识：一句话核心是什么？", "back": "有机化学研究含碳化合物，碳能形成四个共价键，官能团决定性质。", "tags": ["ch10"]}, {"id": "f20", "chapterId": "ch10", "front": "有机化学初识最容易错在哪？", "back": "CO2、碳酸盐是无机物，不是有机物。", "tags": ["ch10", "易错"]}], "companion": "学习伴侣.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：《基础概念》第一节 + 高中化学基础知识大全<\/div><h1>第 1 章：物质怎么分类<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.5 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n拿到一个名字，判断它是纯净物还是混合物；\n<\/li><li>\n区分单质、化合物、氧化物；\n<\/li><li>\n用一张分类树把初中见过的物质归位。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>分类只看两件事：<strong>里面是不是只有一种东西<\/strong>，以及<strong>它由几种元素组成<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：纯净物与混合物（难度：基础）<\/h3>\n<p><strong>纯净物<\/strong>是只由一种物质组成的体系，有固定的化学式，比如蒸馏水 H₂O、干冰 CO₂、液氧 O₂。<strong>混合物<\/strong>里至少有两种物质，各成分保持自己的性质，没有统一化学式，比如空气、食盐水、合金、牛奶。<\/p>\n<p>判断的关键不是&quot;看起来干净&quot;，而是&quot;能不能写出唯一的化学式&quot;。空气很干净，但它由 N₂、O₂、Ar、CO₂ 等组成，是混合物。澄清石灰水看着透明，里面是 Ca(OH)₂ 和水，也是混合物。<\/p>\n<h3>概念 2：单质与化合物（难度：基础）<\/h3>\n<p>只由<strong>一种元素<\/strong>组成的纯净物叫<strong>单质<\/strong>，如 O₂、Fe、He。由<strong>两种或以上元素<\/strong>组成的纯净物叫<strong>化合物<\/strong>，如 H₂O、NaCl、CO₂。<\/p>\n<p>注意，O₂ 和 O₃ 都是单质，混合在一起（臭氧和氧气的混合气）就是混合物，因为它们是两种不同的物质。<\/p>\n<h3>概念 3：氧化物、酸、碱、盐（难度：基础）<\/h3>\n<p><strong>氧化物<\/strong>：只含两种元素，其中一种是氧，如 CO₂、Fe₂O₃、SO₂。NaOH 含三种元素，不算氧化物；H₂O₂ 虽然只含 H、O，但它是过氧化物，中学阶段单独记，不归入普通氧化物。<\/p>\n<p><strong>酸<\/strong>：电离时产生的阳离子全部是 H⁺ 的化合物，如 HCl、H₂SO₄、CH₃COOH。 <strong>碱<\/strong>：电离时产生的阴离子全部是 OH⁻ 的化合物，如 NaOH、Ca(OH)₂、NH₃·H₂O。 <strong>盐<\/strong>：由金属阳离子（或 NH₄⁺）与酸根阴离子组成的化合物，如 NaCl、Na₂CO₃、CuSO₄。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[物质] --&gt; B{只有一种物质?}\n  B --&gt;|是| C[纯净物]\n  B --&gt;|否| D[混合物 空气 盐水 合金]\n  C --&gt; E{由几种元素组成?}\n  E --&gt;|一种| F[单质 O2 Fe He]\n  E --&gt;|两种及以上| G[化合物 H2O NaCl CO2]\n  G --&gt; H{只含氧和另一种元素?}\n  H --&gt;|是| I[氧化物 CO2 Fe2O3]\n  H --&gt;|否| J[酸 碱 盐 及其他]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从&quot;是不是一种物质&quot;开始分叉，再按元素种类往下走。每一步只问一个问题，避免同时判断两件事。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：整理衣柜。先把&quot;一件衣服&quot;和&quot;一堆衣服&quot;分开（纯净物/混合物），再看这件衣服是纯棉还是混纺（单质/化合物）。这个类比在&quot;同素异形体&quot;处失效：O₂ 和 O₃ 是两种&quot;衣服&quot;，但用的是同一种&quot;布料&quot;。<\/p>\n<p>实例：判断下列物质——<\/p>\n<ul><li>\n空气：混合物（N₂、O₂、CO₂ 等多种物质）\n<\/li><li>\n液氧：纯净物、单质（只有 O 元素）\n<\/li><li>\n干冰：纯净物、化合物、氧化物（CO₂）\n<\/li><li>\n食盐水：混合物（NaCl + H₂O）\n<\/li><li>\n生铁：混合物（Fe 与 C 等）\n<\/li><li>\n氧化铜 CuO：纯净物、化合物、氧化物\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;透明的、干净的就是纯净物&quot;——澄清石灰水是混合物，蒸馏水才是纯净物。\n<\/li><li>\n别以为&quot;冰水混合物&quot;是混合物——冰和水都是 H₂O，它是纯净物，只是状态不同。\n<\/li><li>\n别以为&quot;含氧的化合物都是氧化物&quot;——NaOH 含氧但含三种元素，不是氧化物。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列属于纯净物的是（ ）。A. 洁净的空气 B. 冰水混合物 C. 生理盐水 D. 大理石\n<p>（答案：B；解析：冰和水都是 H₂O，只有一种物质。A、C、D 都含多种物质。）<\/p>\n<\/ol>\n<ol><li>\n下列物质中属于氧化物的是（ ）。A. O₂ B. KClO₃ C. Fe₃O₄ D. H₂SO₄\n<p>（答案：C；解析：Fe₃O₄ 只含 Fe、O 两种元素。A 是单质，B、D 含三种元素。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;臭氧（O₃）和氧气（O₂）混合在一起，因为都只含氧元素，所以是纯净物。&quot;这句话对吗？\n<p>（答案：不对。O₃ 和 O₂ 是两种不同物质，混合后是混合物。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n纯净物看&quot;一种物质 + 固定化学式&quot;，混合物看&quot;多种物质&quot;。\n<\/li><li>\n单质按元素种类数判定，和状态、颜色无关。\n<\/li><li>\n氧化物必须是&quot;两种元素，其中一种是氧&quot;。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：《基础概念》第二节<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch01\">第 1 章：物质怎么分类<\/a><\/span><\/div><h1>第 2 章：原子、分子、离子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.7 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清原子、分子、离子三者的关系；\n<\/li><li>\n数出一个原子的质子数、中子数、电子数；\n<\/li><li>\n解释 Na 变成 Na⁺、Cl 变成 Cl⁻ 时到底发生了什么。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>化学反应只动<strong>最外层电子<\/strong>，原子核不变；粒子带电与否，取决于质子数和电子数是否相等。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：原子的三个零件（难度：基础）<\/h3>\n<p>原子由<strong>质子<\/strong>（带正电）、<strong>中子<\/strong>（不带电）、<strong>电子<\/strong>（带负电）组成。质子集中在中心的原子核里，电子在核外分层运动。<\/p>\n<p>三条恒等式先记住：<\/p>\n<ul><li>\n核电荷数 = 质子数 = 原子序数（元素在周期表里的序号）\n<\/li><li>\n质量数 = 质子数 + 中子数（电子质量太小，忽略）\n<\/li><li>\n中性原子：质子数 = 电子数\n<\/ul>\n<p>举例：¹²C 有 6 个质子、6 个中子、6 个电子；²³Na 有 11 个质子、12 个中子、11 个电子。<\/p>\n<h3>概念 2：分子（难度：基础）<\/h3>\n<p><strong>分子<\/strong>是保持物质化学性质的最小微粒。水由 H₂O 分子构成，每个分子里 2 个 H 原子和 1 个 O 原子以共价键相连。氧气是 O₂ 分子，二氧化碳是 CO₂ 分子。<\/p>\n<p>不是所有物质都由分子构成。NaCl 由 Na⁺ 和 Cl⁻ 按 1:1 排列成离子晶体，里面没有&quot;NaCl 分子&quot;；铁由 Fe 原子紧密堆积而成。所以&quot;分子是保持化学性质的最小微粒&quot;这句话，只对分子构成的物质成立。<\/p>\n<h3>概念 3：离子（难度：基础）<\/h3>\n<p>原子失去电子变成<strong>阳离子<\/strong>，得到电子变成<strong>阴离子<\/strong>。<\/p>\n<ul><li>\nNa 原子（11 质子、11 电子）失去 1 个电子 → Na⁺（11 质子、10 电子），带 1 个单位正电。\n<\/li><li>\nCl 原子（17 质子、17 电子）得到 1 个电子 → Cl⁻（17 质子、18 电子），带 1 个单位负电。\n<\/ul>\n<p>离子所带电荷数 = 质子数 − 电子数（带符号）。这句是后面写离子方程式、判断化合价的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[原子] --&gt;|失电子| B[阳离子 Na+]\n  A --&gt;|得电子| C[阴离子 Cl-]\n  A --&gt;|共用电子对| D[分子 H2O]\n  B --&gt; E[离子化合物 NaCl]\n  C --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：原子有三条去向——失电子、得电子、共用电子。前两条形成离子，第三条形成分子。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：原子像一个收支平衡的小公司，质子数是&quot;固定资产&quot;（不会变），电子是&quot;流动资金&quot;（可以借进借出）。借出电子就带正电，借进电子就带负电。这个类比在&quot;原子核也会变&quot;的核反应中失效。<\/p>\n<p>实例：计算 OH⁻ 的质子数和电子数。O 有 8 个质子，H 有 1 个，共 9 个质子；OH⁻ 带 1 个单位负电，说明电子比质子多 1 个，电子数 = 10。核外电子总数算对了，写电子式才不会错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;原子一定比分子小&quot;——CO₂ 分子里 3 个原子，但一个 CO₂ 分子当然比一个 C 原子重；反过来，一个蛋白质分子比一个 H 原子大得多。大小要拿具体对象比。\n<\/li><li>\n别以为&quot;离子只能在水溶液里存在&quot;——NaCl 固体里就有 Na⁺ 和 Cl⁻，只是不能自由移动，所以不导电。\n<\/li><li>\n别以为&quot;失电子后质量变小很多&quot;——电子质量约是质子的 1/1836，得失一两个电子，质量几乎不变。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n¹⁷O 的质子数、中子数、电子数分别是（ ）。A. 8、9、8 B. 9、8、9 C. 8、9、9 D. 17、8、17\n<p>（答案：A；解析：O 的原子序数 8，质子数 8；质量数 17，中子数 17−8=9；中性原子电子数=质子数=8。）<\/p>\n<\/ol>\n<ol><li>\nMg²⁺ 的质子数为 12，则它的电子数为（ ）。\n<p>（答案：10；解析：带 2 个单位正电，电子比质子少 2 个。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;NaCl 固体不导电，所以 NaCl 固体中不存在离子。&quot;\n<p>（答案：不对。NaCl 固体中有 Na⁺ 和 Cl⁻，但离子被固定在晶格中，不能自由移动，因此不导电。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n质子数决定元素种类，中子数决定同位素，电子数决定带电情况。\n<\/li><li>\n阳离子电子数 = 质子数 − 电荷数；阴离子电子数 = 质子数 + 电荷数绝对值。\n<\/li><li>\n不是所有物质都由分子构成。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：《基础概念》第三节<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch02\">第 2 章：原子、分子、离子<\/a><\/span><\/div><h1>第 3 章：化学式与化合价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：0.8 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n根据名称写出常见物质的化学式；\n<\/li><li>\n用化合价规则检查化学式对不对；\n<\/li><li>\n用&quot;十字交叉法&quot;由化合价写出化学式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>化学式是物质的&quot;配方标签&quot;：元素种类不能错，原子个数必须让正负化合价代数和为零。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：元素符号与化学式（难度：基础）<\/h3>\n<p><strong>元素符号<\/strong>是国际通用的元素缩写，H、O、C、Na、Cl、Fe。第一个字母大写，第二个字母小写：Cu 是铜，CU 是错误写法。<\/p>\n<p><strong>化学式<\/strong>用元素符号表示物质的组成。H₂O 表示每个水分子有 2 个 H、1 个 O；NaCl 表示 Na⁺ 与 Cl⁻ 的个数比为 1:1。化学式右下角的数字叫<strong>下标<\/strong>，表示原子个数，读的时候不读出来。<\/p>\n<h3>概念 2：化合价（难度：基础）<\/h3>\n<p><strong>化合价<\/strong>表示元素在形成化合物时得失电子（或电子对偏移）的数目，有正负之分。几条常用规则：<\/p>\n<ul><li>\n单质中元素化合价为 0：O₂ 中 O 为 0，Fe 中 Fe 为 0。\n<\/li><li>\n化合物中 H 通常为 +1，O 通常为 −2。\n<\/li><li>\n金属元素显正价，非金属元素常显负价。\n<\/li><li>\n任何化合物中，各元素化合价的代数和为 0。\n<\/ul>\n<p>常见要背的：Na +1、K +1、Ca +2、Mg +2、Al +3、Fe +2/+3、Cu +2、Zn +2、H +1、O −2、Cl −1（氯化物中）、S −2（硫化物中）。<\/p>\n<h3>概念 3：由化合价写化学式（难度：基础）<\/h3>\n<p>以氧化铝为例。Al 为 +3，O 为 −2。要让正负化合价代数和为 0，取 3 和 2 的最小公倍数 6：需要 2 个 Al（+6）和 3 个 O（−6），写成 Al₂O₃。<\/p>\n<p>操作上有个&quot;十字交叉法&quot;：把化合价绝对值交叉写到对方元素右下角，再约分。<\/p>\n<ul><li>\nAl(+3)、O(−2) → Al₂O₃\n<\/li><li>\nCa(+2)、Cl(−1) → CaCl₂\n<\/li><li>\nFe(+3)、O(−2) → Fe₂O₃\n<\/ul>\n<h3>概念 4：原子团（难度：基础）<\/h3>\n<p>多个原子常作为一个整体参加反应，叫<strong>原子团<\/strong>（根）。常见的有 OH⁻、NO₃⁻、SO₄²⁻、CO₃²⁻、NH₄⁺、HCO₃⁻。写化学式时原子团要加括号：Ca(OH)₂、Al₂(SO₄)₃，括号外的数字属于整个原子团。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[已知元素化合价] --&gt; B[正价写在对方右下角]\n  B --&gt; C[负价写在正价元素右下角]\n  C --&gt; D[约成最简整数比]\n  D --&gt; E[检查代数和为0]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：十字交叉法只是把&quot;代数和为零&quot;这一步做成机械操作。最后一步检查不能省。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：化学式像配平天平。左边放正价砝码，右边放负价砝码，两边必须一样重。这个类比在过氧化物、超氧化物里失效，因为氧的化合价不是 −2（如 H₂O₂ 中 O 为 −1）。<\/p>\n<p>实例：写硫酸铁。Fe 为 +3，SO₄ 为 −2。交叉得 Fe₂(SO₄)₃：2 个 Fe 共 +6，3 个 SO₄ 共 −6，代数和为 0。检查：Fe₂(SO₄)₃ 中 S 为 +6、O 为 −2，每个 SO₄ 为 −2，正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;下标可以随便改来配平&quot;——化学式由物质本身决定，配平时只能改前面的系数，绝不能改下标。\n<\/li><li>\n别以为&quot;化合价就是原子实际得失的电子数&quot;——在共价化合物里，化合价是电子对偏移的结果，不是完全得失。\n<\/li><li>\n别以为&quot;Ca(OH)₂ 的括号可以省&quot;——省了会变成 CaOH₂，含义完全不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n氧化铁的化学式是（ ）。A. FeO B. Fe₂O₃ C. Fe₃O₄ D. Fe(OH)₃\n<p>（答案：B；解析：铁为 +3，氧为 −2，交叉得 Fe₂O₃。）<\/p>\n<\/ol>\n<ol><li>\n下列化学式书写正确的是（ ）。A. Na₂CO₃ B. NaCO₃ C. NaCl₂ D. CaOH₂\n<p>（答案：A；解析：Na 为 +1，CO₃ 为 −2，需要 2 个 Na；B 电荷不平，C 钠应为 +1 与 −1 的 Cl 配 1:1，D 缺括号。）<\/p>\n<\/ol>\n<ol><li>\n计算 KMnO₄ 中 Mn 的化合价。\n<p>（答案：+7；解析：K 为 +1，O 为 −2，设 Mn 为 x，1 + x + 4×(−2) = 0，x = +7。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n化学式对错看两条：元素种类对不对、化合价代数和是不是零。\n<\/li><li>\n常见化合价先背金属和 H、O、Cl、S。\n<\/li><li>\n原子团要当作一个整体，写式子时加括号。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：《基础概念》第三节 + 高中化学基础知识大全<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch03\">第 3 章：化学式与化合价<\/a><\/span><\/div><h1>第 4 章：化学方程式与配平<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清化学方程式为什么必须配平；\n<\/li><li>\n用最小公倍数法配平常见方程式；\n<\/li><li>\n检查配平后的方程式（原子守恒、电荷守恒、条件标注）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程式是化学反应的&quot;账单&quot;：反应前后每种元素的原子个数必须一模一样，只能改系数，不能改下标。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：质量守恒（难度：基础）<\/h3>\n<p>化学反应中原子不会被消灭，也不会凭空产生，只是重新组合。所以反应前后每种元素的原子总数相等，这就是<strong>质量守恒定律<\/strong>。<\/p>\n<p>写方程式时，反应物写左边，生成物写右边，中间用箭头。箭头上面标条件：点燃、加热（△）、催化剂、高温。气体生成物标 ↑，沉淀标 ↓，但如果是反应物里本来就有气体，就不标。<\/p>\n<h3>概念 2：配平的步骤（难度：进阶）<\/h3>\n<p>以丙烷燃烧为例：C₃H₈ + O₂ → CO₂ + H₂O。<\/p>\n<p>第一步，先配 C 和 H，最后配 O。左边 3 个 C，右边先写 3CO₂；左边 8 个 H，右边写 4H₂O。 C₃H₈ + O₂ → 3CO₂ + 4H₂O<\/p>\n<p>第二步，数右边氧原子：3×2 + 4×1 = 10 个 O，左边 O₂ 需要 5 个分子。 C₃H₈ + 5O₂ → 3CO₂ + 4H₂O<\/p>\n<p>第三步，回查：C 3=3，H 8=8，O 10=10。配平完成。<\/p>\n<p>这条&quot;先配 C、H，最后配 O&quot;的顺序不是死规矩，但很实用：氧几乎出现在每个产物里，最后配它最省事。<\/p>\n<h3>概念 3：最小公倍数法（难度：进阶）<\/h3>\n<p>对 Fe + O₂ → Fe₃O₄ 这类反应，先看 Fe₃O₄ 里 Fe 是 3、O 是 4。左边 Fe 写 3，O₂ 写 2（2 个 O₂ 提供 4 个 O）： 3Fe + 2O₂ → Fe₃O₄<\/p>\n<p>再看另一边有奇数的元素，通常用最小公倍数。例如： Fe + HCl → FeCl₂ + H₂↑ Fe 1 个，Cl 需要 2 个，H 需要 2 个 → Fe + 2HCl → FeCl₂ + H₂↑<\/p>\n<h3>概念 4：氧化还原方程式的配平（难度：高难）<\/h3>\n<p>有化合价变化的反应，光数原子不够，还要让<strong>得失电子总数相等<\/strong>。步骤是：标化合价 → 找升降 → 算电子数 → 配系数 → 补水或 H⁺/OH⁻ → 查原子和电荷。<\/p>\n<p>以高锰酸钾与浓盐酸反应为例： KMnO₄ + HCl → KCl + MnCl₂ + Cl₂↑ + H₂O<\/p>\n<p>Mn 从 +7 降到 +2，得 5 个电子；Cl 从 −1 升到 0，每个 Cl 失 1 个电子，Cl₂ 分子失 2 个。要让电子守恒，Mn 与 Cl₂ 的系数比为 2:5： 2KMnO₄ + 16HCl → 2KCl + 2MnCl₂ + 5Cl₂↑ + 8H₂O<\/p>\n<p>检查：K 2=2，Mn 2=2，Cl 左边 16，右边 2+4+10=16，H 16=16，O 8=8。配平正确。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[写出反应物和生成物] --&gt; B{有化合价变化?}\n  B --&gt;|没有| C[数原子 用最小公倍数]\n  B --&gt;|有| D[标化合价 算电子得失]\n  D --&gt; E[让得失电子总数相等]\n  C --&gt; F[检查原子守恒]\n  E --&gt; F\n  F --&gt; G[标条件 箭头 气体沉淀符号]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先判断有没有化合价变化，这一步决定走&quot;数原子&quot;还是&quot;数电子&quot;。两条路最后都要回到原子守恒检查。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：配平像分装糖果。每种颜色的糖总数不能变，只能调整每袋装几颗。你不能把糖的颜色改掉——改下标就是改颜色，改系数才是改袋数。<\/p>\n<p>实例：配平 Fe₂O₃ + CO → Fe + CO₂（高炉炼铁）。 左边 Fe 2、O 3；右边 CO₂ 提供 O。每个 CO 拿走 1 个 O，需要 3 个 CO，生成 3 个 CO₂： Fe₂O₃ + 3CO → 2Fe + 3CO₂ 检查：Fe 2=2，C 3=3，O 3+3=6，右边 3×2=6。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;配平就是让两边看起来一样&quot;——必须逐元素数原子，不能凭感觉。\n<\/li><li>\n别以为&quot;系数可以写成分数就随便写&quot;——中学方程式系数一般用最简整数比。\n<\/li><li>\n别以为&quot;箭头可以写成等号&quot;——书写规范用箭头，热化学方程式才用等号并标状态。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n配平：__Al + __O₂ → __Al₂O₃\n<p>（答案：4Al + 3O₂ → 2Al₂O₃；解析：右边 2 个 Al₂O₃ 含 4 个 Al、6 个 O，左边需要 3 个 O₂。）<\/p>\n<\/ol>\n<ol><li>\n配平：__FeS₂ + __O₂ → __Fe₂O₃ + __SO₂\n<p>（答案：4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂；解析：Fe 4=4，S 8=8，O 左边 22，右边 2×3+8×2=22。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;配平时可以改化学式右下角的数字，只要两边原子数相等就行。&quot;这句话对吗？\n<p>（答案：不对。改下标就改变了物质本身，配平只能改前面的系数。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n先配出现在产物里种类少的元素（常是 C、H），氧最后配。\n<\/li><li>\n有化合价变化时，先让电子守恒，再数原子。\n<\/li><li>\n配平后必须逐元素回查，一步都不能省。\n<\/ul>", "ch05": "<div class=\"source-badge\">📖 出处：《基础概念》第二节 核心计算体系<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch04\">第 4 章：化学方程式与配平<\/a><\/span><\/div><h1>第 5 章：物质的量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在质量、粒子数、气体体积、浓度之间换算；\n<\/li><li>\n正确使用 n = m/M、n = N/N_A、n = V/V_m、c = n/V；\n<\/li><li>\n分清&quot;标况&quot;和&quot;常温常压&quot;。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>摩尔是把&quot;数不清的微粒&quot;换成&quot;可以称量的份数&quot;的桥梁：1 mol 就是 6.02×10²³ 个微粒。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：摩尔与阿伏伽德罗常数（难度：基础）<\/h3>\n<p><strong>物质的量<\/strong>（符号 n）是一个物理量，单位是<strong>摩尔<\/strong>（mol）。1 mol 任何微粒都含 6.02×10²³ 个该微粒，这个数叫<strong>阿伏伽德罗常数<\/strong> N_A。<\/p>\n<p>为什么用这么大一个数？因为一滴水里就有约 1.7×10²¹ 个水分子，直接用&quot;个&quot;计数不现实。用 mol 就像用&quot;打&quot;计数鸡蛋：一打是 12 个，一摩尔是 6.02×10²³ 个。<\/p>\n<p>注意，mol 后面要说明是什么微粒：1 mol H 是 6.02×10²³ 个氢原子，1 mol H₂ 是 6.02×10²³ 个氢分子，两者质量差一倍。<\/p>\n<h3>概念 2：摩尔质量（难度：基础）<\/h3>\n<p><strong>摩尔质量<\/strong> M 是 1 mol 物质的质量，单位 g/mol。数值上等于该物质的相对分子质量（或相对原子质量）。<\/p>\n<ul><li>\nH₂O 的相对分子质量是 18，所以 M(H₂O) = 18 g/mol，1 mol 水重 18 g。\n<\/li><li>\nFe 的相对原子质量是 56，M(Fe) = 56 g/mol。\n<\/ul>\n<p>公式：n = m / M。18 g 水就是 1 mol；36 g 水就是 2 mol。<\/p>\n<h3>概念 3：气体摩尔体积（难度：基础）<\/h3>\n<p>在<strong>标准状况<\/strong>（0 ℃、101 kPa）下，1 mol 任何理想气体的体积约为 22.4 L，记作 V_m = 22.4 L/mol。<\/p>\n<p>只有气体能用这个数。水在标况下是液体，1 mol 水约 18 mL，不是 22.4 L。温度升高或压强改变，气体体积也会变，所以&quot;22.4 L/mol&quot;必须绑定&quot;标准状况&quot;。<\/p>\n<p>公式：n = V / V_m（气体，标况）。<\/p>\n<h3>概念 4：物质的量浓度（难度：进阶）<\/h3>\n<p><strong>浓度<\/strong> c 表示每升溶液里含多少摩尔溶质，单位 mol/L。公式 c = n / V，V 是<strong>溶液体积<\/strong>，不是溶剂体积。<\/p>\n<p>配制 0.5 mol/L 的 NaCl 溶液 500 mL：需要 NaCl 的物质的量 n = cV = 0.5 × 0.5 = 0.25 mol，质量 m = nM = 0.25 × 58.5 = 14.6 g。称 14.6 g NaCl，加水溶解并定容到 500 mL。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  M[质量 m] --&gt;|n=m/M| N[物质的量 n]\n  P[微粒数 N] --&gt;|n=N/NA| N\n  V[气体体积 V] --&gt;|n=V/Vm| N\n  N --&gt;|c=n/V溶液| C[浓度 c]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中心是 n。质量、微粒数、气体体积都能先换成 n，再由 n 换到浓度。所有换算都绕不开摩尔。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：mol 像&quot;箱&quot;。一箱鸡蛋 360 个，一箱啤酒 24 瓶，一摩尔任何微粒都是 6.02×10²³ 个。箱子的好处是让&quot;个数&quot;变成&quot;箱数&quot;，可以直接称重、算钱。这个类比在&quot;微粒种类不同、单箱质量不同&quot;时正好成立：1 mol H₂ 和 1 mol O₂ 都是 6.02×10²³ 个分子，但质量不同。<\/p>\n<p>实例：标况下 11.2 L CO₂ 有多少摩尔、多少克、多少个分子？ n = 11.2 / 22.4 = 0.5 mol；m = 0.5 × 44 = 22 g；分子数 = 0.5 × 6.02×10²³ = 3.01×10²³ 个。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;1 mol 任何物质都是 22.4 L&quot;——22.4 L/mol 只对气体、只在标况成立。\n<\/li><li>\n别以为&quot;摩尔质量就是相对分子质量&quot;——数值相等，但摩尔质量有单位 g/mol。\n<\/li><li>\n别以为&quot;浓度公式里的 V 是水的体积&quot;——是溶液总体积，定容后的体积。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n2 mol H₂SO₄ 的质量是多少？（M = 98 g/mol）\n<p>（答案：196 g；解析：m = nM = 2×98。）<\/p>\n<\/ol>\n<ol><li>\n标况下 4.48 L O₂ 的物质的量是多少？\n<p>（答案：0.2 mol；解析：n = 4.48/22.4。）<\/p>\n<\/ol>\n<ol><li>\n将 0.1 mol NaCl 溶于水配成 200 mL 溶液，浓度是多少？\n<p>（答案：0.5 mol/L；解析：c = n/V = 0.1/0.2。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nn 是中心，四条换算公式围着它转。\n<\/li><li>\n22.4 L/mol 的两个前提：气体、标准状况。\n<\/li><li>\n浓度分母是溶液体积，不是溶剂体积。\n<\/ul>", "ch06": "<div class=\"source-badge\">📖 出处：《基础概念》第四节<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch04\">第 4 章：化学方程式与配平<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch05\">第 5 章：物质的量<\/a><\/span><\/div><h1>第 6 章：电解质与离子反应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 4、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一种物质是不是电解质、是强电解质还是弱电解质；\n<\/li><li>\n写出电离方程式；\n<\/li><li>\n按&quot;写、拆、删、查&quot;四步写出正确的离子方程式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>离子方程式只留下真正参加反应的离子，把&quot; spectator ion &quot;（旁观离子）删掉，但难溶物、气体、弱电解质不能拆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：电解质与非电解质（难度：基础）<\/h3>\n<p>在水溶液里或熔融状态下能导电的<strong>化合物<\/strong>叫<strong>电解质<\/strong>，如 NaCl、HCl、NaOH。两者都不能导电的化合物叫<strong>非电解质<\/strong>，如蔗糖、乙醇。<\/p>\n<p>注意两个坑：铜丝能导电，但它是单质，不是电解质；NaCl 固体不导电，但它在水溶液里能导电，所以 NaCl 是电解质。电解质是&quot;化合物&quot;这个身份，不是&quot;能不能导电&quot;这个现象。<\/p>\n<h3>概念 2：强电解质与弱电解质（难度：基础）<\/h3>\n<p><strong>强电解质<\/strong>在水中完全电离：强酸（HCl、H₂SO₄、HNO₃）、强碱（NaOH、KOH、Ba(OH)₂）、绝大多数盐。 <strong>弱电解质<\/strong>只部分电离：弱酸（CH₃COOH、H₂CO₃、HClO）、弱碱（NH₃·H₂O）、水。<\/p>\n<p>电离方程式写法不同：<\/p>\n<ul><li>\n强电解质：NaCl → Na⁺ + Cl⁻；H₂SO₄ → 2H⁺ + SO₄²⁻\n<\/li><li>\n弱电解质：CH₃COOH ⇌ CH₃COO⁻ + H⁺（用可逆号）\n<\/li><li>\n多元弱酸分步写：H₂CO₃ ⇌ H⁺ + HCO₃⁻，HCO₃⁻ ⇌ H⁺ + CO₃²⁻\n<\/ul>\n<h3>概念 3：离子方程式（难度：进阶）<\/h3>\n<p>离子方程式表示同一类反应的共同本质。以盐酸与氢氧化钠为例： HCl + NaOH → NaCl + H₂O 拆成离子：H⁺ + Cl⁻ + Na⁺ + OH⁻ → Na⁺ + Cl⁻ + H₂O 删掉两边相同的 Na⁺、Cl⁻：H⁺ + OH⁻ → H₂O<\/p>\n<p>四步口诀：<strong>写<\/strong>（写化学方程式）、<strong>拆<\/strong>（把可溶性强电解质拆成离子）、<strong>删<\/strong>（删两边相同的离子）、<strong>查<\/strong>（查原子守恒和电荷守恒）。<\/p>\n<p>拆的规则要背：<\/p>\n<ul><li>\n可溶的强电解质拆成离子；\n<\/li><li>\n难溶物（CaCO₃、BaSO₄、AgCl）、气体（CO₂、H₂）、水、弱电解质、氧化物（Fe₂O₃、CuO）一律不拆，写化学式；\n<\/li><li>\n微溶物作反应物时，若澄清溶液则拆，若悬浊液则不拆。\n<\/ul>\n<h3>概念 4：复分解反应发生的条件（难度：基础）<\/h3>\n<p>两种化合物互相交换成分，生成沉淀、气体或水，反应才能进行。三者只要有一个就行。<\/p>\n<ul><li>\n生成沉淀：AgNO₃ + NaCl → AgCl↓ + NaNO₃\n<\/li><li>\n生成气体：Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂↑\n<\/li><li>\n生成水：HCl + NaOH → NaCl + H₂O\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[写化学方程式] --&gt; B[拆 可溶强电解质]\n  B --&gt; C[删 两边相同离子]\n  C --&gt; D[查 原子守恒 电荷守恒]\n  D --&gt; E{都守恒?}\n  E --&gt;|否| B\n  E --&gt;|是| F[完成]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四步是一个循环，查不过就回去重拆。&quot;拆&quot;是最容易出错的一步，重点记哪些不能拆。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：离子方程式像开会签到。真正参与决策的人留下（参加反应的离子），只是坐在旁边的人删掉（旁观离子）。但&quot;难溶物&quot;是没到场的关键人物，不能删。<\/p>\n<p>实例：碳酸钙与盐酸反应。 化学方程式：CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑ 拆：CaCO₃ 难溶不拆；HCl 拆成 H⁺ + Cl⁻；CaCl₂ 拆成 Ca²⁺ + 2Cl⁻。 删：两边 Cl⁻ 删掉。 结果：CaCO₃ + 2H⁺ → Ca²⁺ + H₂O + CO₂↑ 检查：Ca 1=1，C 1=1，O 3=1+2，H 2=2，电荷左边 +2、右边 +2。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;能导电的就是电解质&quot;——铜能导电但是单质，不是电解质。\n<\/li><li>\n别以为&quot;离子方程式两边离子数目可以随便删&quot;——只有两边完全相同的离子才能删，而且要保证电荷守恒。\n<\/li><li>\n别以为&quot;弱酸可以拆成 H⁺&quot;——弱酸是弱电解质，必须写化学式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列物质属于强电解质的是（ ）。A. CH₃COOH B. NH₃·H₂O C. NaCl D. 蔗糖\n<p>（答案：C；解析：NaCl 是盐，完全电离。A、B 是弱电解质，D 是非电解质。）<\/p>\n<\/ol>\n<ol><li>\n写出盐酸与氢氧化钾反应的离子方程式。\n<p>（答案：H⁺ + OH⁻ → H₂O；解析：K⁺、Cl⁻ 是旁观离子，删掉。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;CaCO₃ 与盐酸反应的离子方程式中，CaCO₃ 应拆成 Ca²⁺ 和 CO₃²⁻。&quot;\n<p>（答案：不对。CaCO₃ 难溶，不能拆，写化学式。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n电解质必须是化合物，强弱看电离程度。\n<\/li><li>\n离子方程式四步：写、拆、删、查。\n<\/li><li>\n难溶物、气体、水、弱电解质、氧化物不拆。\n<\/ul>", "ch07": "<div class=\"source-badge\">📖 出处：《基础概念》第三节 + 高中化学基础知识大全<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch04\">第 4 章：化学方程式与配平<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch06\">第 6 章：电解质与离子反应<\/a><\/span><\/div><h1>第 7 章：氧化还原反应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 3、6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用化合价升降判断一个反应是不是氧化还原反应；\n<\/li><li>\n指出氧化剂、还原剂、被氧化、被还原；\n<\/li><li>\n用电子守恒配平简单的氧化还原方程式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>氧化还原的本质是电子转移：<strong>升失氧、降得还<\/strong>——化合价升高、失电子、被氧化；化合价降低、得电子、被还原。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从化合价看氧化还原（难度：基础）<\/h3>\n<p>有元素化合价升降的反应就是<strong>氧化还原反应<\/strong>。锌与硫酸反应： Zn + H₂SO₄ → ZnSO₄ + H₂↑ Zn 从 0 升到 +2，H 从 +1 降到 0。有升有降，是氧化还原。<\/p>\n<p>四大基本反应里，置换反应一定是氧化还原；复分解一定不是；化合和分解要看有没有单质参加或生成。比如 2H₂O₂ → 2H₂O + O₂↑ 是分解反应，但 O 从 −1 变到 −2 和 0，是氧化还原。<\/p>\n<h3>概念 2：氧化剂与还原剂（难度：基础）<\/h3>\n<ul><li>\n<strong>还原剂<\/strong>：失电子、化合价升高、被氧化，产物是氧化产物。\n<\/li><li>\n<strong>氧化剂<\/strong>：得电子、化合价降低、被还原，产物是还原产物。\n<\/ul>\n<p>记法：&quot;剂&quot;字看对方。还原剂帮别人还原，自己被氧化。<\/p>\n<p>常见氧化剂：O₂、Cl₂、浓硫酸、HNO₃、KMnO₄、FeCl₃、H₂O₂。 常见还原剂：金属单质、H₂、C、CO、SO₂、KI、FeSO₄。<\/p>\n<h3>概念 3：电子转移的表示（难度：进阶）<\/h3>\n<p>两种画法：<\/p>\n<ul><li>\n<strong>双线桥<\/strong>：从反应物指向生成物，标&quot;得/失 n e⁻&quot;，箭头上写化合价变化。\n<\/li><li>\n<strong>单线桥<\/strong>：只在反应物之间画，从还原剂指向氧化剂，标转移电子总数。\n<\/ul>\n<p>双线桥适合练习，单线桥适合快速判断。无论哪种，得失电子总数必须相等，这是配平的依据。<\/p>\n<h3>概念 4：氧化还原配平（难度：高难）<\/h3>\n<p>步骤：标价 → 找升降 → 算电子 → 配系数 → 补 H₂O/H⁺/OH⁻ → 查守恒。<\/p>\n<p>例：KMnO₄ 与 FeSO₄ 在酸性条件下反应。 Mn：+7 → +2，得 5 e⁻ Fe：+2 → +3，失 1 e⁻ 电子守恒要求 Mn : Fe = 1 : 5。 2KMnO₄ 里的 Mn 是 2 个，所以 FeSO₄ 要 10 个？先写成 2KMnO₄ + 10FeSO₄，再补硫酸和产物： 2KMnO₄ + 10FeSO₄ + 8H₂SO₄ → K₂SO₄ + 2MnSO₄ + 5Fe₂(SO₄)₃ + 8H₂O 检查：K 2=2，Mn 2=2，Fe 10=10，S 左边 10+8=18，右边 1+2+15=18，H 16=16，O 左边 8+40+32=80，右边 4+8+60+8=80。配平。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[还原剂] --&gt;|失电子 化合价升高| B[被氧化]\n  C[氧化剂] --&gt;|得电子 化合价降低| D[被还原]\n  B --&gt; E[氧化产物]\n  D --&gt; F[还原产物]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是反应物，右边是产物。箭头方向表示电子流向：还原剂把电子给氧化剂。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：氧化还原像转账。还原剂是付款方，余额减少（化合价升高），对方账户增加；氧化剂是收款方。电子就是钱，总量不变。这个类比在&quot;电子对偏移&quot;的共价反应里要打折扣，因为电子并没有完全转手。<\/p>\n<p>实例：判断 2Na + Cl₂ → 2NaCl 中的角色。 Na：0 → +1，失电子，是还原剂，被氧化。 Cl：0 → −1，得电子，是氧化剂，被还原。 转移电子数：2 个 Na 各失 1 个，共 2 e⁻。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;氧化剂被氧化&quot;——氧化剂被还原，还原剂被氧化。\n<\/li><li>\n别以为&quot;有氧元素参加就是氧化还原&quot;——CO₂ + H₂O → H₂CO₃ 没有化合价变化，不是氧化还原。\n<\/li><li>\n别以为&quot;化合价升高就是得电子&quot;——升高是失电子，记&quot;升失氧&quot;。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列反应属于氧化还原反应的是（ ）。A. NaOH + HCl → NaCl + H₂O B. CaCO₃ → CaO + CO₂↑ C. Zn + CuSO₄ → ZnSO₄ + Cu D. CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O\n<p>（答案：C；解析：Zn 0→+2，Cu +2→0，有化合价变化。）<\/p>\n<\/ol>\n<ol><li>\n在反应 Fe + 2HCl → FeCl₂ + H₂↑ 中，氧化剂是（ ）。\n<p>（答案：HCl（其中的 H⁺）；解析：H 从 +1 降到 0，得电子。）<\/p>\n<\/ol>\n<ol><li>\n配平：__KMnO₄ + __HCl → __KCl + __MnCl₂ + __Cl₂↑ + __H₂O\n<p>（答案：2KMnO₄ + 16HCl → 2KCl + 2MnCl₂ + 5Cl₂↑ + 8H₂O；解析：Mn 得 5 e⁻，每个 Cl 失 1 e⁻，Cl₂ 失 2 e⁻，Mn 与 Cl₂ 系数比 2:5。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n升失氧、降得还；剂性相反。\n<\/li><li>\n配平先电子守恒，再原子守恒。\n<\/li><li>\n置换反应必是氧化还原，复分解一定不是。\n<\/ul>", "ch08": "<div class=\"source-badge\">📖 出处：《基础概念》第五节 + 高中化学基础知识大全<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch02\">第 2 章：原子、分子、离子<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch07\">第 7 章：氧化还原反应<\/a><\/span><\/div><h1>第 8 章：元素周期表与化学键<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 2、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n由原子序数说出元素在周期表的位置；\n<\/li><li>\n判断金属性、非金属性强弱；\n<\/li><li>\n区分离子键、共价键，判断化合物类型。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>周期表按<strong>电子层数<\/strong>分行、按<strong>最外层电子数<\/strong>分列；原子靠&quot;凑成稳定电子结构&quot;的动机结合成键。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：周期与族（难度：基础）<\/h3>\n<p><strong>周期<\/strong>是横向的行，第 n 周期对应原子的 n 个电子层。第 1 周期只有 H、He；第 2 周期有 8 种元素；第 3 周期 8 种。 <strong>族<\/strong>是纵向的列，主族用 A 表示，副族用 B。主族序数 = 最外层电子数（对主族元素成立）。第 ⅠA 族最外层 1 个电子，第 ⅦA 族 7 个。<\/p>\n<p>周期表可以按&quot;金属/非金属&quot;分界线记：硼、硅、砷、碲、砹附近是分界线，左下方是金属，右上方是非金属，稀有气体在最右列。<\/p>\n<h3>概念 2：元素性质的周期性（难度：进阶）<\/h3>\n<p>同周期从左到右：核电荷数增大，原子半径减小，金属性减弱、非金属性增强。 同主族从上到下：电子层增多，原子半径增大，金属性增强、非金属性减弱。<\/p>\n<p>判断金属性强弱的实用依据：单质与水或酸反应越剧烈，金属性越强；最高价氧化物对应水化物（氢氧化物）碱性越强，金属性越强。 判断非金属性：单质与氢气化合越容易、生成氢化物越稳定，非金属性越强；最高价含氧酸酸性越强，非金属性越强。<\/p>\n<h3>概念 3：离子键（难度：基础）<\/h3>\n<p><strong>离子键<\/strong>是阴、阳离子之间的静电作用。典型组合是活泼金属 + 活泼非金属，如 NaCl、MgO、KBr。<\/p>\n<p>形成过程：Na 失 1 个电子变 Na⁺，Cl 得 1 个电子变 Cl⁻，两者靠静电引力结合。离子键没有方向性、没有饱和性，所以 NaCl 晶体里每个 Na⁺ 周围有 6 个 Cl⁻。<\/p>\n<h3>概念 4：共价键（难度：进阶）<\/h3>\n<p><strong>共价键<\/strong>是原子间共用电子对形成的键。非金属原子之间常形成共价键，如 H₂、Cl₂、H₂O、CO₂、CH₄。<\/p>\n<p>共价键分极性键和非极性键：<\/p>\n<ul><li>\n同种原子之间，电子对不偏移，是非极性键（H—H、Cl—Cl）；\n<\/li><li>\n不同种原子之间，电子对偏向电负性大的原子，是极性键（H—Cl、O—H）。\n<\/ul>\n<p>判断化合物类型：含离子键的化合物是离子化合物（NaCl、NaOH、Na₂O₂）；只含共价键的是共价化合物（HCl、CO₂、CH₄）。注意 NaOH 里既有离子键（Na⁺ 与 OH⁻）又有共价键（O—H），仍归为离子化合物。<\/p>\n<h3>概念 5：分子间作用力与氢键（难度：进阶）<\/h3>\n<p>分子之间还有较弱的作用力，叫<strong>范德华力<\/strong>，它决定物质的熔沸点。<strong>氢键<\/strong>是更特殊的一种：H 与电负性强的 N、O、F 相连时形成，比范德华力强、比共价键弱。<\/p>\n<p>水、NH₃、HF 的沸点异常高，就是氢键造成的。冰能浮在水面上，也和氢键形成的空腔结构有关。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[原子] --&gt; B{最外层是否稳定?}\n  B --&gt;|否| C[通过得失电子]\n  B --&gt;|否| D[通过共用电子]\n  C --&gt; E[离子键 金属+非金属]\n  D --&gt; F[共价键 非金属+非金属]\n  E --&gt; G[离子化合物 NaCl NaOH]\n  F --&gt; H[共价化合物 HCl CO2]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：稳定结构是目标，&quot;得电子/失电子&quot;与&quot;共用电子&quot;是两条路径，对应两类键。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：离子键像磁铁吸铁钉，正负相吸，没有方向；共价键像两人共握一根绳子，必须靠近、有方向。这个类比在金属键处失效，金属键是&quot;电子海&quot;把金属阳离子黏在一起。<\/p>\n<p>实例：判断 Na₂O、HCl、NaOH、CO₂ 的键型。 Na₂O：离子键；HCl：极性共价键；NaOH：离子键 + 极性共价键；CO₂：极性共价键（C=O），但分子整体对称，是非极性分子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;有共价键的化合物就是共价化合物&quot;——NaOH 有共价键，但它是离子化合物。\n<\/li><li>\n别以为&quot;稀有气体最外层都是 8 个电子&quot;——He 只有 2 个。\n<\/li><li>\n别以为&quot;分子间作用力和化学键是一回事&quot;——化学键改变物质种类，分子间作用力只影响熔沸点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列化合物中只含共价键的是（ ）。A. NaCl B. NaOH C. CO₂ D. K₂O\n<p>（答案：C；解析：CO₂ 由 C、O 非金属原子通过共价键结合。）<\/p>\n<\/ol>\n<ol><li>\n比较 Na、Mg、Al 的金属性强弱。\n<p>（答案：Na &gt; Mg &gt; Al；解析：同周期从左到右金属性减弱。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;H₂O 的沸点比 H₂S 高，是因为 H₂O 分子间的氢键。&quot;这句话对吗？\n<p>（答案：对。O 的电负性大、半径小，水分子间能形成氢键，H₂S 不能。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n周期看电子层数，主族看最外层电子数。\n<\/li><li>\n同周期右上方非金属性强，左下方金属性强。\n<\/li><li>\n离子键无方向性，共价键有方向性；NaOH 是离子化合物。\n<\/ul>", "ch09": "<div class=\"source-badge\">📖 出处：《基础概念》第六节<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch07\">第 7 章：氧化还原反应<\/a><\/span><\/div><h1>第 9 章：化学反应速率与化学平衡<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;单位时间内浓度变化&quot;表示反应速率；\n<\/li><li>\n说出浓度、温度、压强、催化剂如何影响速率；\n<\/li><li>\n用勒夏特列原理判断平衡移动方向。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>速率管&quot;多快&quot;，平衡管&quot;最终能生成多少&quot;；催化剂只改速率，不改平衡。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：反应速率（难度：基础）<\/h3>\n<p><strong>反应速率<\/strong>用单位时间内反应物浓度的减少或生成物浓度的增加表示，单位 mol/(L·s) 或 mol/(L·min)。<\/p>\n<p>对反应 aA + bB → cC + dD，各物质速率之比等于系数之比： v(A) : v(B) : v(C) : v(D) = a : b : c : d<\/p>\n<p>注意，用不同物质表示速率，数值可能不同，但描述的是同一个反应。<\/p>\n<h3>概念 2：影响速率的因素（难度：基础）<\/h3>\n<ul><li>\n<strong>浓度<\/strong>：反应物浓度越大，单位体积内分子数越多，碰撞越频繁，速率越快。\n<\/li><li>\n<strong>压强<\/strong>：只对有气体参加的反应有效，增大压强相当于压缩体积、提高浓度。\n<\/li><li>\n<strong>温度<\/strong>：升高温度，分子平均动能增大，活化分子比例增加，速率加快。\n<\/li><li>\n<strong>催化剂<\/strong>：降低反应的活化能，使更多分子成为活化分子，速率加快。\n<\/li><li>\n<strong>接触面积<\/strong>：固体块状改成粉末，表面积增大，速率加快。\n<\/ul>\n<h3>概念 3：可逆反应与平衡（难度：进阶）<\/h3>\n<p><strong>可逆反应<\/strong>在同一条件下既能正向进行，又能逆向进行，用可逆号 ⇌ 表示。反应开始时正反应速率最大，逆反应速率为零；随着反应进行，正反应速率下降、逆反应速率上升；当 v(正) = v(逆) 时，各物质浓度不再变化，达到<strong>化学平衡<\/strong>。<\/p>\n<p>平衡是动态的：反应并没有停止，只是正逆反应速率相等，宏观上看不到变化。<\/p>\n<h3>概念 4：勒夏特列原理（难度：进阶）<\/h3>\n<p>如果改变影响平衡的一个条件，平衡会向<strong>减弱这种改变<\/strong>的方向移动。<\/p>\n<ul><li>\n增大反应物浓度：平衡向正反应方向移动。\n<\/li><li>\n升高温度：平衡向吸热方向移动。\n<\/li><li>\n增大压强：平衡向气体分子数减少的方向移动。\n<\/li><li>\n加催化剂：不移动，只缩短达到平衡的时间。\n<\/ul>\n<p>合成氨 N₂ + 3H₂ ⇌ 2NH₃（放热、气体分子数减少）的工业条件：适当低温、高压、催化剂。低温有利于平衡但速率太慢，所以实际用 400–500 ℃ 折中，这就是&quot;速率与平衡要同时考虑&quot;的典型例子。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[反应开始] --&gt; B[正反应速率大]\n  B --&gt; C[正反应速率下降]\n  C --&gt; D[逆反应速率上升]\n  D --&gt; E[v正 = v逆 平衡]\n  E --&gt;|改变条件| F[平衡移动]\n  F --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：速率随时间变化，两条曲线相交处就是平衡。条件改变会让交点移动。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：平衡像商场里进出人数相等的状态。进去的人和出来的人一样多，商场总人数不变，但人一直在流动。这个类比在&quot;平衡是有条件的&quot;这一点上要补一句：门一关（条件变了），进出人数就不再相等。<\/p>\n<p>实例：对 N₂ + 3H₂ ⇌ 2NH₃，若增大压强，平衡向气体分子数少的一侧（右边，2 mol）移动，NH₃ 产率提高。若升高温度，平衡向吸热方向（左边）移动，NH₃ 产率下降。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;达到平衡反应就停止了&quot;——正逆反应仍在进行，只是速率相等。\n<\/li><li>\n别以为&quot;催化剂能提高产率&quot;——催化剂只加快达到平衡的时间，不改变平衡转化率。\n<\/li><li>\n别以为&quot;压强对任何反应都有影响&quot;——只对有气体参与且两边气体分子数不同的反应有明显影响。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n升高温度，反应速率（ ）。A. 一定加快 B. 一定减慢 C. 不变 D. 无法判断\n<p>（答案：A；解析：升温使活化分子比例增加，正逆反应速率都加快。）<\/p>\n<\/ol>\n<ol><li>\n对 2SO₂ + O₂ ⇌ 2SO₃（放热），增大压强，平衡向（ ）移动。\n<p>（答案：正反应方向；解析：右边气体分子数少，加压向分子数少的方向移动。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;加入催化剂可以使平衡向正反应方向移动，提高 SO₂ 的转化率。&quot;\n<p>（答案：不对。催化剂同等加快正逆反应，不改变平衡位置。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n速率看碰撞，平衡看正逆相等。\n<\/li><li>\n温度、浓度、压强、催化剂四把钥匙，各自影响不同。\n<\/li><li>\n勒夏特列原理只判断方向，不判断程度。\n<\/ul>", "ch10": "<div class=\"source-badge\">📖 出处：《基础概念》第七节<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/chapter/ch08\">第 8 章：元素周期表与化学键<\/a><\/span><\/div><h1>第 10 章：有机化学初识<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：第 8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个化合物是不是有机物；\n<\/li><li>\n认出羟基、羧基、碳碳双键、酯基四种官能团；\n<\/li><li>\n区分取代反应和加成反应。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>有机化学研究含碳化合物，碳原子能形成四个共价键，靠官能团决定性质。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：什么是有机物（难度：基础）<\/h3>\n<p><strong>有机物<\/strong>是绝大多数含碳的化合物，但 CO、CO₂、碳酸、碳酸盐、氰化物等归为无机物。有机物主要由 C、H 组成，常含 O、N、S、P、卤素。<\/p>\n<p>有机物数量庞大，原因是碳原子能彼此成链、成环，还能接各种官能团。目前已知有机物超过一亿种，而无机物只有几十万种。<\/p>\n<h3>概念 2：烃与官能团（难度：基础）<\/h3>\n<p>只含 C、H 两种元素的有机物叫<strong>烃<\/strong>。<\/p>\n<ul><li>\n<strong>烷烃<\/strong>：只含单键，饱和，如 CH₄、C₂H₆。\n<\/li><li>\n<strong>烯烃<\/strong>：含碳碳双键 C=C，如 CH₂=CH₂。\n<\/li><li>\n<strong>炔烃<\/strong>：含碳碳三键 C≡C，如 HC≡CH。\n<\/ul>\n<p><strong>官能团<\/strong>是决定有机物化学性质的原子或原子团。必须认识的四个：<\/p>\n<ul><li>\n羟基 —OH（醇、酚）\n<\/li><li>\n羧基 —COOH（羧酸）\n<\/li><li>\n碳碳双键 C=C（烯烃）\n<\/li><li>\n酯基 —COO—（酯）\n<\/ul>\n<h3>概念 3：同分异构（难度：进阶）<\/h3>\n<p>分子式相同、结构不同的化合物互为<strong>同分异构体<\/strong>。比如 C₄H₁₀ 有两种：正丁烷 CH₃CH₂CH₂CH₃ 和异丁烷 CH₃CH(CH₃)CH₃。它们分子式都是 C₄H₁₀，但支链不同，性质不同。<\/p>\n<p>同分异构有三种常见类型：碳链异构（支链位置不同）、位置异构（官能团位置不同）、类别异构（官能团种类不同，如乙醇和二甲醚）。<\/p>\n<h3>概念 4：取代与加成（难度：进阶）<\/h3>\n<p><strong>取代反应<\/strong>：有机物中的原子或原子团被其他原子或原子团替换。 CH₄ + Cl₂ →(光照) CH₃Cl + HCl<\/p>\n<p><strong>加成反应<\/strong>：不饱和键打开，两个原子或基团直接加上去。 CH₂=CH₂ + Br₂ → CH₂BrCH₂Br<\/p>\n<p><strong>酯化反应<\/strong>：羧酸和醇在浓硫酸催化下生成酯和水，属于取代反应的一种。 CH₃COOH + C₂H₅OH ⇌(浓硫酸, △) CH₃COOC₂H₅ + H₂O<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[有机物] --&gt; B[烃 只含C H]\n  A --&gt; C[烃的衍生物 含官能团]\n  B --&gt; D[烷烃 单键]\n  B --&gt; E[烯烃 双键]\n  B --&gt; F[炔烃 三键]\n  C --&gt; G[醇 羟基]\n  C --&gt; H[羧酸 羧基]\n  C --&gt; I[酯 酯基]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先分&quot;只含 C、H&quot;还是&quot;含官能团&quot;，再按官能团细分类。这张图是后面有机模块的骨架。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：碳原子像有四个插口的海绵，能接四个键；官能团像插在不同位置的&quot;功能模块&quot;，插上什么模块，就有什么性质。这个类比在&quot;共轭体系&quot;里会失效，因为双键之间会相互影响，不是简单拼接。<\/p>\n<p>实例：乙醇 C₂H₅OH 和二甲醚 CH₃OCH₃ 分子式都是 C₂H₆O，但乙醇有羟基、能与钠反应，二甲醚没有羟基、不能。这就是类别异构导致性质不同。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;含碳的化合物都是有机物&quot;——CO₂、Na₂CO₃ 是无机物。\n<\/li><li>\n别以为&quot;同分异构体是同一种物质&quot;——结构不同，性质不同，是不同物质。\n<\/li><li>\n别以为&quot;加成反应和取代反应可以随便叫&quot;——加成是不饱和键打开加东西，取代是换掉一个原子或基团。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列属于有机物的是（ ）。A. CO₂ B. CH₄ C. Na₂CO₃ D. H₂CO₃\n<p>（答案：B；解析：CH₄ 是含碳的烃。）<\/p>\n<\/ol>\n<ol><li>\n乙烯与溴水反应属于（ ）。A. 取代反应 B. 加成反应 C. 酯化反应 D. 复分解反应\n<p>（答案：B；解析：碳碳双键打开，溴原子加在两个碳上。）<\/p>\n<\/ol>\n<ol><li>\n写出乙酸与乙醇酯化反应的化学方程式。\n<p>（答案：CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O，条件为浓硫酸、加热。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n有机物看碳，但 CO₂、碳酸盐除外。\n<\/li><li>\n四个必认官能团：羟基、羧基、碳碳双键、酯基。\n<\/li><li>\n取代是&quot;换&quot;，加成是&quot;加&quot;，酯化是取代的一种。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：《基础概念》核心计算体系<\/div><h1>物质的量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>物质的量是表示&quot;微粒集合有多少份&quot;的物理量，1 份就是 1 mol，含 6.02×10²³ 个微粒。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是化学计算的通用货币。质量、气体体积、溶液浓度、微粒数，四种完全不同的量，都要先换成物质的量才能互相比较。没有它，方程式里的系数就只是&quot;个数比&quot;，没法称、没法量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[质量 m] --&gt;|÷M| N[n]\n  B[微粒数 N] --&gt;|÷NA| N\n  C[气体体积 V] --&gt;|÷Vm| N\n  N --&gt;|÷V溶液| D[浓度 c]\n  N --&gt;|×M| A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>摩尔不是质量单位，也不是体积单位，它数的是&quot;个数&quot;。一打鸡蛋是 12 个，一摩尔微粒是 6.02×10²³ 个。选这么大的数，是因为微观粒子实在太多：1 g 水中约有 3.3×10²² 个水分子。<\/p>\n<p>四条换算都以 n 为中心。做题时先把题目给的量换成 n，再从 n 换成目标量。这个习惯能避免&quot;公式记混&quot;：公式可以忘，中心思想不会忘。<\/p>\n<p>摩尔质量 M 的单位是 g/mol，数值上等于相对分子质量。气体摩尔体积 22.4 L/mol 只对气体、只在标准状况成立。浓度 c = n/V，V 是溶液体积。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;1 mol 任何物质都是 22.4 L&quot;——只对气体、只在标况。\n<\/li><li>\n别以为&quot;摩尔质量没有单位&quot;——数值等于相对分子质量，但单位是 g/mol。\n<\/li><li>\n别以为&quot;浓度公式里的 V 是溶剂体积&quot;——是溶液总体积。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>入门第 5 章<\/td><td>四条换算<\/td><td>n 是中心<\/td><\/tr><tr><td>普化第 1 章<\/td><td>理想气体方程<\/td><td>pV=nRT 把 n 与 p、V、T 连起来<\/td><\/tr><tr><td>普化第 6 章<\/td><td>浓度与 pH<\/td><td>c 是平衡计算的起点<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：化学式、化学方程式\n<\/li><li>\n后续：理想气体、化学平衡、浓度\n<\/ul>", "c02": "<div class=\"source-badge\">📖 出处：《基础概念》第四节<\/div><h1>离子方程式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：入门第 6 章、陌生方程式第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>离子方程式是把可溶强电解质拆成离子、删去两边旁观离子后，只保留真正参加反应的离子的方程式。<\/p>\n<h2>为什么重要<\/h2>\n<p>它表示一类反应的共同本质。盐酸与氢氧化钠、硫酸与氢氧化钾，化学方程式不同，离子方程式都是 H⁺ + OH⁻ → H₂O。掌握了它，就不必为每个具体物质单独背反应。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[写化学方程式] --&gt; B[拆 可溶强电解质]\n  B --&gt; C[删 两边相同离子]\n  C --&gt; D[查 原子与电荷]\n  D --&gt; E{守恒?}\n  E --&gt;|否| B\n  E --&gt;|是| F[完成]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>拆写规则是核心。能拆的只有&quot;可溶的强电解质&quot;：强酸、强碱、可溶性盐。不能拆的包括：<\/p>\n<ul><li>\n难溶物：CaCO₃、BaSO₄、AgCl、Fe(OH)₃；\n<\/li><li>\n气体：CO₂、SO₂、H₂；\n<\/li><li>\n水；\n<\/li><li>\n弱电解质：CH₃COOH、NH₃·H₂O、HClO；\n<\/li><li>\n氧化物：Fe₂O₃、CuO。\n<\/ul>\n<p>微溶物要看状态：澄清石灰水作反应物时拆成 Ca²⁺ 和 OH⁻，石灰乳则不拆。<\/p>\n<p>检查两项：原子守恒、电荷守恒。电荷不平，说明拆错或系数错，必须回去改。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;所有化合物都要拆&quot;——难溶物、气体、水、弱电解质、氧化物都不拆。\n<\/li><li>\n别以为&quot;两边相同的离子都可以删&quot;——只有完全相同的离子才能删，且删后要保证电荷守恒。\n<\/li><li>\n别以为&quot;弱酸写成 H⁺ 更简洁&quot;——弱酸是弱电解质，必须写化学式。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>入门第 6 章<\/td><td>四步法<\/td><td>写、拆、删、查<\/td><\/tr><tr><td>普化第 6 章<\/td><td>酸碱反应<\/td><td>H⁺ + OH⁻ → H₂O<\/td><\/tr><tr><td>陌生第 1 章<\/td><td>信息型题目<\/td><td>先定产物再拆写<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：电解质、电离\n<\/li><li>\n后续：酸碱平衡、沉淀溶解平衡\n<\/ul>", "c03": "<div class=\"source-badge\">📖 出处：《基础概念》第三节<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/zero-basis-chem/concept/c02\">离子方程式<\/a><\/span><\/div><h1>氧化还原反应<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：入门第 7 章、普化第 8 章、陌生第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>有元素化合价升降（电子转移）的化学反应，叫氧化还原反应。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是一大类反应的统一框架：金属腐蚀、电池、燃烧、呼吸、工业制氯、炼铁，全是氧化还原。判断氧化剂还原剂、配平、写电极反应，都从这一条出发。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[还原剂] --&gt;|失电子 价升高 被氧化| B[氧化产物]\n  C[氧化剂] --&gt;|得电子 价降低 被还原| D[还原产物]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判断只看一件事：有没有元素化合价变化。有，就是氧化还原；没有，就不是。不要看有没有氧元素参加。<\/p>\n<p>四个角色要分清：<\/p>\n<ul><li>\n还原剂：失电子、价升高、被氧化；\n<\/li><li>\n氧化剂：得电子、价降低、被还原；\n<\/li><li>\n氧化产物：还原剂被氧化后的产物；\n<\/li><li>\n还原产物：氧化剂被还原后的产物。\n<\/ul>\n<p>配平的核心是电子守恒。算出每个元素得失多少电子，让总数相等，再配原子，最后补 H⁺/OH⁻/H₂O。离子方程式还要查电荷。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;氧化剂被氧化&quot;——氧化剂被还原，还原剂被氧化。\n<\/li><li>\n别以为&quot;有氧气参加就是氧化还原&quot;——要看化合价有没有变。\n<\/li><li>\n别以为&quot;配平只数原子&quot;——氧化还原必须先让电子守恒。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>入门第 7 章<\/td><td>四大反应类型<\/td><td>置换必是，复分解必不是<\/td><\/tr><tr><td>普化第 8 章<\/td><td>原电池<\/td><td>负极氧化、正极还原<\/td><\/tr><tr><td>陌生第 1 章<\/td><td>信息型配平<\/td><td>电子守恒优先<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：化合价、化学方程式\n<\/li><li>\n后续：电极电势、Nernst 方程\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先学会给物质分类<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch01\">第 1 章：物质怎么分类<\/a><br>检查点：能独立判断 6 种常见物质的类别<\/li><li class='path-step' id='path-02'><strong>步骤 02：看懂微观粒子和符号<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch02\">第 2 章：原子、分子、离子<\/a>、<a href=\"#/book/zero-basis-chem/chapter/ch03\">第 3 章：化学式与化合价<\/a><br>检查点：能写常见化学式并检查化合价<\/li><li class='path-step' id='path-03'><strong>步骤 03：会写会配平方程式<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch04\">第 4 章：化学方程式与配平<\/a><br>检查点：独立配平 3 个方程式<\/li><li class='path-step' id='path-04'><strong>步骤 04：掌握化学计算的语言<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch05\">第 5 章：物质的量<\/a><br>检查点：四条换算各做对 2 题<\/li><li class='path-step' id='path-05'><strong>步骤 05：进入溶液与离子<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch06\">第 6 章：电解质与离子反应<\/a><br>检查点：能写出 3 个离子方程式<\/li><li class='path-step' id='path-06'><strong>步骤 06：理解电子转移<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch07\">第 7 章：氧化还原反应<\/a><br>检查点：能判断氧化剂还原剂并配平<\/li><li class='path-step' id='path-07'><strong>步骤 07：结构与周期律<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch08\">第 8 章：元素周期表与化学键<\/a><br>检查点：能判断键型和金属性顺序<\/li><li class='path-step' id='path-08'><strong>步骤 08：反应快慢与限度<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch09\">第 9 章：反应速率与化学平衡<\/a><br>检查点：能判断平衡移动方向<\/li><li class='path-step' id='path-09'><strong>步骤 09：有机入门<\/strong><br>阅读：<a href=\"#/book/zero-basis-chem/chapter/ch10\">第 10 章：有机化学初识<\/a><br>检查点：能认出四种官能团<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：物质怎么分类<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 下列属于纯净物的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 洁净的空气<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 冰水混合物<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 生理盐水<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 大理石<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\ 、化合价降低、被还原的物质 <span class=glossary-ref>（第 7 章：氧化还原反应）<\/span><\/li><li data-term='还原剂'>还原剂 — 失电子、化合价升高、被氧化的物质 <span class=glossary-ref>（第 7 章：氧化还原反应）<\/span><\/li><li data-term='物质的量'>物质的量 — 表示微粒集合份数的物理量，单位 mol <span class=glossary-ref>（第 5 章：物质的量）<\/span><\/li><li data-term='摩尔质量'>摩尔质量 — 1 mol 物质的质量，单位 g/mol <span class=glossary-ref>（第 5 章：物质的量）<\/span><\/li><li data-term='官能团'>官能团 — 决定有机物化学性质的原子或原子团 <span class=glossary-ref>（第 10 章：有机化学初识）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：物质分类树<\/h2>\n<p>拿到一个物质名，先问两个问题：是不是只有一种物质？由几种元素组成？两步就能落到单质、化合物、氧化物、酸碱盐。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n判断电解质：先确认是化合物，再看水溶液或熔融态能否导电。铜能导电但是单质，不是电解质。\n<\/li><li>\n写离子方程式：写 → 拆 → 删 → 查。拆之前先问&quot;它溶不溶、强不强&quot;。\n<\/li><li>\n判断氧化还原：只看化合价有没有变，不看有没有氧气参加。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n配平时改下标。下标一改，物质就变了，方程式再平衡也不是原反应。\n<\/li><li>\n把&quot;能导电&quot;当成&quot;是电解质&quot;。\n<\/li><li>\n平衡时认为反应停止。平衡是动态的，v正 = v逆 ≠ 0。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>物质的量<\/td><td>n = m/M<\/td><\/tr><tr><td>微粒数<\/td><td>n = N/N_A，N_A = 6.02×10²³<\/td><\/tr><tr><td>气体体积<\/td><td>n = V/V_m，标况 V_m = 22.4 L/mol<\/td><\/tr><tr><td>浓度<\/td><td>c = n/V溶液<\/td><\/tr><\/tbody><\/table>\n<h2>常见化合价<\/h2>\n<table><thead><tr><th>元素<\/th><th>价态<\/th><\/tr><\/thead><tbody><tr><td>H<\/td><td>+1（金属氢化物中 -1）<\/td><\/tr><tr><td>O<\/td><td>-2（过氧化物 -1）<\/td><\/tr><tr><td>Na、K<\/td><td>+1<\/td><\/tr><tr><td>Ca、Mg、Ba<\/td><td>+2<\/td><\/tr><tr><td>Al<\/td><td>+3<\/td><\/tr><tr><td>Fe<\/td><td>+2、+3<\/td><\/tr><tr><td>Cu<\/td><td>+2（少数 +1）<\/td><\/tr><tr><td>Cl<\/td><td>-1（氯化物中）<\/td><\/tr><tr><td>S<\/td><td>-2（硫化物中）<\/td><\/tr><\/tbody><\/table>\n<h2>离子方程式拆写<\/h2>\n<ul><li>\n拆：强酸、强碱、可溶盐\n<\/li><li>\n不拆：难溶物、气体、水、弱电解质、氧化物、微溶物悬浊液\n<\/ul>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：物质怎么分类", "href": "#/chapter/ch01"}, {"label": "第 2 章：原子、分子、离子", "href": "#/chapter/ch02"}, {"label": "第 3 章：化学式与化合价", "href": "#/chapter/ch03"}, {"label": "第 4 章：化学方程式与配平", "href": "#/chapter/ch04"}, {"label": "第 5 章：物质的量", "href": "#/chapter/ch05"}, {"label": "第 6 章：电解质与离子反应", "href": "#/chapter/ch06"}, {"label": "第 7 章：氧化还原反应", "href": "#/chapter/ch07"}, {"label": "第 8 章：元素周期表与化学键", "href": "#/chapter/ch08"}, {"label": "第 9 章：反应速率与化学平衡", "href": "#/chapter/ch09"}, {"label": "第 10 章：有机化学初识", "href": "#/chapter/ch10"}]}, {"label": "概念", "children": [{"label": "物质的量", "href": "#/concept/c01"}, {"label": "离子方程式", "href": "#/concept/c02"}, {"label": "氧化还原反应", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：物质怎么分类", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：原子、分子、离子", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：化学式与化合价", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：化学方程式与配平", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：物质的量", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：电解质与离子反应", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：氧化还原反应", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：元素周期表与化学键", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：反应速率与化学平衡", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：有机化学初识", "href": "#/quiz/ch10"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true, "ch05": true, "ch06": true, "ch07": true, "ch08": true, "ch09": true, "ch10": true}},"general-chem":{"manifest": {"slug": "general-chem", "title": "普通化学原理：大学化学的主干", "subtitle": "以华彤文《普通化学原理》为主线，讲透热力学、平衡、电化学与结构", "book
