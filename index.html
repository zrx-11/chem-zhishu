t type='radio' name='ch01-q16' value='0'> 8NH3 + 6NO2 → 7N2 + 12H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q16' value='1'> 4NH3 + 6NO2 → 5N2 + 6H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q16' value='2'> 8NH3 + 6NO2 → 7N2 + 6H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q16' value='3'> 2NH3 + 3NO2 → 3N2 + 2H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q17' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q17.<\/b> 少量 NH3 与过量 Cl2 反应生成酸性气体和 NCl3，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q17' value='0'> NH3 + 3Cl2 → NCl3 + 3HCl<\/label><label class='quiz-opt'><input type='radio' name='ch01-q17' value='1'> NH3 + Cl2 → NCl3 + HCl<\/label><label class='quiz-opt'><input type='radio' name='ch01-q17' value='2'> 2NH3 + 3Cl2 → 2NCl3 + 3H2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q17' value='3'> NH3 + 2Cl2 → NCl2 + 2HCl<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q18' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q18.<\/b> 酸性条件下 Cr2O7^2- 氧化 SO3^2- 为 SO4^2-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q18' value='0'> Cr2O7^2- + 3SO3^2- + 8H+ → 2Cr3+ + 3SO4^2- + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q18' value='1'> Cr2O7^2- + 3SO3^2- + 6H+ → 2Cr3+ + 3SO4^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q18' value='2'> Cr2O7^2- + SO3^2- + 8H+ → 2Cr3+ + SO4^2- + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q18' value='3'> Cr2O7^2- + 3SO3^2- + 14H+ → 2Cr3+ + 3SO4^2- + 7H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q19' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q19.<\/b> CeO2 在稀硫酸和 H2O2 作用下生成 Ce3+，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q19' value='0'> 2CeO2 + H2O2 + 3H2SO4 → Ce2(SO4)3 + O2↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q19' value='1'> CeO2 + H2O2 + H2SO4 → CeSO4 + O2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q19' value='2'> 2CeO2 + H2O2 + 2H2SO4 → Ce2(SO4)3 + O2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q19' value='3'> CeO2 + H2O2 + 2H2SO4 → Ce(SO4)2 + 3H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q20' data-type='blank' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q20.<\/b> EDTA 滴定：2.6826 g 样品配成 250 mL，取 25.00 mL 用 0.04000 mol/L EDTA 消耗 25.50 mL，NiSO4·nH2O 的 n 是多少？（填整数）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q21' data-type='blank' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q21.<\/b> 金属钠与 H2 反应生成甲，4.80 g 甲完全分解得到 2.24 L（标况）H2，甲的化学式是？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='信息型方程式'>信息型方程式 — 题干给出现象或流程，需要自己推断产物的方程式 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电荷守恒'>电荷守恒 — 离子方程式左右两边电荷代数和相等 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电子守恒'>电子守恒 — 氧化还原中得失电子总数相等 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电极反应式'>电极反应式 — 只写正极或负极（阳极或阴极）的半反应式 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='熔融碳酸盐环境'>熔融碳酸盐环境 — 燃料电池中以 CO3^2- 为载流子的电解质环境 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：五步流水线<\/h2>\n<p>读信息（反应物、产物线索、环境、价态）→ 判类型（化学式/离子式/电极式）→ 定产物（价态、环境、元素守恒）→ 配平（电子、原子、电荷）→ 检查（原子、电荷、电子、符号）。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n有化合价变化：先电子守恒，再配原子，最后用 H+ 或 OH- 调电荷。\n<\/li><li>\n酸性补 H+，碱性补 OH-，熔融碳酸盐补 CO3^2-。\n<\/li><li>\n离子方程式：难溶物、气体、水、弱电解质、氧化物一律不拆。\n<\/li><li>\n电极反应：先定正负极，再写半反应，最后按电解质环境补离子。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只数原子不管电荷。离子方程式电荷不平，一定错。\n<\/li><li>\n产物全靠猜。产物要由价态、环境、元素守恒三条线索推。\n<\/li><li>\n气体、沉淀符号漏标。符号也是得分点。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>五步<\/h2>\n<ol><li>\n读信息：反应物、产物线索、环境、价态\n<\/li><li>\n判类型：化学式 / 离子式 / 电极式\n<\/li><li>\n定产物：价态、环境、元素守恒\n<\/li><li>\n配平：电子 → 原子 → 电荷\n<\/li><li>\n检查：原子、电荷、电子、符号\n<\/ol>\n<h2>环境补项<\/h2>\n<table><thead><tr><th>环境<\/th><th>补什么<\/th><\/tr><\/thead><tbody><tr><td>酸性<\/td><td>H+ 和 H2O<\/td><\/tr><tr><td>碱性<\/td><td>OH- 和 H2O<\/td><\/tr><tr><td>熔融碳酸盐<\/td><td>CO3^2- 和 CO2<\/td><\/tr><\/tbody><\/table>\n<h2>高频产物<\/h2>\n<table><thead><tr><th>元素<\/th><th>常见产物<\/th><\/tr><\/thead><tbody><tr><td>Mn<\/td><td>Mn2+（酸性）、MnO2（中性/弱碱）<\/td><\/tr><tr><td>Cr<\/td><td>Cr3+（还原）、CrO4^2-（碱性氧化）<\/td><\/tr><tr><td>S<\/td><td>SO2、SO4^2-、S<\/td><\/tr><tr><td>N<\/td><td>NO、NO3-、N2<\/td><\/tr><tr><td>C<\/td><td>CO2、CO3^2-<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：陌生方程式书写的五步法", "href": "#/chapter/ch01"}]}, {"label": "概念", "children": [{"label": "陌生方程式五步法", "href": "#/concept/c01"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：陌生方程式书写的五步法", "href": "#/quiz/ch01"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true}}};

><td>—<\/td><td>普化讲一般规则，无机讲具体实例<\/td><\/tr><tr><td>手性<\/td><td>第 10 章（只提同分异构）<\/td><td>—<\/td><td>—<\/td><td>第 4 章（手性碳、R/S）<\/td><td>—<\/td><td>有机模块唯一深入讲的地方<\/td><\/tr><tr><td>陌生方程式<\/td><td>第 4、6、7 章<\/td><td>第 8 章（电极式）<\/td><td>第 2–4 章（元素反应）<\/td><td>—<\/td><td>第 1 章（五步法）<\/td><td>第 5 本是应试整合，依赖前四本<\/td><\/tr><\/tbody><\/table>\n<h2>使用方式<\/h2>\n<p>先在某本书学到该概念，再到这张表看其他书怎么讲同一个概念。交叉复习的效果比重复读同一本书好：同一件事换三种说法，理解会稳。<\/p>\n<p>发现两本书口径不一致时，以&quot;定量、带适用条件&quot;的那本为准。比如酸碱，普化给 Ka 和缓冲方程，无机只给酸性强弱顺序，做题时用普化的定量口径。<\/p>", "doc3": "<h1>综合检验建议<\/h1>\n<h2>跨书整合题<\/h2>\n<h3>题 1：从一瓶&quot;不明溶液&quot;到一份鉴定报告<\/h3>\n<ul><li>\n涉及：零基础第 6 章、普化第 6、7 章、无机第 4 章\n<\/li><li>\n要求：给出含 Fe³⁺、Cu²⁺、Cl⁻、SO₄²⁻ 的混合液，设计检验顺序，写出每一步的离子方程式和现象。\n<\/li><li>\n评分要点：① 先分组检验，避免相互干扰；② 每个离子至少一种专属检验；③ 方程式拆写正确；④ 说明沉淀颜色与溶解性。\n<\/ul>\n<h3>题 2：一块铁为什么在潮湿空气里烂得快<\/h3>\n<ul><li>\n涉及：普化第 8 章、无机第 4 章、零基础第 7 章\n<\/li><li>\n要求：写析氢腐蚀和吸氧腐蚀的正负极反应，说明盐桥（或液膜）的作用，给出两种防锈方案并解释原理。\n<\/li><li>\n评分要点：① 区分酸性与中性环境；② 电极反应式正确；③ 防锈方案与电化学原理对应；④ 提到牺牲阳极或涂层。\n<\/ul>\n<h3>题 3：工业合成氨的条件为什么是 400–500 ℃、高压、催化剂<\/h3>\n<ul><li>\n涉及：普化第 4、5、9 章\n<\/li><li>\n要求：用 ΔG、K、速率三套语言解释，画一张&quot;温度—产率—速率&quot;的权衡图。\n<\/li><li>\n评分要点：① 放热与气体分子数减少的判断；② 低温有利平衡但速率慢；③ 催化剂不改变 K；④ 结论落到&quot;折中条件&quot;。\n<\/ul>\n<h3>题 4：一份胃药说明书里的化学<\/h3>\n<ul><li>\n涉及：普化第 6 章、无机第 3 章、有机第 1 章\n<\/li><li>\n要求：常见抗酸药含 Al(OH)₃、Mg(OH)₂、NaHCO₃，比较三者中和胃酸的能力与副作用，写离子方程式。\n<\/li><li>\n评分要点：① 三者的碱性与溶解度差异；② NaHCO₃ 产生 CO₂ 的问题；③ 铝、镁的副作用；④ 方程式正确。\n<\/ul>\n<h3>题 5：从乙烯到塑料杯<\/h3>\n<ul><li>\n涉及：有机第 3 章、普化第 9 章\n<\/li><li>\n要求：写出乙烯聚合的方程式，说明反应类型、条件，比较聚乙烯与聚氯乙烯的结构差异与用途。\n<\/li><li>\n评分要点：① 加成聚合机理；② 链节写法；③ 取代基对性质的影响；④ 用途与安全性。\n<\/ul>\n<h3>题 6：陌生方程式综合卷<\/h3>\n<ul><li>\n涉及：零基础第 4、6、7 章 + 陌生方程式第 1 章\n<\/li><li>\n要求：限时 40 分钟完成第 5 本的 21 道诊断题，记录错题与错因（产物、配平、拆写、电荷、符号）。\n<\/li><li>\n评分要点：① 正确率 ≥ 80%；② 错题能说出属于五步中的哪一步；③ 一周后重做错题全对。\n<\/ul>\n<h2>进阶路线<\/h2>\n<ol><li>\n<strong>偏考试<\/strong>：第 5 本诊断 → 普化第 5、6、8 章 → 无机第 2、4 章 → 限时套卷。\n<\/li><li>\n<strong>偏实验<\/strong>：零基础第 6 章 → 无机第 2、3、4 章 → 自己整理一份&quot;常见离子检验与现象&quot;表。\n<\/li><li>\n<strong>偏理论<\/strong>：普化第 4、10、11 章 → 有机第 3、4 章 → 读教材原书对应章节，做课后题。\n<\/ol>"};
const CROSS_META = [{"key": "doc1", "label": "化学知枢：从零基础到大学化学的一门课", "file": "README.md"}, {"key": "doc2", "label": "跨书概念映射表", "file": "跨书概念映射表.md"}, {"key": "doc3", "label": "综合检验建议", "file": "综合检验建议.md"}];
const TABS = [{"key": "cross", "label": "跨书总览"}, {"key": "zero-basis-chem", "label": "零基础入门：化学的第一套语言"}, {"key": "general-chem", "label": "普通化学原理：大学化学的主干"}, {"key": "inorganic-chem", "label": "简明无机化学：元素的性质地图"}, {"key": "organic-chem", "label": "基础有机化学：从碳骨架到手性"}, {"key": "equation-diagnosis", "label": "陌生方程式：诊断与训练"}];
const FIRST_DOC = "doc1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let cur = {book:'cross', doc:FIRST_DOC, page:'cross'};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
function stKey(book,k){ return 'hb:'+book+':'+k; }
function getState(book){
  return { visited: store.get(stKey(book,'visited'))||[], quiz: store.get(stKey(book,'quiz'))||{}, cards: store.get(stKey(book,'cards'))||{} };
}

/* ---------- 路由 ---------- */
function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page==='diagnosis') return '__diagnosis__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

/* ---------- 顶栏 ---------- */
function renderTabs(){
  const el = $('#tabs'); el.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(cur.book===t.key?' active':'');
    b.textContent=t.label;
    b.onclick=()=>{ location.hash = t.key==='cross' ? '#/cross/'+FIRST_DOC : '#/book/'+t.key+'/path'; };
    el.appendChild(b);
  });
}

/* ---------- 侧栏 ---------- */
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  const add=(label,href,cls)=>{
    const a=document.createElement('a'); a.className='nav-item'+(cls?' '+cls:''); a.href=href; a.textContent=label;
    nav.appendChild(a); return a;
  };
  const sec=t=>{ const d=document.createElement('div'); d.className='nav-sec'; d.textContent=t; nav.appendChild(d); };

  if(cur.book==='cross'){
    sec(CROSS_META.length>1 ? '跨书总览' : '总览');
    CROSS_META.forEach(c=> add(c.label, '#/cross/'+c.key, cur.doc===c.key?'active':''));
    sec('书籍入口');
    META.forEach(m=> add(m.title, '#/book/'+m.key+'/path'));
    updateProgress(0, CROSS_META.length>1 ? '跨书总览' : '总览');
    return;
  }
  const B=BOOKS[cur.book];
  const S=getState(cur.book);
  const man=B.manifest;
  add('学习路径','#/book/'+cur.book+'/path', cur.page==='path'?'active':'');
  add('🩺 诊断测试','#/book/'+cur.book+'/diagnosis', cur.page==='diagnosis'?'active':'');
  sec('章节');
  (man.chapters||[]).forEach(c=>{
    const id=c.id;
    const a=add(c.title, '#/book/'+cur.book+'/chapter/'+id, cur.page==='chapter/'+id?'active':'');
    if(S.visited.includes(cur.book+'/chapter/'+id)){
      const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
    }
  });
  if((man.concepts||[]).length){
    sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  sec('测验');
  add('全部测验','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    if(!((B.quizCoverage||{})[c.id])) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

/* ---------- 渲染 ---------- */
function renderCross(){

      + '<div class="book-cards">'

          <div class="meta">${m.chapters} 章 · ${m.concepts} 概念 · ${m.quizzes} 测验 · ${m.cards} 抽认卡</div>

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page==='diagnosis') initDiagnosis();

  if(pid==='__path__') updatePath();
  renderMermaid();
  renderMath();

/* ---------- 诊断测试（总入口版） ---------- */
let diagQueue=[], diagIdx=0, diagWrong=[];
function dq(id){ return (BOOKS[cur.book].manifest.concepts||[]).find(c=>c.id===id); }
function dch(id){ return (BOOKS[cur.book].manifest.chapters||[]).find(c=>c.id===id); }
function dprereqs(node){ return (node&&(node.prerequisites||node.prereqs))||[]; }
function dlink(kind,id){ return '#/book/'+cur.book+'/'+(kind==='concept'?'concept/':'chapter/')+id; }
function traceBack(startConceptId,startChapterId){
  const seen=new Set(), chain=[], q=[];
  if(startConceptId){ const c=dq(startConceptId); if(c) q.push({node:c,kind:'concept'}); }
  if(startChapterId){ const c=dch(startChapterId); if(c) q.push({node:c,kind:'chapter'}); }
  while(q.length && chain.length<6){
    const it=q.shift(); if(seen.has(it.node.id)) continue;
    seen.add(it.node.id); chain.push(it);
    dprereqs(it.node).forEach(pid=>{
      const c=dq(pid); if(c){ q.push({node:c,kind:'concept'}); return; }
      const h=dch(pid); if(h) q.push({node:h,kind:'chapter'});
    });
  }
  return chain;
}
function initDiagnosis(){
  const btn=$('#diag-start'); if(!btn||btn.dataset.inited) return;
  btn.dataset.inited='1';
  btn.addEventListener('click',()=>{
    const all=(BOOKS[cur.book].manifest.quizzes||[]).slice();
    for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue=all.slice(0,Math.min(5,all.length)); diagIdx=0; diagWrong=[];
    showDiagQuestion();
  });
}
function _diagQuizHTML(q,idx){
  const t=q.type||'single', qid=q.id||('diag'+idx);
  let h=`<div class='quiz-item' data-qid='${qid}' data-type='${t}'>`;
  h+=`<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||'')}</p>`;
  if(t==='single'||t==='multi'){
    const it=t==='single'?'radio':'checkbox'; h+="<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ h+=`<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    h+='</div>';
  } else h+=`<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  h+=`<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return h;
}
function showDiagQuestion(){
  const stage=$('#diag-stage'), result=$('#diag-result');
  if(!stage||!result) return;
  result.innerHTML='';
  if(diagIdx>=diagQueue.length){ finishDiagnosis(); return; }
  const q=diagQueue[diagIdx];
  $('#diag-progress').textContent=`第 ${diagIdx+1} / ${diagQueue.length} 题`;
  stage.innerHTML=_diagQuizHTML(q,diagIdx+1);
  const item=stage.querySelector('.quiz-item'), btn=item.querySelector('.quiz-check');
  btn.addEventListener('click',()=>{
    let correct=false;
    if(q.type==='single'){ const s=item.querySelector('input:checked'); correct=!!s&&parseInt(s.value)===q.answer; }
    else if(q.type==='multi'){
      const u=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const a=(Array.isArray(q.answer)?q.answer.slice():[q.answer]).sort();
      correct=u.length>0&&JSON.stringify(u)===JSON.stringify(a);
    } else { const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase(); correct=v===String(q.answer).trim().toLowerCase(); }
    if(!correct){
      diagWrong.push(q); const chain=traceBack(q.relatedConceptId,q.chapterId);
      if(chain.length>1){
        const links=chain.slice(1).map(({node,kind})=>`<div class="diag-remedy-item">建议先学：<a href="${dlink(kind,node.id)}">${esc(node.title||node.id)}</a></div>`).join('');
        result.innerHTML='<h3>这道题答错了，可能的根因：</h3>'+links+'<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else result.innerHTML='<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
    } else result.innerHTML='<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    $('#diag-next').addEventListener('click',()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function finishDiagnosis(){
  const total=diagQueue.length, wrong=diagWrong.length, right=total-wrong;
  let h=`<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong===0) h+='<p>这组题全对，可以继续往下学。</p>';
  else{
    h+=`<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen=new Set();
    diagWrong.forEach(q=>{ traceBack(q.relatedConceptId,q.chapterId).slice(1).forEach(({node,kind})=>{
      if(seen.has(node.id)) return; seen.add(node.id);
      h+=`<div class="diag-remedy-item">📚 <a href="${dlink(kind,node.id)}">${esc(node.title||node.id)}</a></div>`;
    }); });
  }
  h+='<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML=''; $('#diag-progress').textContent=''; $('#diag-result').innerHTML=h;
  $('#diag-restart').addEventListener('click',()=>$('#diag-start').click());
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length){ mermaidState='failed'; return; }
    const s=document.createElement('script');
    s.src=urls[ui++];
    let done=false;
    const next=()=>{ if(done) return; done=true; s.remove(); tryNext(); };
    const timer=setTimeout(()=>{ if(!window.mermaid) next(); },6000);
    s.onload=()=>{ done=true; clearTimeout(timer); mermaidState='loaded'; run(); };
    s.onerror=()=>{ clearTimeout(timer); next(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- KaTeX 公式渲染（多源回退） ---------- */
let katexLoading=false, katexReady=false;
function renderMath(){
  if(!document.querySelector('.katex-inline, .katex-block')) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading=true;
  const cssUrls=[
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls=[
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci=0, ji=0;
  const tryCss=()=>{
    if(ci>=cssUrls.length) return;
    const link=document.createElement('link');
    link.rel='stylesheet'; link.href=cssUrls[ci++];
    link.onload=tryJs; link.onerror=()=>{link.remove(); tryCss();};
    document.head.appendChild(link);
  };
  const tryJs=()=>{
    if(ji>=jsUrls.length){ katexLoading=false; return; }
    const s=document.createElement('script');
    s.src=jsUrls[ji++];
    s.onload=()=>{ katexReady=true; katexLoading=false; doRenderMath(); };
    s.onerror=()=>{ s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex==='undefined') return;
  document.querySelectorAll('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  document.querySelectorAll('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
route();
