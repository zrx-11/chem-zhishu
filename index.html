ionMisconceptions": []}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "F、Cl、Br 非金属性由强到弱是？", "options": ["F>Cl>Br", "Br>Cl>F", "Cl>F>Br", "F>Br>Cl"], "answer": 0, "explain": "同主族从上到下非金属性减弱。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "下列氢化物最稳定的是？", "options": ["HF", "HCl", "HBr", "HI"], "answer": 0, "explain": "F 的非金属性最强，H—F 键最稳定。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "氯气与氢氧化钠反应生成？", "options": ["NaCl 和 NaClO", "NaCl 和 NaClO3", "NaClO 和 O2", "NaCl 和 HClO4"], "answer": 0, "explain": "Cl2+2NaOH→NaCl+NaClO+H2O。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "钠与水反应的现象不包括？", "options": ["浮在水面", "熔成小球", "沉入水底", "四处游动"], "answer": 2, "explain": "钠密度比水小，浮在水面而不是沉底。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "Al 与 NaOH 溶液反应生成？", "options": ["Al(OH)3 和 H2", "NaAlO2 和 H2", "Al2O3 和 H2O", "AlCl3 和 H2"], "answer": 1, "explain": "2Al+2NaOH+2H2O→2NaAlO2+3H2↑。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "检验 Fe3+ 常用的试剂是？", "options": ["NaOH", "KSCN", "BaCl2", "AgNO3"], "answer": 1, "explain": "Fe3+ 与 SCN- 生成血红色配合物。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "Cu2+ 与过量氨水反应的现象是？", "options": ["生成白色沉淀", "生成蓝色沉淀后溶解变深蓝", "生成红褐色沉淀", "无现象"], "answer": 1, "explain": "先生成 Cu(OH)2 蓝色沉淀，继续加氨水生成深蓝色 [Cu(NH3)4]2+。", "relatedConceptId": "c01", "optionMisconceptions": []}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "元素周期律与无机化学地图：一句话核心是什么？", "back": "无机化学不是背反应，而是用构型决定性质、性质决定用途这条线，把几百种物质串起来。", "tags": ["ch01"]}, {"id": "f02", "chapterId": "ch01", "front": "元素周期律与无机化学地图最容易错在哪？", "back": "Al2O3 是两性氧化物，不是碱性氧化物。", "tags": ["ch01", "易错"]}, {"id": "f03", "chapterId": "ch02", "front": "非金属元素：一句话核心是什么？", "back": "非金属性越靠右上越强；同族向下，氢化物越不稳定、含氧酸越弱。", "tags": ["ch02"]}, {"id": "f04", "chapterId": "ch02", "front": "非金属元素最容易错在哪？", "back": "氯水不是 HCl 和 HClO 的简单混合物，是多组分平衡体系。", "tags": ["ch02", "易错"]}, {"id": "f05", "chapterId": "ch03", "front": "主族金属：一句话核心是什么？", "back": "主族金属越往下越活泼；铝是两性金属，既能与酸反应也能与强碱反应。", "tags": ["ch03"]}, {"id": "f06", "chapterId": "ch03", "front": "主族金属最容易错在哪？", "back": "Na2O2 是过氧化物，不是碱性氧化物。", "tags": ["ch03", "易错"]}, {"id": "f07", "chapterId": "ch04", "front": "过渡金属与配位化合物：一句话核心是什么？", "back": "过渡金属的特点是多价态、有色、易形成配合物，这三条决定它们的化学行为。", "tags": ["ch04"]}, {"id": "f08", "chapterId": "ch04", "front": "过渡金属与配位化合物最容易错在哪？", "back": "Zn2+ 无色，不是所有过渡金属离子都有颜色。", "tags": ["ch04", "易错"]}], "companion": "学习伴侣.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：《简明无机化学》化学原理部分<\/div><h1>第 1 章：元素周期律与无机化学地图<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1 小时 | <strong>前置<\/strong>：普化第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按周期表分区说出元素的大致性质；\n<\/li><li>\n用&quot;价电子构型&quot;判断元素属于主族、过渡金属还是 f 区；\n<\/li><li>\n建立无机化学的学习地图（结构—性质—制备—用途）。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>无机化学不是背反应，而是用&quot;构型决定性质、性质决定用途&quot;这条线，把几百种物质串起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：周期表的五个区（难度：基础）<\/h3>\n<ul><li>\n<strong>s 区<\/strong>：第 ⅠA、ⅡA 族，价电子构型 ns¹⁻²，活泼金属。\n<\/li><li>\n<strong>p 区<\/strong>：第 ⅢA–ⅦA 族及 0 族，价电子 ns²np¹⁻⁶，非金属与半金属集中在这里。\n<\/li><li>\n<strong>d 区<\/strong>：第 ⅢB–ⅧB 族（过渡金属），价电子 (n−1)d¹⁻¹⁰ns¹⁻²。\n<\/li><li>\n<strong>ds 区<\/strong>：第 ⅠB、ⅡB 族，价电子 (n−1)d¹⁰ns¹⁻²，Cu、Ag、Au、Zn、Cd、Hg。\n<\/li><li>\n<strong>f 区<\/strong>：镧系、锕系，价电子 (n−2)f¹⁻¹⁴。\n<\/ul>\n<p>记分区的好处是：同一区元素性质相似，反应类型也相似。<\/p>\n<h3>概念 2：周期性规律的四条主线（难度：进阶）<\/h3>\n<ol><li>\n<strong>原子半径<\/strong>：同周期右移减小，同主族下移增大。\n<\/li><li>\n<strong>电离能<\/strong>：同周期右移增大，同主族下移减小。注意 ⅡA 与 ⅢA、ⅤA 与 ⅥA 之间有反常（半充满、全充满更稳定）。\n<\/li><li>\n<strong>电负性<\/strong>：同周期右移增大，同主族下移减小。F 最大。\n<\/li><li>\n<strong>金属性/非金属性<\/strong>：同周期右移非金属性增强，同主族下移金属性增强。\n<\/ol>\n<h3>概念 3：无机物的四条性质线（难度：进阶）<\/h3>\n<p>学习一种元素，按四条线整理：<\/p>\n<ul><li>\n<strong>单质<\/strong>：颜色、状态、与酸/碱/水的反应。\n<\/li><li>\n<strong>氧化物<\/strong>：酸性/碱性/两性，与水反应生成什么酸或碱。\n<\/li><li>\n<strong>氢化物<\/strong>：稳定性、酸碱性、还原性。\n<\/li><li>\n<strong>含氧酸及其盐<\/strong>：酸性强弱、氧化性、热稳定性、溶解性。\n<\/ul>\n<p>比如学硫：单质黄色固体，燃烧生成 SO₂；SO₂ 是酸性氧化物，溶于水生成 H₂SO₃；SO₃ 溶于水生成 H₂SO₄；H₂SO₄ 是强酸，浓硫酸有强氧化性和吸水性。<\/p>\n<h3>概念 4：无机反应的四种类型（难度：基础）<\/h3>\n<ul><li>\n单质 + 单质 → 化合物（化合）\n<\/li><li>\n化合物 → 单质 + 化合物（分解、置换）\n<\/li><li>\n氧化物 + 水 → 酸/碱\n<\/li><li>\n酸 + 碱 → 盐 + 水；盐 + 盐 → 新盐 + 新盐\n<\/ul>\n<p>绝大多数无机反应可以归入这四类，剩下的是氧化还原和配位反应。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[元素] --&gt; B[价电子构型]\n  B --&gt; C[s区 活泼金属]\n  B --&gt; D[p区 非金属]\n  B --&gt; E[d区 过渡金属]\n  B --&gt; F[ds区 贵金属/锌镉汞]\n  C --&gt; G[氧化物 氢氧化物 盐]\n  D --&gt; H[氢化物 含氧酸 盐]\n  E --&gt; H\n  E --&gt; I[配合物 多价态]\n  F --&gt; I<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：构型决定分区，分区决定主要化合物类型。这张图是后面三章的地图。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：周期表像一座城市的分区地图。s 区是&quot;金属工业区&quot;，p 区是&quot;非金属生活区&quot;，d 区是&quot;多价态商业区&quot;。这个类比在&quot;分区边界元素性质模糊&quot;处失效，比如硼、硅既有金属性又有非金属性。<\/p>\n<p>实例：比较 Na、Mg、Al 的金属性。同周期从左到右，核电荷增大、半径减小，失电子变难，金属性减弱：Na &gt; Mg &gt; Al。对应最高价氢氧化物碱性：NaOH &gt; Mg(OH)₂ &gt; Al(OH)₃（Al(OH)₃ 两性）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;d 区元素都是+2 价&quot;——过渡金属有多种价态，如 Fe 有 +2、+3，Mn 有 +2 到 +7。\n<\/li><li>\n别以为&quot;同周期电离能一定单调增大&quot;——ⅡA 到 ⅢA、ⅤA 到 ⅥA 有回落。\n<\/li><li>\n别以为&quot;金属氧化物都是碱性氧化物&quot;——Al₂O₃、ZnO 是两性氧化物。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列元素属于 p 区的是（ ）。A. Na B. Fe C. S D. Ag\n<p>（答案：C；解析：S 的价电子构型 3s²3p⁴，属 p 区。）<\/p>\n<\/ol>\n<ol><li>\n比较 F、Cl、Br 的非金属性强弱。\n<p>（答案：F &gt; Cl &gt; Br；解析：同主族从上到下非金属性减弱。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;Al₂O₃ 既能与酸反应又能与碱反应，所以它是碱性氧化物。&quot;\n<p>（答案：不对。它是两性氧化物。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五个区按价电子构型分。\n<\/li><li>\n四条周期性主线：半径、电离能、电负性、金属性。\n<\/li><li>\n学元素按单质、氧化物、氢化物、含氧酸四条线走。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：《简明无机化学》元素化学·非金属<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inorganic-chem/chapter/ch01\">第 1 章：元素周期律与无机化学地图<\/a><\/span><\/div><h1>第 2 章：非金属元素<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 1 章、普化第 8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出卤素、氧、硫、氮、磷、碳、硅的主要反应；\n<\/li><li>\n比较非金属性强弱和氢化物稳定性；\n<\/li><li>\n解释含氧酸酸性强弱的变化规律；\n<\/li><li>\n记住几个工业制备反应。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>非金属元素的性质随位置变化：越靠右上，非金属性越强；同族向下，氢化物越不稳定、含氧酸越弱。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：卤素（难度：进阶）<\/h3>\n<p>卤素 ⅦA：F₂、Cl₂、Br₂、I₂。颜色由浅黄绿到紫黑，氧化性 F₂ &gt; Cl₂ &gt; Br₂ &gt; I₂。<\/p>\n<p>关键反应：<\/p>\n<ul><li>\nCl₂ + 2NaOH → NaCl + NaClO + H₂O（制漂白液）\n<\/li><li>\nCl₂ + 2KI → 2KCl + I₂（置换，证明氧化性 Cl₂ &gt; I₂）\n<\/li><li>\nCl₂ + H₂O ⇌ HCl + HClO（氯水成分，HClO 有漂白性）\n<\/li><li>\n2Cl₂ + 2Ca(OH)₂ → Ca(ClO)₂ + CaCl₂ + 2H₂O（制漂白粉）\n<\/ul>\n<p>氢化物稳定性：HF &gt; HCl &gt; HBr &gt; HI。氢卤酸酸性：HF 弱酸，HCl、HBr、HI 强酸，且酸性 HF &lt; HCl &lt; HBr &lt; HI。<\/p>\n<h3>概念 2：氧与硫（难度：进阶）<\/h3>\n<p>氧：O₂、O₃（同素异形体）。O₃ 有强氧化性，可消毒。 硫：黄色固体，燃烧发蓝紫色火焰：S + O₂ → SO₂。<\/p>\n<p>硫的化合物：<\/p>\n<ul><li>\nSO₂ 是酸性氧化物，溶于水生成 H₂SO₃（弱酸，中强还原性）。\n<\/li><li>\nSO₃ 溶于水生成 H₂SO₄。\n<\/li><li>\n2SO₂ + O₂ ⇌(催化剂, △) 2SO₃（工业制硫酸的核心步骤）。\n<\/li><li>\n浓硫酸有吸水性、脱水性、强氧化性。Cu + 2H₂SO₄(浓) → CuSO₄ + SO₂↑ + 2H₂O。\n<\/ul>\n<h3>概念 3：氮与磷（难度：进阶）<\/h3>\n<p>氮气 N₂ 极稳定，因为 N≡N 键能很大（941 kJ/mol）。固氮三条路：高能固氮（闪电）、生物固氮（根瘤菌）、工业合成氨。<\/p>\n<ul><li>\nN₂ + 3H₂ ⇌(高温高压催化剂) 2NH₃\n<\/li><li>\nNH₃ 是碱性气体，与水形成 NH₃·H₂O，能使湿润红色石蕊试纸变蓝。\n<\/li><li>\nNH₃ + HCl → NH₄Cl（白烟）\n<\/li><li>\n4NH₃ + 5O₂ →(Pt, △) 4NO + 6H₂O（催化氧化，工业制硝酸第一步）\n<\/li><li>\n2NO + O₂ → 2NO₂（红棕色）\n<\/li><li>\n3NO₂ + H₂O → 2HNO₃ + NO（工业制硝酸）\n<\/ul>\n<p>磷：白磷（P₄，剧毒，易自燃）、红磷（稳定）。P₄ + 5O₂ →(点燃) P₂O₅，P₂O₅ 吸水性强，是干燥剂。<\/p>\n<h3>概念 4：碳与硅（难度：进阶）<\/h3>\n<p>碳：金刚石（共价晶体，硬）、石墨（层状，导电）、C₆₀。CO 有还原性和毒性，CO₂ 是酸性氧化物。<\/p>\n<ul><li>\nC + O₂ →(点燃) CO₂\n<\/li><li>\nCO₂ + C →(高温) 2CO（工业制 CO）\n<\/li><li>\nCO + CuO →(△) Cu + CO₂（炼铜）\n<\/ul>\n<p>硅：SiO₂ 是共价晶体，与 NaOH 反应：SiO₂ + 2NaOH → Na₂SiO₃ + H₂O（所以不能用玻璃瓶长期装 NaOH）。工业制粗硅：SiO₂ + 2C →(高温) Si + 2CO↑。<\/p>\n<h3>概念 5：含氧酸酸性规律（难度：高难）<\/h3>\n<p>同一元素不同价态：价态越高，酸性越强。H₂SO₃ &lt; H₂SO₄，HNO₂ &lt; HNO₃。 同一主族从上到下：酸性减弱。HNO₃ &gt; H₃PO₄，H₂SO₄ &gt; H₂SeO₄ 的反例要单独记（实际 H₂SO₄ 与 H₂SeO₄ 接近，H₂SO₄ 略强）。<\/p>\n<p>Pauling 规则：含氧酸 <span class=\"katex-inline\">H_nXO_m<\/span> 的酸性随 m 增大而增强。m = 1 弱酸，m = 2 中强，m = 3 强酸。HClO（m=1）弱，HClO₂（m=2）中强，HClO₃、HClO₄（m=3、4）强。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[非金属元素] --&gt; B[卤素 F Cl Br I]\n  A --&gt; C[氧族 O S]\n  A --&gt; D[氮族 N P]\n  A --&gt; E[碳族 C Si]\n  B --&gt; F[氧化性 卤素单质]\n  C --&gt; G[SO2 SO3 H2SO4]\n  D --&gt; H[NH3 HNO3]\n  E --&gt; I[CO2 SiO2]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：按族分块记，每块抓住&quot;单质—氧化物—含氧酸&quot;这条链。跨族比较看非金属性和价态。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：非金属元素像一支球队，位置越靠右上（F、O），进攻性（氧化性）越强；越往下（I、Se），越&quot;温和&quot;。这个类比在&quot;氮气特别稳定&quot;处失效，因为 N≡N 键能异常大，不按族规律走。<\/p>\n<p>实例：为什么浓硫酸能干燥 SO₂ 却不能干燥 NH₃？浓硫酸有酸性，NH₃ 是碱性气体，两者反应生成 (NH₄)₂SO₄；SO₂ 是酸性氧化物，不与浓硫酸反应，所以可以干燥。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;氯水就是 HCl 和 HClO 的混合物&quot;——氯水是 Cl₂、H₂O、HCl、HClO 多组分平衡体系。\n<\/li><li>\n别以为&quot;浓硫酸只体现酸性&quot;——浓硫酸还有强氧化性、吸水性、脱水性。\n<\/li><li>\n别以为&quot;SiO₂ 和 CO₂ 都是酸性氧化物，性质相同&quot;——SiO₂ 是共价晶体，不溶于水，CO₂ 是分子晶体，溶于水。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列氢化物最稳定的是（ ）。A. HF B. HCl C. HBr D. HI\n<p>（答案：A；解析：F 的非金属性最强，H—F 键最稳定。）<\/p>\n<\/ol>\n<ol><li>\n写出氯气与氢氧化钠反应的化学方程式。\n<p>（答案：Cl₂ + 2NaOH → NaCl + NaClO + H₂O。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;酸性 HClO₄ &gt; HClO₃ &gt; HClO₂ &gt; HClO。&quot;\n<p>（答案：对。含氧酸中氧原子数越多，酸性越强。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n卤素：氧化性 F₂ &gt; Cl₂ &gt; Br₂ &gt; I₂，氢化物稳定性反之。\n<\/li><li>\n硫：SO₂ 还原性、SO₃ 制硫酸、浓硫酸三性。\n<\/li><li>\n氮：合成氨、氨的催化氧化、硝酸制备。\n<\/li><li>\n含氧酸酸性随中心元素价态升高而增强。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：《简明无机化学》元素化学·主族金属<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inorganic-chem/chapter/ch01\">第 1 章：元素周期律与无机化学地图<\/a><\/span><\/div><h1>第 3 章：主族金属<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出钠、镁、铝与水或酸反应的现象和方程式；\n<\/li><li>\n比较碱金属、碱土金属的活泼性；\n<\/li><li>\n说明铝的两性；\n<\/li><li>\n解释 Na₂O₂ 的特殊性质。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>主族金属越往下越活泼；铝是&quot;两性金属&quot;，既能与酸反应，也能与强碱反应。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：碱金属（难度：基础）<\/h3>\n<p>第 ⅠA 族：Li、Na、K、Rb、Cs。最外层 1 个电子，极易失电子，活泼性从上到下增强。<\/p>\n<ul><li>\n2Na + 2H₂O → 2NaOH + H₂↑（浮、熔、游、响、红）\n<\/li><li>\n2Na + O₂ →(点燃) Na₂O₂（过氧化钠，淡黄色）\n<\/li><li>\n2Na₂O₂ + 2H₂O → 4NaOH + O₂↑\n<\/li><li>\n2Na₂O₂ + 2CO₂ → 2Na₂CO₃ + O₂\n<\/ul>\n<p>Na₂O₂ 中 O 为 −1 价，既有氧化性又有还原性，常作供氧剂（潜水艇、呼吸面具）。Na₂O 是白色固体，碱性氧化物；Na₂O₂ 是过氧化物，不是碱性氧化物。<\/p>\n<h3>概念 2：碱土金属（难度：基础）<\/h3>\n<p>第 ⅡA 族：Be、Mg、Ca、Sr、Ba。最外层 2 个电子，活泼性次于碱金属，从上到下增强。<\/p>\n<ul><li>\nMg + 2H₂O →(△) Mg(OH)₂ + H₂↑（热水才反应）\n<\/li><li>\nMg + 2HCl → MgCl₂ + H₂↑\n<\/li><li>\n2Mg + O₂ →(点燃) 2MgO（耀眼白光）\n<\/li><li>\nCa + 2H₂O → Ca(OH)₂ + H₂↑\n<\/ul>\n<p>MgO 是碱性氧化物，熔点高，作耐火材料。Ca(OH)₂ 微溶，澄清水溶液叫石灰水，通 CO₂ 变浑浊：Ca(OH)₂ + CO₂ → CaCO₃↓ + H₂O。<\/p>\n<h3>概念 3：铝的两性（难度：进阶）<\/h3>\n<p>Al 是第 ⅢA 族，表面易形成致密氧化膜，耐腐蚀。<\/p>\n<ul><li>\n2Al + 6HCl → 2AlCl₃ + 3H₂↑\n<\/li><li>\n2Al + 2NaOH + 2H₂O → 2NaAlO₂ + 3H₂↑（偏铝酸钠）\n<\/li><li>\nAl₂O₃ + 6HCl → 2AlCl₃ + 3H₂O\n<\/li><li>\nAl₂O₃ + 2NaOH → 2NaAlO₂ + H₂O\n<\/li><li>\nAl(OH)₃ + 3HCl → AlCl₃ + 3H₂O\n<\/li><li>\nAl(OH)₃ + NaOH → NaAlO₂ + 2H₂O\n<\/ul>\n<p>铝热反应：2Al + Fe₂O₃ →(高温) Al₂O₃ + 2Fe，用于焊接钢轨、冶炼难熔金属。<\/p>\n<h3>概念 4：锡与铅（难度：进阶）<\/h3>\n<p>Sn、Pb 是第 ⅣA 族金属。Sn 有 +2、+4 价，Pb 以 +2 价稳定（惰性电子对效应：6s² 不易失去）。<\/p>\n<ul><li>\nSn + 2HCl → SnCl₂ + H₂↑\n<\/li><li>\nPb + 2HCl → PbCl₂↓ + H₂↑（PbCl₂ 难溶，反应很快停止）\n<\/ul>\n<p>惰性电子对效应：同族向下，ns² 电子对越来越难参与成键，所以 Tl、Pb、Bi 的低价态更稳定。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[主族金属] --&gt; B[IA 碱金属]\n  A --&gt; C[IIA 碱土金属]\n  A --&gt; D[IIIA 铝]\n  B --&gt; E[与水反应 越来越剧烈]\n  C --&gt; F[与热水/酸反应]\n  D --&gt; G[两性 酸和碱都反应]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：活泼性从上到下增强，铝特殊在两性。记反应时先看金属位置，再看条件。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：碱金属像&quot;急着交作业的学生&quot;，最外层 1 个电子随时准备交出去；碱土金属有 2 个，稍犹豫；铝交了 3 个之后，剩下的核心很稳定，所以既能让酸拿走，也能让碱&quot;溶解&quot;它。这个类比在&quot;铝表面氧化膜保护&quot;这一点上要补一句：铝其实很活泼，只是被膜保护了。<\/p>\n<p>实例：为什么不能用铝锅煮碱性食物？Al₂O₃ 和 Al 都能与 NaOH 反应，保护膜被破坏，铝会继续溶解，既损坏锅又使食物含铝。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;Na₂O₂ 是碱性氧化物&quot;——它是过氧化物，与水反应生成 NaOH 和 O₂，不是简单的碱性氧化物。\n<\/li><li>\n别以为&quot;铝不活泼&quot;——铝的活泼性接近镁，只是表面氧化膜让它耐腐蚀。\n<\/li><li>\n别以为&quot;镁不与冷水反应，所以镁不活泼&quot;——镁与热水、酸反应都很剧烈。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n钠与水反应的现象不包括（ ）。A. 浮在水面 B. 熔成小球 C. 沉入水底 D. 四处游动\n<p>（答案：C；解析：钠密度比水小，浮在水面。）<\/p>\n<\/ol>\n<ol><li>\n写出 Al 与 NaOH 溶液反应的化学方程式。\n<p>（答案：2Al + 2NaOH + 2H₂O → 2NaAlO₂ + 3H₂↑。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;Na₂O 和 Na₂O₂ 都是碱性氧化物。&quot;\n<p>（答案：不对。Na₂O 是碱性氧化物，Na₂O₂ 是过氧化物。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n碱金属最活泼，与水反应&quot;浮熔游响红&quot;。\n<\/li><li>\nNa₂O₂ 中 O 为 −1，可作供氧剂。\n<\/li><li>\n铝两性：与酸、强碱都反应；铝热反应放大量热。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：《简明无机化学》元素化学·过渡金属 + 配位化学基础<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inorganic-chem/chapter/ch01\">第 1 章：元素周期律与无机化学地图<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/inorganic-chem/chapter/ch03\">第 3 章：主族金属<\/a><\/span><\/div><h1>第 4 章：过渡金属与配位化合物<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 1 章、普化第 12 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出铬、锰、铁、铜、银、锌的主要价态和颜色；\n<\/li><li>\n写出 Fe²⁺/Fe³⁺ 的相互转化；\n<\/li><li>\n解释 Cu²⁺ 与氨水形成配合物的现象；\n<\/li><li>\n记住常见离子的检验方法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>过渡金属的特点是&quot;多价态 + 有色 + 易形成配合物&quot;，这三条决定了它们的化学行为。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：铬与锰（难度：进阶）<\/h3>\n<p>铬：常见 +3、+6。Cr³⁺ 绿色，Cr₂O₇²⁻ 橙色，CrO₄²⁻ 黄色。<\/p>\n<ul><li>\nCr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O（酸性条件，强氧化性）\n<\/li><li>\n2CrO₄²⁻ + 2H⁺ ⇌ Cr₂O₇²⁻ + H₂O（加酸变橙，加碱变黄）\n<\/ul>\n<p>锰：常见 +2、+4、+7。Mn²⁺ 浅粉色，MnO₂ 黑色，MnO₄⁻ 紫色。<\/p>\n<ul><li>\n2MnO₄⁻ + 5H₂O₂ + 6H⁺ → 2Mn²⁺ + 5O₂↑ + 8H₂O（高锰酸钾滴定双氧水）\n<\/li><li>\nMnO₂ + 4HCl(浓) → MnCl₂ + Cl₂↑ + 2H₂O（实验室制氯气）\n<\/ul>\n<h3>概念 2：铁（难度：进阶）<\/h3>\n<p>铁：+2、+3。Fe²⁺ 浅绿色，Fe³⁺ 黄色。<\/p>\n<ul><li>\n2Fe³⁺ + Fe → 3Fe²⁺（三价铁被铁还原）\n<\/li><li>\n2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻（二价铁被氯气氧化）\n<\/li><li>\nFe³⁺ + 3SCN⁻ → Fe(SCN)₃（血红色，检验 Fe³⁺）\n<\/li><li>\nFe²⁺ + 2OH⁻ → Fe(OH)₂↓（白色，迅速变灰绿，最终红褐）\n<\/li><li>\nFe³⁺ + 3OH⁻ → Fe(OH)₃↓（红褐色）\n<\/ul>\n<p>检验 Fe³⁺ 用 KSCN，现象血红色；检验 Fe²⁺ 先加 KSCN 不变色，再加氯水变红。<\/p>\n<h3>概念 3：铜与银（难度：进阶）<\/h3>\n<p>铜：+1、+2。Cu²⁺ 蓝色，Cu(OH)₂ 蓝色沉淀，CuSO₄·5H₂O 蓝色晶体。<\/p>\n<ul><li>\nCu + 2H₂SO₄(浓) → CuSO₄ + SO₂↑ + 2H₂O\n<\/li><li>\n2Cu + O₂ + CO₂ + H₂O → Cu₂(OH)₂CO₃（铜绿）\n<\/li><li>\nCu²⁺ + 4NH₃ → [Cu(NH₃)₄]²⁺（深蓝色，检验 Cu²⁺）\n<\/ul>\n<p>银：+1。AgCl 白色、AgBr 淡黄、AgI 黄色，溶解度依次减小，可用来检验卤素离子。<\/p>\n<ul><li>\nAg⁺ + Cl⁻ → AgCl↓\n<\/li><li>\nAgCl + 2NH₃ → [Ag(NH₃)₂]⁺ + Cl⁻（银氨溶液）\n<\/ul>\n<h3>概念 4：锌与配合物（难度：进阶）<\/h3>\n<p>锌：+2。Zn²⁺ 无色，ZnO、Zn(OH)₂ 两性。<\/p>\n<ul><li>\nZn + 2HCl → ZnCl₂ + H₂↑\n<\/li><li>\nZn(OH)₂ + 2NaOH → Na₂[Zn(OH)₄]（四羟基合锌酸钠）\n<\/ul>\n<p>配合物的应用：检验离子（Cu²⁺、Fe³⁺）、湿法冶金（氰化法提金）、配位滴定（EDTA 滴定 Ca²⁺、Mg²⁺、Ni²⁺）、生物体内（血红素是 Fe 配合物、叶绿素是 Mg 配合物）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[过渡金属] --&gt; B[多价态]\n  A --&gt; C[有色离子]\n  A --&gt; D[易形成配合物]\n  B --&gt; E[氧化还原反应]\n  C --&gt; F[比色/检验]\n  D --&gt; G[配位滴定/冶金]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条特点对应三类应用。看到过渡金属，先想它有哪些价态，再想颜色和配合物。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：过渡金属像&quot;会变装的人&quot;，同一元素换不同价态就换一套颜色和性质。这个类比在&quot;颜色由 d 电子跃迁产生&quot;这一点上要补一句：颜色不是染料，是电子吸收可见光后跃迁造成的。<\/p>\n<p>实例：为什么 Fe(OH)₂ 沉淀颜色会变？Fe(OH)₂ 白色，被空气氧化：4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃，颜色由白→灰绿→红褐。所以实验中要滴加苯隔绝空气，才能看到白色。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;所有过渡金属离子都有颜色&quot;——Zn²⁺、Sc³⁺、Ti⁴⁺ 无色，因为 d 轨道全空或全满。\n<\/li><li>\n别以为&quot;Fe³⁺ 与 KSCN 反应生成沉淀&quot;——生成的是血红色配合物，不是沉淀。\n<\/li><li>\n别以为&quot;铜只能被浓硫酸氧化&quot;——铜也能被稀硝酸氧化：3Cu + 8HNO₃(稀) → 3Cu(NO₃)₂ + 2NO↑ + 4H₂O。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n检验 Fe³⁺ 常用的试剂是（ ）。A. NaOH B. KSCN C. BaCl₂ D. AgNO₃\n<p>（答案：B；解析：Fe³⁺ 与 SCN⁻ 生成血红色配合物。）<\/p>\n<\/ol>\n<ol><li>\nCu²⁺ 与过量氨水反应的现象是（ ）。\n<p>（答案：先产生蓝色沉淀，继续加氨水沉淀溶解，溶液变深蓝色；解析：生成 [Cu(NH₃)₄]²⁺。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;Fe²⁺ 与 KSCN 直接反应显血红色。&quot;\n<p>（答案：不对。Fe²⁺ 与 KSCN 不显红色，需先氧化为 Fe³⁺。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n铬：Cr³⁺ 绿、Cr₂O₇²⁻ 橙；锰：MnO₄⁻ 紫。\n<\/li><li>\n铁：Fe²⁺ 浅绿、Fe³⁺ 黄，KSCN 检验 Fe³⁺。\n<\/li><li>\n铜：Cu²⁺ 蓝，遇过量氨水生成深蓝色配合物。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：《简明无机化学》配位化学基础<\/div><h1>配合物与配位键<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：普化第 12 章、无机第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>配合物是由中心离子（或原子）与配体通过配位键结合成的配离子，再与外界离子组成的化合物。<\/p>\n<h2>为什么重要<\/h2>\n<p>它解释了为什么 AgCl 能溶于氨水、为什么 Cu²⁺ 遇过量氨水变深蓝、为什么血红蛋白能运氧。配合物也是配位滴定、湿法冶金、催化剂的基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[配合物] --&gt; B[内界 配离子]\n  A --&gt; C[外界 离子]\n  B --&gt; D[中心离子]\n  B --&gt; E[配体]\n  E --&gt; F[配位原子]\n  D --&gt; G[配位数]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>以 [Cu(NH₃)₄]SO₄ 为例：中心离子 Cu²⁺，配体 NH₃，配位数 4，内界 [Cu(NH₃)₄]²⁺，外界 SO₄²⁻。<\/p>\n<p>配位键的形成：配体提供孤对电子，中心离子提供空轨道。NH₃ 的 N 有一对孤对，Cu²⁺ 有空的 d 轨道，二者形成配位键。<\/p>\n<p>命名顺序：阴离子在前、阳离子在后；配体数用一、二、三；配体名后加&quot;合&quot;；中心离子用罗马数字标氧化数。K₃[Fe(CN)₆] 叫六氰合铁(Ⅲ)酸钾。<\/p>\n<p>稳定常数 K稳 衡量配合物稳定性，K稳 越大越稳定。配合物在溶液中存在解离平衡，加酸、加沉淀剂可能破坏配合物。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;配位数等于配体个数&quot;——多齿配体一个分子可占多个配位位点。\n<\/li><li>\n别以为&quot;配合物一定溶于水&quot;——有些难溶，如某些金属配合物沉淀。\n<\/li><li>\n别以为&quot;配位键是特殊的共价键&quot;——它本质是共价键的一种，电子对由一方提供。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>普化第 12 章<\/td><td>配合物组成<\/td><td>内界、外界、配位数<\/td><\/tr><tr><td>无机第 4 章<\/td><td>Cu²⁺、Ag⁺<\/td><td>深蓝色、银氨溶液<\/td><\/tr><tr><td>无机第 4 章<\/td><td>生物配合物<\/td><td>血红素、叶绿素<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：共价键、过渡金属\n<\/li><li>\n后续：配位滴定、晶体场\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先拿地图<\/strong><br>阅读：<a href=\"#/book/inorganic-chem/chapter/ch01\">第 1 章：元素周期律与无机化学地图<\/a><br>检查点：能说出五个分区和四条周期性主线<\/li><li class='path-step' id='path-02'><strong>步骤 02：非金属<\/strong><br>阅读：<a href=\"#/book/inorganic-chem/chapter/ch02\">第 2 章：非金属元素<\/a><br>检查点：能写卤素、硫、氮、硅的关键反应<\/li><li class='path-step' id='path-03'><strong>步骤 03：主族金属<\/strong><br>阅读：<a href=\"#/book/inorganic-chem/chapter/ch03\">第 3 章：主族金属<\/a><br>检查点：能写钠、镁、铝的反应并解释两性<\/li><li class='path-step' id='path-04'><strong>步骤 04：过渡金属与配合物<\/strong><br>阅读：<a href=\"#/book/inorganic-chem/chapter/ch04\">第 4 章：过渡金属与配位化合物<\/a><br>检查点：能写 Fe2+/Fe3+ 转化、Cu2+ 配合、命名配合物<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：元素周期律与无机化学地图<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 下列元素属于 p 区的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> Na<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> Fe<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> S<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> Ag<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> F、Cl、Br 非金属性由强到弱是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> F&gt;Cl&gt;Br<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> Br&gt;Cl&gt;F<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> Cl&gt;F&gt;Br<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> F&gt;Br&gt;Cl<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：非金属元素<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 下列氢化物最稳定的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> HF<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> HCl<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> HBr<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> HI<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single' data-concept='' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 氯气与氢氧化钠反应生成？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> NaCl 和 NaClO<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> NaCl 和 NaClO3<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> NaClO 和 O2<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> NaCl 和 HClO4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：主族金属<\/h2><div class='quiz-item' data-qid='ch03-q05' data-type='sin  class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q06' data-type='single' data-concept='' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> Al 与 NaOH 溶液反应生成？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q06' value='0'> Al(OH)3 和 H2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='1'> NaAlO2 和 H2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='2'> Al2O3 和 H2O<\/label><label class='quiz-opt'><input type='radio' name='ch03-q06' value='3'> AlCl3 和 H2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：过渡金属与配位化合物<\/h1><div class='quiz-item' data-qid='ch04-q07' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 检验 Fe3+ 常用的试剂是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q07' value='0'> NaOH<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='1'> KSCN<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='2'> BaCl2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q07' value='3'> AgNO3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q08' data-type='single' data-concept='c01' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> Cu2+ 与过量氨水反应的现象是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> 生成白色沉淀<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> 生成蓝色沉淀后溶解变深蓝<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> 生成红褐色沉淀<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> 无现象<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='两性氧化物'>两性氧化物 — 既能与酸反应又能与碱反应生成盐和水的氧化物 <span class=glossary-ref>（第 1 章：元素周期律与无机化学地图）<\/span><\/li><li data-term='惰性电子对效应'>惰性电子对效应 — 同族向下 ns2 电子对越来越难参与成键的现象 <span class=glossary-ref>（第 3 章：主族金属）<\/span><\/li><li data-term='配位键'>配位键 — 配体提供孤对电子、中心离子提供空轨道形成的共价键 <span class=glossary-ref>（第 4 章：过渡金属与配位化合物）<\/span><\/li><li data-term='配位数'>配位数 — 中心离子周围配位原子的数目 <span class=glossary-ref>（第 4 章：过渡金属与配位化合物）<\/span><\/li><li data-term='稳定常数'>稳定常数 — 配合物生成反应的平衡常数，越大越稳定 <span class=glossary-ref>（第 4 章：过渡金属与配位化合物）<\/span><\/li><li data-term='铝热反应'>铝热反应 — 铝与金属氧化物在高温下反应，放出大量热并还原出金属 <span class=glossary-ref>（第 3 章：主族金属）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：元素学习四条线<\/h2>\n<p>单质（颜色、状态、与酸碱水的反应）→ 氧化物（酸碱性、与水反应）→ 氢化物（稳定性、还原性）→ 含氧酸及盐（酸性、氧化性、溶解性）。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n比较非金属性：看氢化物稳定性、最高价含氧酸酸性。\n<\/li><li>\n比较金属性：看单质与水/酸反应剧烈程度、最高价氢氧化物碱性。\n<\/li><li>\n判断两性：氧化物或氢氧化物既能与强酸反应又能与强碱反应，如 Al2O3、Al(OH)3、ZnO。\n<\/li><li>\n配合物命名：配体数 + 配体名 + 合 + 中心离子（氧化数）。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n把 Na2O2 当碱性氧化物。它是过氧化物，O 为 -1。\n<\/li><li>\n认为过渡金属离子都有颜色。Zn2+、Sc3+ 无色。\n<\/li><li>\n认为铝不活泼。铝表面有致密氧化膜，内部很活泼。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>常见反应<\/h2>\n<table><thead><tr><th>反应<\/th><th>方程式<\/th><\/tr><\/thead><tbody><tr><td>氯气与碱<\/td><td>Cl2 + 2NaOH → NaCl + NaClO + H2O<\/td><\/tr><tr><td>钠与水<\/td><td>2Na + 2H2O → 2NaOH + H2↑<\/td><\/tr><tr><td>过氧化钠<\/td><td>2Na2O2 + 2H2O → 4NaOH + O2↑<\/td><\/tr><tr><td>铝与碱<\/td><td>2Al + 2NaOH + 2H2O → 2NaAlO2 + 3H2↑<\/td><\/tr><tr><td>铝热<\/td><td>2Al + Fe2O3 → Al2O3 + 2Fe<\/td><\/tr><tr><td>合成氨<\/td><td>N2 + 3H2 ⇌ 2NH3<\/td><\/tr><tr><td>氨催化氧化<\/td><td>4NH3 + 5O2 → 4NO + 6H2O<\/td><\/tr><\/tbody><\/table>\n<h2>离子颜色<\/h2>\n<table><thead><tr><th>离子<\/th><th>颜色<\/th><\/tr><\/thead><tbody><tr><td>Fe2+<\/td><td>浅绿<\/td><\/tr><tr><td>Fe3+<\/td><td>黄<\/td><\/tr><tr><td>Cu2+<\/td><td>蓝<\/td><\/tr><tr><td>Mn2+<\/td><td>浅粉<\/td><\/tr><tr><td>MnO4-<\/td><td>紫<\/td><\/tr><tr><td>Cr2O7^2-<\/td><td>橙<\/td><\/tr><tr><td>CrO4^2-<\/td><td>黄<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：元素周期律与无机化学地图", "href": "#/chapter/ch01"}, {"label": "第 2 章：非金属元素", "href": "#/chapter/ch02"}, {"label": "第 3 章：主族金属", "href": "#/chapter/ch03"}, {"label": "第 4 章：过渡金属与配位化合物", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "配合物与配位键", "href": "#/concept/c01"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：元素周期律与无机化学地图", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：非金属元素", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：主族金属", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：过渡金属与配位化合物", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"lab  "chapterId": "ch04"}, {"term": "手性碳", "def": "连有四个不同基团的碳原子", "chapterId": "ch04"}, {"term": "对映异构体", "def": "互为镜像、不能重合的一对立体异构体", "chapterId": "ch04"}, {"term": "外消旋体", "def": "等量对映异构体的混合物，旋光相互抵消", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "下列属于官能团的是？", "options": ["—CH3", "—OH", "—C2H5", "苯环"], "answer": 1, "explain": "羟基是官能团；甲基、乙基是取代基。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "C4H10 的同分异构体有几种？", "options": ["1", "2", "3", "4"], "answer": 1, "explain": "正丁烷和异丁烷两种。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "甲烷的空间构型是？", "options": ["平面正方形", "正四面体", "三角锥", "直线形"], "answer": 1, "explain": "sp3 杂化，四个键指向四面体顶点。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "乙烷最稳定的构象是？", "options": ["交叉式", "重叠式", "半重叠式", "平面式"], "answer": 0, "explain": "交叉式氢与氢错开，排斥最小。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "丙烯与 HBr 加成的主要产物是？", "options": ["1-溴丙烷", "2-溴丙烷", "1,2-二溴丙烷", "丙醇"], "answer": 1, "explain": "马氏规则，H 加在含氢多的碳上。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "下列能发生顺反异构的是？", "options": ["CH2=CH2", "CH2=CHCH3", "CH3CH=CHCH3", "CH2=C(CH3)2"], "answer": 2, "explain": "两个双键碳各连两个不同基团。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "苯的硝化反应条件是？", "options": ["浓硝酸、浓硫酸、加热", "稀硝酸、常温", "氯气、光照", "氢氧化钠、加热"], "answer": 0, "explain": "混酸硝化，浓硫酸作催化剂和脱水剂。", "relatedConceptId": "", "optionMisconceptions": []}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "下列化合物中有手性碳的是？", "options": ["CH3Cl", "CH2Cl2", "CH3CHClCH3", "CH3CHClCH2CH3"], "answer": 3, "explain": "2 号碳连 H、Cl、CH3、C2H5 四个不同基团。", "relatedConceptId": "c01", "optionMisconceptions": []}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "有机化学的结构语言：一句话核心是什么？", "back": "有机分子靠碳骨架加官能团两件事描述；同一分子式画出不同骨架，就是不同物质。", "tags": ["ch01"]}, {"id": "f02", "chapterId": "ch01", "front": "有机化学的结构语言最容易错在哪？", "back": "分子式相同不一定是同一种物质。", "tags": ["ch01", "易错"]}, {"id": "f03", "chapterId": "ch02", "front": "烷烃与构象：一句话核心是什么？", "back": "烷烃的 C—C 单键可以自由旋转，不同旋转角度形成不同构象；化学性质以自由基取代为主。", "tags": ["ch02"]}, {"id": "f04", "chapterId": "ch02", "front": "烷烃与构象最容易错在哪？", "back": "构象不同不断键，是同一物质。", "tags": ["ch02", "易错"]}, {"id": "f05", "chapterId": "ch03", "front": "烯烃与亲电加成：一句话核心是什么？", "back": "C=C 由一个 σ 键和一个 π 键组成，π 电子云暴露在外，容易被亲电试剂进攻发生加成。", "tags": ["ch03"]}, {"id": "f06", "chapterId": "ch03", "front": "烯烃与亲电加成最容易错在哪？", "back": "过氧化物存在下 HBr 加成是反马氏，是特例。", "tags": ["ch03", "易错"]}, {"id": "f07", "chapterId": "ch04", "front": "芳香烃、卤代烃与立体化学：一句话核心是什么？", "back": "苯环的 π 电子离域使体系特别稳定，倾向取代；手性来自四个不同基团连在同一个碳上。", "tags": ["ch04"]}, {"id": "f08", "chapterId": "ch04", "front": "芳香烃、卤代烃与立体化学最容易错在哪？", "back": "R 不一定是右旋，S 不一定是左旋，必须实测。", "tags": ["ch04", "易错"]}], "companion": "学习伴侣.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：《基础有机化学》上册·绪论<\/div><h1>第 1 章：有机化学的结构语言<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：入门篇第 10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n把分子式展开成构造式、键线式；\n<\/li><li>\n认出常见官能团并说出所属类别；\n<\/li><li>\n判断两种结构是不是同分异构体；\n<\/li><li>\n用&quot;IUPAC 三步法&quot;给简单有机物命名。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>有机分子靠&quot;碳骨架 + 官能团&quot;两件事描述；同一分子式画出不同骨架，就是不同的物质。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：构造式与键线式（难度：基础）<\/h3>\n<p><strong>构造式<\/strong>把每个原子和每根键都画出来：<\/p>\n<pre><code>    H   H\n    |   |\nH - C - C - O - H\n    |   |\n    H   H<\/code><\/pre>\n<p><strong>键线式<\/strong>省略 C 和 C—H 键，只画碳骨架和官能团，端点与拐点都是碳。乙醇的键线式是一根折线，末端接 OH。<\/p>\n<p>读键线式三条规则：<\/p>\n<ol><li>\n每个端点和拐点是碳原子；\n<\/li><li>\n碳上没画出的键都由氢补满（碳四价）；\n<\/li><li>\n杂原子（O、N、S、卤素）必须写出来。\n<\/ol>\n<h3>概念 2：官能团（难度：基础）<\/h3>\n<p>官能团决定有机物的化学性质。必认清单：<\/p>\n<table><thead><tr><th>官能团<\/th><th>结构<\/th><th>所属类别<\/th><th>典型性质<\/th><\/tr><\/thead><tbody><tr><td>羟基<\/td><td>—OH<\/td><td>醇/酚<\/td><td>与 Na 反应、酯化<\/td><\/tr><tr><td>羧基<\/td><td>—COOH<\/td><td>羧酸<\/td><td>酸性、酯化<\/td><\/tr><tr><td>醛基<\/td><td>—CHO<\/td><td>醛<\/td><td>银镜反应、被氧化<\/td><\/tr><tr><td>羰基<\/td><td>C=O<\/td><td>酮/醛<\/td><td>加成、还原<\/td><\/tr><tr><td>酯基<\/td><td>—COO—<\/td><td>酯<\/td><td>水解<\/td><\/tr><tr><td>碳碳双键<\/td><td>C=C<\/td><td>烯烃<\/td><td>加成、氧化<\/td><\/tr><tr><td>碳碳三键<\/td><td>C≡C<\/td><td>炔烃<\/td><td>加成<\/td><\/tr><tr><td>氨基<\/td><td>—NH₂<\/td><td>胺<\/td><td>碱性<\/td><\/tr><tr><td>卤素<\/td><td>—X<\/td><td>卤代烃<\/td><td>取代、消除<\/td><\/tr><\/tbody><\/table>\n<h3>概念 3：同分异构（难度：进阶）<\/h3>\n<p>分子式相同、结构不同叫<strong>同分异构体<\/strong>。四类：<\/p>\n<ul><li>\n<strong>碳链异构<\/strong>：正丁烷与异丁烷。\n<\/li><li>\n<strong>位置异构<\/strong>：1-丙醇与 2-丙醇；邻、间、对二甲苯。\n<\/li><li>\n<strong>官能团异构<\/strong>：乙醇与二甲醚；乙酸与甲酸甲酯。\n<\/li><li>\n<strong>立体异构<\/strong>：顺反异构、对映异构（第 4 章讲）。\n<\/ul>\n<p>数同分异构体要按&quot;碳链由长到短、支链由少到多、位置由中到边&quot;的顺序，避免漏数。<\/p>\n<h3>概念 4：IUPAC 命名三步法（难度：进阶）<\/h3>\n<ol><li>\n<strong>选主链<\/strong>：含主要官能团的最长碳链。\n<\/li><li>\n<strong>编号<\/strong>：从离官能团最近的一端开始，让官能团位次最小。\n<\/li><li>\n<strong>写名称<\/strong>：位次-取代基-母体。\n<\/ol>\n<p>例：CH₃CH(CH₃)CH₂OH 主链 3 个碳（丙醇），OH 在 1 号位，2 号位有甲基 → 2-甲基-1-丙醇。<\/p>\n<p>常见母体：烷（-ane）、烯（-ene）、炔（-yne）、醇（-ol）、醛（-al）、酸（-oic acid）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[分子式] --&gt; B[画出碳骨架]\n  B --&gt; C[补氢 满足四价]\n  C --&gt; D[标官能团]\n  D --&gt; E[命名: 主链 编号 取代基]\n  B --&gt; F{骨架不同?}\n  F --&gt;|是| G[同分异构体]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从分子式到结构，先搭骨架再挂官能团。骨架不同就构成同分异构。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：有机分子像乐高。碳骨架是积木底座，官能团是插在上面的功能件。同样的底座插不同功能件，就是不同物质。这个类比在&quot;官能团之间会相互影响&quot;（共轭、诱导）时失效。<\/p>\n<p>实例：C₄H₁₀ 有几种同分异构体？两种：正丁烷（直链）和异丁烷（2-甲基丙烷）。C₅H₁₂ 有三种：正戊烷、异戊烷、新戊烷。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;分子式相同就是同一种物质&quot;——要看结构。\n<\/li><li>\n别以为&quot;键线式的拐点不是碳&quot;——每个拐点和端点都是碳。\n<\/li><li>\n别以为&quot;命名时编号可以从任意一端开始&quot;——必须让官能团位次最小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n下列属于官能团的是（ ）。A. —CH₃ B. —OH C. —C₂H₅ D. 苯环\n<p>（答案：B；解析：羟基是官能团，甲基、乙基是取代基。）<\/p>\n<\/ol>\n<ol><li>\nC₄H₁₀ 的同分异构体有几种？\n<p>（答案：2 种；解析：正丁烷、异丁烷。）<\/p>\n<\/ol>\n<ol><li>\n命名 CH₃CH₂CH₂OH。\n<p>（答案：1-丙醇；解析：主链 3 个碳，OH 在 1 号位。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n键线式：端点、拐点都是碳，氢省略。\n<\/li><li>\n官能团决定性质，先认羟基、羧基、双键、酯基。\n<\/li><li>\n命名三步：选主链、编号、写位次。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：《基础有机化学》上册·饱和烃<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/organic-chem/chapter/ch01\">第 1 章：有机化学的结构语言<\/a><\/span><\/div><h1>第 2 章：烷烃与构象<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：1.2 小时 | <strong>前置<\/strong>：第 1 章、普化第 11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 sp³ 杂化与甲烷的四面体结构；\n<\/li><li>\n区分乙烷的交叉式和重叠式构象；\n<\/li><li>\n写出烷烃的自由基取代反应；\n<\/li><li>\n解释烷烃沸点随碳数增加而升高的原因。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>烷烃的 C—C 单键可以自由旋转，不同旋转角度形成不同构象；化学性质以自由基取代为主。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：sp³ 与四面体（难度：基础）<\/h3>\n<p>烷烃碳原子是 sp³ 杂化，四个杂化轨道指向四面体四个顶点，键角 109.5°。甲烷 CH₄ 是正四面体，四个 C—H 键完全等价。<\/p>\n<p>因为四个键等价，甲烷的一氯代物只有一种 CH₃Cl，二氯代物只有一种 CH₂Cl₂。如果甲烷是平面结构，二氯代物会有两种（相邻、相对），实验只发现一种，这反过来证明甲烷是四面体。<\/p>\n<h3>概念 2：构象（难度：进阶）<\/h3>\n<p>C—C 单键可以旋转，同一分子在不同旋转角度下的空间排列叫<strong>构象<\/strong>。构象之间不经过断键就能互变，所以它们是同一物质的不同形态，不是同分异构体。<\/p>\n<p>乙烷的两种典型构象：<\/p>\n<ul><li>\n<strong>交叉式<\/strong>：两个甲基的氢相互错开，能量最低，最稳定。\n<\/li><li>\n<strong>重叠式<\/strong>：氢与氢正对，排斥最大，能量最高。\n<\/ul>\n<p>室温下分子碰撞能量足以越过旋转能垒（约 12 kJ/mol），所以乙烷快速在两种构象间转换，平均以交叉式为主。<\/p>\n<h3>概念 3：自由基取代（难度：进阶）<\/h3>\n<p>烷烃在光照下与卤素发生取代，机理是自由基链反应，三步：<\/p>\n<ol><li>\n<strong>链引发<\/strong>：Cl₂ →(光照) 2Cl·（氯自由基）\n<\/li><li>\n<strong>链增长<\/strong>：Cl· + CH₄ → CH₃· + HCl；CH₃· + Cl₂ → CH₃Cl + Cl·\n<\/li><li>\n<strong>链终止<\/strong>：Cl· + Cl· → Cl₂；CH₃· + Cl· → CH₃Cl；CH₃· + CH₃· → C₂H₆\n<\/ol>\n<p>选择性：叔氢 &gt; 仲氢 &gt; 伯氢，因为形成的自由基越稳定，反应越容易。所以甲烷氯代会得到多种产物，工业上难以只停在 CH₃Cl。<\/p>\n<h3>概念 4：烷烃的物理性质（难度：基础）<\/h3>\n<ul><li>\n碳数 1–4：气体；5–16：液体；17 以上：固体。\n<\/li><li>\n沸点随碳数增加而升高：分子越大，色散力越强。\n<\/li><li>\n同分异构体中，支链越多，沸点越低：支链使分子更接近球形，接触面积小。\n<\/ul>\n<p>烷烃不溶于水，溶于有机溶剂，密度比水小。化学性质稳定，不与酸、碱、KMnO₄ 反应，可作溶剂和燃料。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[乙烷 C2H6] --&gt; B[交叉式 能量低]\n  A --&gt; C[重叠式 能量高]\n  B --&gt;|旋转 12 kJ/mol| C\n  C --&gt;|继续旋转| B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：能量曲线有两个低点（交叉式）和两个高点（重叠式）。室温下分子轻松越过能垒，所以两种构象快速互变。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：乙烷的 C—C 键像一根可以转动的轴，两端各挂一个风扇叶片。转到叶片错开时最省力（交叉式），正对时最费劲（重叠式）。这个类比在&quot;构象影响反应选择性&quot;这一点上要补一句：酶和受体识别的是特定构象。<\/p>\n<p>实例：正丁烷有几种构象？沿 C2—C3 键旋转，有对位交叉、邻位交叉、部分重叠、全重叠等，其中对位交叉最稳定。室温下以对位交叉为主。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;构象不同就是不同物质&quot;——不断键就能互变，是同一物质。\n<\/li><li>\n别以为&quot;烷烃完全没反应&quot;——光照下能与卤素取代，高温下能燃烧、裂解。\n<\/li><li>\n别以为&quot;支链越多沸点越高&quot;——恰好相反，支链多沸点低。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n甲烷的空间构型是（ ）。A. 平面正方形 B. 正四面体 C. 三角锥 D. 直线形\n<p>（答案：B；解析：sp³ 杂化，四个键指向四面体顶点。）<\/p>\n<\/ol>\n<ol><li>\n乙烷最稳定的构象是（ ）。\n<p>（答案：交叉式；解析：氢与氢错开，排斥最小。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;烷烃能使酸性 KMnO₄ 溶液褪色。&quot;\n<p>（答案：不对。烷烃不含不饱和键，不被 KMnO₄ 氧化。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsp³ 四面体，键角 109.5°。\n<\/li><li>\n交叉式稳定、重叠式不稳定，构象不断键互变。\n<\/li><li>\n自由基取代三步：引发、增长、终止。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：《基础有机化学》上册·烯烃<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/organic-chem/chapter/ch02\">第 2 章：烷烃与构象<\/a><\/span><\/div><h1>第 3 章：烯烃与亲电加成<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清 C=C 的 sp² 结构与 π 键；\n<\/li><li>\n判断顺反异构；\n<\/li><li>\n用马氏规则预测加成产物；\n<\/li><li>\n写出烯烃的氧化反应。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>C=C 由一个 σ 键和一个 π 键组成，π 电子云暴露在外，容易被亲电试剂进攻，发生加成。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：sp² 与 π 键（难度：进阶）<\/h3>\n<p>双键碳是 sp² 杂化，三个杂化轨道在同一平面内，键角约 120°。剩下的一个 p 轨道垂直于该平面，两个碳的 p 轨道肩并肩重叠形成 <strong>π 键<\/strong>。<\/p>\n<p>π 键的特点：电子云在平面上下，暴露在外，容易被亲电试剂进攻；π 键比 σ 键弱，容易断裂，所以烯烃易加成。双键碳不能自由旋转，否则 π 键断裂。<\/p>\n<h3>概念 2：顺反异构（难度：进阶）<\/h3>\n<p>双键不能旋转，当两个双键碳各连两个不同基团时，会出现<strong>顺反异构<\/strong>。<\/p>\n<p>以 2-丁烯为例：<\/p>\n<ul><li>\n顺式：两个甲基在双键同侧。\n<\/li><li>\n反式：两个甲基在双键异侧。\n<\/ul>\n<p>判断条件：每个双键碳必须连两个不同的基团。若有一个碳连两个相同的氢，就没有顺反异构。<\/p>\n<h3>概念 3：亲电加成与马氏规则（难度：高难）<\/h3>\n<p>烯烃与 HX、H₂O、X₂ 等加成，分两步：亲电试剂先进攻 π 电子，生成碳正离子中间体；亲核试剂再结合。<\/p>\n<p>马氏规则：不对称烯烃与 HX 加成时，H 加在含氢较多的碳上，X 加在含氢较少的碳上。<\/p>\n<p>例：CH₃CH=CH₂ + HBr → CH₃CHBrCH₃（2-溴丙烷为主） 原因：生成的二级碳正离子比一级碳正离子稳定。碳正离子稳定性：三级 &gt; 二级 &gt; 一级。<\/p>\n<p>反马氏加成：在过氧化物存在下，HBr 与烯烃发生自由基加成，Br 加在含氢多的碳上。这条是特例，要单独记。<\/p>\n<h3>概念 4：烯烃的氧化（难度：进阶）<\/h3>\n<ul><li>\n与酸性 KMnO₄：双键断裂，生成羧酸或酮。RCH=CHR&#x27; → RCOOH + R&#x27;COOH。可用 KMnO₄ 褪色检验双键。\n<\/li><li>\n与臭氧（O₃）后还原水解：双键断裂生成醛或酮，可用来确定双键位置。\n<\/li><li>\n催化加氢：H₂/Ni 或 Pd，生成烷烃。\n<\/ul>\n<h3>概念 5：聚合（难度：基础）<\/h3>\n<p>烯烃加成聚合，双键打开连成长链： n CH₂=CH₂ →(-CH₂-CH₂-)ₙ（聚乙烯） 工业上聚乙烯、聚丙烯、聚氯乙烯都是这样来的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[烯烃 C=C] --&gt; B[亲电试剂 H+]\n  B --&gt; C[碳正离子中间体]\n  C --&gt; D[亲核试剂 X-]\n  D --&gt; E[加成产物]\n  C --&gt; F{碳正离子稳定性}\n  F --&gt;|三级最稳| G[马氏产物为主]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两步加成，第一步决定区域选择性。碳正离子越稳定，路径越容易走。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：π 键像两个人隔空拉手，力量不如真正握手（σ 键）牢。外来的人一推（亲电试剂），隔空的手就松开，改与新人握手（加成）。这个类比在&quot;碳正离子会重排&quot;这一点上要补一句：中间体还可能变形重组。<\/p>\n<p>实例：丙烯与水加成（酸催化）遵循马氏规则，主要产物是 2-丙醇： CH₃CH=CH₂ + H₂O →(H⁺) CH₃CH(OH)CH₃<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;双键可以自由旋转&quot;——旋转会破坏 π 键，所以有顺反异构。\n<\/li><li>\n别以为&quot;马氏规则适用于所有加成&quot;——只适用于亲电加成；过氧化物存在下的 HBr 加成是反马氏。\n<\/li><li>\n别以为&quot;烯烃与溴水反应是取代&quot;——是加成，溴水褪色。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n丙烯与 HBr 加成的主要产物是（ ）。A. 1-溴丙烷 B. 2-溴丙烷 C. 1,2-二溴丙烷 D. 丙醇\n<p>（答案：B；解析：马氏规则，H 加在含氢多的碳上。）<\/p>\n<\/ol>\n<ol><li>\n下列能发生顺反异构的是（ ）。A. CH₂=CH₂ B. CH₂=CHCH₃ C. CH₃CH=CHCH₃ D. CH₂=C(CH₃)₂\n<p>（答案：C；解析：两个双键碳各连两个不同基团。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;烯烃使酸性 KMnO₄ 褪色，是因为发生了加成反应。&quot;\n<p>（答案：不对。是氧化反应，双键被氧化断裂。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nsp² 平面，π 键暴露，易亲电加成。\n<\/li><li>\n马氏规则：H 加到含氢多的碳上，碳正离子稳定性决定方向。\n<\/li><li>\n酸性 KMnO₄ 褪色可检验双键。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：《基础有机化学》上册·芳香烃、卤代烃、立体化学<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/organic-chem/chapter/ch03\">第 3 章：烯烃与亲电加成<\/a><\/span><\/div><h1>第 4 章：芳香烃、卤代烃与立体化学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.8 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解释苯的芳香性；\n<\/li><li>\n写出苯的亲电取代反应；\n<\/li><li>\n区分卤代烃的取代和消除；\n<\/li><li>\n判断手性碳并写出 R/S 标记。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>苯环的 π 电子离域使体系特别稳定，所以苯倾向于取代而不是加成；手性来自&quot;四个不同基团连在同一个碳上&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：苯的结构与芳香性（难度：进阶）<\/h3>\n<p>苯 C₆H₆ 是平面正六边形，每个碳 sp² 杂化，剩余 p 轨道形成离域的 π 体系，6 个 π 电子分布在环上。键长介于单键和双键之间，都是 139 pm。<\/p>\n<p><strong>芳香性<\/strong>的三个条件（Hückel 规则）：<\/p>\n<ol><li>\n环状；\n<\/li><li>\n平面；\n<\/li><li>\nπ 电子数为 4n+2（n = 0, 1, 2…）。\n<\/ol>\n<p>苯有 6 个 π 电子，4n+2 中 n=1，满足。萘有 10 个，也满足。环丁二烯有 4 个，不满足，不稳定。<\/p>\n<p>芳香性的结果：苯不容易加成（加成会破坏离域体系），容易取代（取代后环仍保持芳香）。<\/p>\n<h3>概念 2：苯的亲电取代（难度：进阶）<\/h3>\n<p>五类典型反应，机理都是&quot;亲电试剂进攻环 → 碳正离子中间体 → 失去 H⁺ 恢复芳香&quot;。<\/p>\n<ul><li>\n卤代：C₆H₆ + Br₂ →(FeBr₃) C₆H₅Br + HBr\n<\/li><li>\n硝化：C₆H₆ + HNO₃ →(浓H₂SO₄, △) C₆H₅NO₂ + H₂O\n<\/li><li>\n磺化：C₆H₆ + H₂SO₄(浓) →(△) C₆H₅SO₃H + H₂O\n<\/li><li>\n傅–克烷基化：C₆H₆ + CH₃Cl →(AlCl₃) C₆H₅CH₃ + HCl\n<\/li><li>\n傅–克酰基化：C₆H₆ + CH₃COCl →(AlCl₃) C₆H₅COCH₃ + HCl\n<\/ul>\n<p>取代基的定位效应：<\/p>\n<ul><li>\n<strong>邻对位定位基<\/strong>：—OH、—NH₂、—CH₃、—X，使反应更容易，主要上邻位和对位。\n<\/li><li>\n<strong>间位定位基<\/strong>：—NO₂、—COOH、—SO₃H、—CHO，使反应变难，主要上间位。\n<\/ul>\n<h3>概念 3：卤代烃的取代与消除（难度：进阶）<\/h3>\n<p>卤代烃的 C—X 键极性大，碳带部分正电，容易被亲核试剂进攻。<\/p>\n<p><strong>取代（SN）<\/strong>：R—X + OH⁻ → R—OH + X⁻（水解制醇） <strong>消除（E）<\/strong>：R—CH₂—CH₂—X + OH⁻ → R—CH=CH₂ + H₂O + X⁻（醇钠、加热，生成烯烃）<\/p>\n<p>两者竞争：强碱、高温有利于消除；弱碱、低温有利于取代。叔卤代烃更容易消除，伯卤代烃更容易取代。<\/p>\n<h3>概念 4：手性与 R/S（难度：高难）<\/h3>\n<p><strong>手性碳<\/strong>：连四个不同基团的碳原子。含一个手性碳的分子通常有一对对映异构体，互为镜像、不能重合，就像左右手。<\/p>\n<p>R/S 标记步骤：<\/p>\n<ol><li>\n把手性碳的四个基团按<strong>次序规则<\/strong>排优先顺序（原子序数大的优先）。\n<\/li><li>\n把最低优先级的基团转向远离观察者（虚线）。\n<\/li><li>\n看剩下三个基团的排列方向：顺时针为 R，逆时针为 S。\n<\/ol>\n<p>次序规则：I &gt; Br &gt; Cl &gt; S &gt; O &gt; N &gt; C &gt; H；同种原子比下一层原子。<\/p>\n<p>旋光性：对映异构体能使平面偏振光旋转，一个右旋（+）、一个左旋（−）。等量混合叫外消旋体，旋光相互抵消。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[卤代烃 R-X] --&gt; B{条件}\n  B --&gt;|弱碱 低温| C[取代 生成醇]\n  B --&gt;|强碱 高温| D[消除 生成烯烃]\n  E[手性碳] --&gt; F{四个基团不同?}\n  F --&gt;|是| G[一对对映异构体 R/S]\n  F --&gt;|否| H[无手性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：卤代烃有两条竞争路径，条件决定走哪条。手性只看一个碳上的四个基团是否全不同。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：苯环像一圈手拉手的人，电子在圈上流动，整体特别稳。想插一个人进来（取代），圈还完整；想两个人分别拉住（加成），圈就断了，所以苯宁可取代。这个类比在&quot;休克尔规则&quot;处要补一句：不是所有环都稳，人数要符合 4n+2。<\/p>\n<p>实例：判断 2-丁醇 CH₃CH(OH)CH₂CH₃ 是否有手性。2 号碳连 —H、—OH、—CH₃、—CH₂CH₃，四个不同，是手性碳，有一对对映异构体。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;苯有单双键交替，所以能加成&quot;——苯的键是离域的，加成会破坏芳香性。\n<\/li><li>\n别以为&quot;卤代烃水解一定生成醇&quot;——在强碱醇溶液中加热，主要发生消除生成烯烃。\n<\/li><li>\n别以为&quot;有手性碳就一定有旋光性&quot;——外消旋体旋光抵消，要分离出单一对映体才有旋光。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n苯的硝化反应条件是（ ）。\n<p>（答案：浓硝酸、浓硫酸、加热；解析：混酸硝化，浓硫酸作催化剂和脱水剂。）<\/p>\n<\/ol>\n<ol><li>\n下列化合物中有手性碳的是（ ）。A. CH₃Cl B. CH₂Cl₂ C. CH₃CHClCH₃ D. CH₃CHClCH₂CH₃\n<p>（答案：D；解析：2 号碳连 H、Cl、CH₃、C₂H₅ 四个不同基团。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;苯容易发生加成反应，因为含有 π 电子。&quot;\n<p>（答案：不对。苯的离域 π 体系特别稳定，加成会破坏芳香性，所以主要发生取代。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n芳香性三条件：环状、平面、4n+2 个 π 电子。\n<\/li><li>\n苯的亲电取代五类：卤代、硝化、磺化、烷基化、酰基化。\n<\/li><li>\n手性碳四个基团不同，R/S 按次序规则判。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：《基础有机化学》上册·立体化学<\/div><h1>手性与对映异构<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>手性是指分子与它的镜像不能重合的性质；含一个手性碳的分子通常有一对互为镜像的对映异构体。<\/p>\n<h2>为什么重要<\/h2>\n<p>药物、氨基酸、糖，全都靠手性起作用。沙利度胺的两种对映体，一种镇吐、一种致畸；人体只能利用左旋氨基酸。不懂手性，有机化学只学了一半。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[手性碳] --&gt; B{四个基团都不同?}\n  B --&gt;|是| C[一对对映异构体]\n  B --&gt;|否| D[无手性]\n  C --&gt; E[R/S 标记]\n  C --&gt; F[旋光性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判断手性碳：看一个碳上连的四个基团是否全不同。有 H、CH₃、OH、C₂H₅ 四个不同基团，就是手性碳。<\/p>\n<p>R/S 标记：按次序规则排优先级（原子序数大的优先），把最低优先级基团转向远离观察者，剩下三个顺时针为 R、逆时针为 S。<\/p>\n<p>对映异构体物理性质相同（熔点、沸点、溶解度），只有旋光方向相反。等量混合是外消旋体，旋光抵消。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;有手性碳就一定有旋光性&quot;——外消旋体没有。\n<\/li><li>\n别以为&quot;手性分子一定含手性碳&quot;——有些联苯、丙二烯型分子没有手性碳也有手性。\n<\/li><li>\n别以为&quot;对映体化学性质完全相同&quot;——在非手性环境中相同，在手性环境（如酶）中反应速率不同。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>有机第 1 章<\/td><td>同分异构<\/td><td>立体异构是一类<\/td><\/tr><tr><td>有机第 4 章<\/td><td>手性碳<\/td><td>R/S 标记<\/td><\/tr><tr><td>有机第 4 章<\/td><td>药物<\/td><td>对映体药效不同<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：构造式、同分异构\n<\/li><li>\n后续：不对称合成、酶催化\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（手性与对映异构）<\/summary><div class=\"depth-body\"><h2>为什么&quot;镜像不能重合&quot;这件事值得单独讲<\/h2>\n<p>先做一个动作：把左手和右手掌心相对，它们看起来一样；把手掌朝同一个方向并排，它们不能重合。左手的大拇指在右边，右手的大拇指在左边。这就是&quot;手性&quot;这个名字的来源。<\/p>\n<p>分子层面完全一样。把一个手性分子和它的镜像放在一起，无论怎么旋转、平移，都无法让所有原子对齐。这不是&quot;看起来不同&quot;，而是几何上不可能。<\/p>\n<h3>第一步：什么条件造成&quot;不能重合&quot;<\/h3>\n<p>一个碳原子连四个基团，这四个基团在空间上指向四面体的四个顶点。如果四个基团全不同，那么&quot;交换任意两个基团&quot;会得到一个新的、不能重合的排列。<\/p>\n<p>用组合数算：四个不同基团在四面体四个位置的排列有 4! = 24 种。但旋转整个分子可以把一些排列重合。真正不同的只有 2 种，互为镜像。这就是一对对映体。<\/p>\n<p>如果四个基团中有两个相同（比如两个 H），交换它们得到的是同一个分子，所以没有手性。<\/p>\n<h3>第二步：为什么用&quot;次序规则&quot;排优先级<\/h3>\n<p>R/S 是把三维信息压成一个字母的约定。规则：比较与手性碳直接相连的原子，原子序数大的优先；若相同，比较下一层，直到分出高低。<\/p>\n<p>例：2-丁醇的 2 号碳连 —OH（O，8）、—CH₂CH₃（C，6）、—CH₃（C，6）、—H（1）。—OH 最高，—H 最低。—CH₂CH₃ 与 —CH₃ 第一层都是 C，比第二层：前者连 C、H、H，后者连 H、H、H，所以乙基优先于甲基。<\/p>\n<h3>第三步：R/S 怎么判<\/h3>\n<p>把最低优先级基团（这里是 H）放到远离你的方向，看剩下三个：—OH → —C₂H₅ → —CH₃。顺时针为 R，逆时针为 S。<\/p>\n<p>一个常见的错误是&quot;直接看平面图顺时针&quot;。平面图是三维分子的投影，必须先把最低优先级基团转向后方，否则结论会反。<\/p>\n<h3>第四步：旋光为什么相反<\/h3>\n<p>偏振光穿过手性分子溶液时，电场矢量会被旋转。两个对映体一个右旋（+）、一个左旋（−），旋转角度相同、方向相反。等量混合，旋转相互抵消，所以外消旋体不旋光。<\/p>\n<p>旋光方向（+ / −）与 R/S 没有固定对应关系，必须实测。这是初学者最容易混的一点：R 不一定是右旋，S 不一定是左旋。<\/p>\n<h3>第五步：为什么生物体只认一种<\/h3>\n<p>酶是手性环境。酶的活性口袋由 L-氨基酸构成，只与特定构型的底物匹配。就像左手只能戴左手套。所以人体只能利用左旋氨基酸，药物的一种对映体有效、另一种可能无效甚至有害。<\/p>\n<h3>边界<\/h3>\n<p>手性不只来自手性碳。联苯类化合物如果两侧取代基太大、不能自由旋转，整个分子可以有轴手性；丙二烯型有面手性。判断手性要看整个分子的对称性，不能只数手性碳。<\/p><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：学会画结构和命名<\/strong><br>阅读：<a href=\"#/book/organic-chem/chapter/ch01\">第 1 章：有机化学的结构语言<\/a><br>检查点：能把分子式画成键线式并命名<\/li><li class='path-step' id='path-02'><strong>步骤 02：饱和烃<\/strong><br>阅读：<a href=\"#/book/organic-chem/chapter/ch02\">第 2 章：烷烃与构象<\/a><br>检查点：能解释构象与自由基取代<\/li><li class='path-step' id='path-03'><strong>步骤 03：不饱和烃<\/strong><br>阅读：<a href=\"#/book/organic-chem/chapter/ch03\">第 3 章：烯烃与亲电加成<\/a><br>检查点：能用马氏规则预测产物<\/li><li class='path-step' id='path-04'><strong>步骤 04：芳香、卤代与手性<\/strong><br>阅读：<a href=\"#/book/organic-chem/chapter/ch04\">第 4 章：芳香烃、卤代烃与立体化学<\/a><br>检查点：能写苯的亲电取代、判断手性碳<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：有机化学的结构语言<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> 下列属于官能团的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> —CH 合物中有手性碳的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q08' value='0'> CH3Cl<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='1'> CH2Cl2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='2'> CH3CHClCH3<\/label><label class='quiz-opt'><input type='radio' name='ch04-q08' value='3'> CH3CHClCH2CH3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='键线式'>键线式 — 省略碳和碳氢键、只画碳骨架与官能团的结构式 <span class=glossary-ref>（第 1 章：有机化学的结构语言）<\/span><\/li><li data-term='同分异构体'>同分异构体 — 分子式相同、结构不同的化合物 <span class=glossary-ref>（第 1 章：有机化学的结构语言）<\/span><\/li><li data-term='构象'>构象 — 单键旋转形成的不同空间排列，不断键即可互变 <span class=glossary-ref>（第 2 章：烷烃与构象）<\/span><\/li><li data-term='马氏规则'>马氏规则 — 不对称烯烃与 HX 加成时 H 加在含氢较多的碳上 <span class=glossary-ref>（第 3 章：烯烃与亲电加成）<\/span><\/li><li data-term='芳香性'>芳香性 — 环状、平面、π 电子数为 4n+2 的体系具有的特殊稳定性 <span class=glossary-ref>（第 4 章：芳香烃、卤代烃与立体化学）<\/span><\/li><li data-term='手性碳'>手性碳 — 连有四个不同基团的碳原子 <span class=glossary-ref>（第 4 章：芳香烃、卤代烃与立体化学）<\/span><\/li><li data-term='对映异构体'>对映异构体 — 互为镜像、不能重合的一对立体异构体 <span class=glossary-ref>（第 4 章：芳香烃、卤代烃与立体化学）<\/span><\/li><li data-term='外消旋体'>外消旋体 — 等量对映异构体的混合物，旋光相互抵消 <span class=glossary-ref>（第 4 章：芳香烃、卤代烃与立体化学）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：结构决定性质<\/h2>\n<p>先画碳骨架，再标官能团，最后由官能团判断反应类型：双键加成、羟基酯化、羧基酸性、卤代烃取代/消除。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n数同分异构：碳链由长到短、支链由少到多、位置由中到边。\n<\/li><li>\n判断马氏加成：看碳正离子稳定性，三级 &gt; 二级 &gt; 一级。\n<\/li><li>\n判断手性碳：一个碳上四个基团是否全不同；再用次序规则定 R/S。\n<\/li><li>\n卤代烃取代还是消除：弱碱低温取代，强碱高温消除。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n把构象当同分异构。单键旋转不断键，是同一物质。\n<\/li><li>\n认为苯容易加成。加成破坏芳香性，苯主要发生取代。\n<\/li><li>\n认为 R 一定右旋。旋光方向必须实测，与 R/S 无固定对应。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>官能团与反应<\/h2>\n<table><thead><tr><th>官能团<\/th><th>典型反应<\/th><\/tr><\/thead><tbody><tr><td>C=C<\/td><td>加成、氧化、聚合<\/td><\/tr><tr><td>—OH<\/td><td>与 Na 反应、酯化、氧化<\/td><\/tr><tr><td>—COOH<\/td><td>酸性、酯化<\/td><\/tr><tr><td>—CHO<\/td><td>银镜反应、还原<\/td><\/tr><tr><td>—X<\/td><td>取代、消除<\/td><\/tr><tr><td>苯环<\/td><td>亲电取代<\/td><\/tr><\/tbody><\/table>\n<h2>规则<\/h2>\n<table><thead><tr><th>场景<\/th><th>规则<\/th><\/tr><\/thead><tbody><tr><td>马氏加成<\/td><td>H 加到含氢多的碳上<\/td><\/tr><tr><td>反马氏<\/td><td>过氧化物存在下的 HBr 加成<\/td><\/tr><tr><td>手性碳<\/td><td>四个基团全不同<\/td><\/tr><tr><td>R/S<\/td><td>最低优先级朝后，其余顺 R 逆 S<\/td><\/tr><tr><td>卤代烃<\/td><td>弱碱低温取代，强碱高温消除<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：有机化学的结构语言", "href": "#/chapter/ch01"}, {"label": "第 2 章：烷烃与构象", "href": "#/chapter/ch02"}, {"label": "第 3 章：烯烃与亲电加成", "href": "#/chapter/ch03"}, {"label": "第 4 章：芳香烃、卤代烃与立体化学", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "手性与对映异构", "href": "#/concept/c01"}]}, {"label": "测验" tionMisconceptions": []}, {"id": "ch01-q17", "chapterId": "ch01", "type": "single", "question": "少量 NH3 与过量 Cl2 反应生成酸性气体和 NCl3，化学方程式是？", "options": ["NH3 + 3Cl2 → NCl3 + 3HCl", "NH3 + Cl2 → NCl3 + HCl", "2NH3 + 3Cl2 → 2NCl3 + 3H2", "NH3 + 2Cl2 → NCl2 + 2HCl"], "answer": 0, "explain": "N -3→+3 失 6e，3 个 Cl2 共得 6e；NCl3 中 N、Cl 均满足 8 电子结构。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "ch01-q18", "chapterId": "ch01", "type": "single", "question": "酸性条件下 Cr2O7^2- 氧化 SO3^2- 为 SO4^2-，离子方程式是？", "options": ["Cr2O7^2- + 3SO3^2- + 8H+ → 2Cr3+ + 3SO4^2- + 4H2O", "Cr2O7^2- + 3SO3^2- + 6H+ → 2Cr3+ + 3SO4^2- + 3H2O", "Cr2O7^2- + SO3^2- + 8H+ → 2Cr3+ + SO4^2- + 4H2O", "Cr2O7^2- + 3SO3^2- + 14H+ → 2Cr3+ + 3SO4^2- + 7H2O"], "answer": 0, "explain": "Cr 得 3e×2=6e，S 失 2e×3=6e；补 8H+ 和 4H2O 后电荷 0 对 0。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "ch01-q19", "chapterId": "ch01", "type": "single", "question": "CeO2 在稀硫酸和 H2O2 作用下生成 Ce3+，化学方程式是？", "options": ["2CeO2 + H2O2 + 3H2SO4 → Ce2(SO4)3 + O2↑ + 4H2O", "CeO2 + H2O2 + H2SO4 → CeSO4 + O2↑ + 2H2O", "2CeO2 + H2O2 + 2H2SO4 → Ce2(SO4)3 + O2↑ + 2H2O", "CeO2 + H2O2 + 2H2SO4 → Ce(SO4)2 + 3H2O"], "answer": 0, "explain": "Ce +4→+3 得 1e×2=2e；H2O2 中 O -1→0 失 2e；补 3H2SO4 成盐。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "ch01-q20", "chapterId": "ch01", "type": "blank", "question": "EDTA 滴定：2.6826 g 样品配成 250 mL，取 25.00 mL 用 0.04000 mol/L EDTA 消耗 25.50 mL，NiSO4·nH2O 的 n 是多少？（填整数）", "options": [], "answer": "6", "explain": "25.00 mL 中 Ni2+ 为 0.04000×0.02550=1.020×10^-3 mol，250 mL 中 1.020×10^-2 mol；M=2.6826/0.01020=263.0，减去 NiSO4 的 154.75 得 108.2，除以 18.02 得 6。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "ch01-q21", "chapterId": "ch01", "type": "blank", "question": "金属钠与 H2 反应生成甲，4.80 g 甲完全分解得到 2.24 L（标况）H2，甲的化学式是？", "options": [], "answer": "NaH", "explain": "2.24 L H2 为 0.1 mol，含 H 0.2 mol；4.80 g 中 Na 为 0.2 mol（4.6 g），H 0.2 mol（0.2 g），故为 NaH。", "relatedConceptId": "c01", "optionMisconceptions": []}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "陌生方程式书写的五步法：一句话核心是什么？", "back": "陌生方程式靠信息、类型、产物、配平、检查这条固定流水线推出来。", "tags": ["ch01"]}, {"id": "f02", "chapterId": "ch01", "front": "陌生方程式书写的五步法最容易错在哪？", "back": "产物多数要自己推，题里不会全给。", "tags": ["ch01", "易错"]}], "companion": "学习伴侣.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：《陌生方程式的书写查缺补漏》增分点一至三<\/div><h1>第 1 章：陌生方程式书写的五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：入门篇第 4、6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n从一段陌生信息里提取反应物、产物、环境和价态；\n<\/li><li>\n判断该写化学方程式、离子方程式还是电极反应式；\n<\/li><li>\n按五步法配平并检查电荷、原子、条件；\n<\/li><li>\n避开&quot;该拆不拆、该标不标、电荷不平&quot;三类高频失分点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>陌生方程式不是靠背，而是靠&quot;信息 → 类型 → 产物 → 配平 → 检查&quot;这条固定流水线，一步一步推出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：第一步，把信息拆成四件事（难度：基础）<\/h3>\n<p>拿到题先划四样东西：<\/p>\n<ul><li>\n<strong>反应物<\/strong>：谁和谁反应，注意&quot;少量&quot;&quot;过量&quot;&quot;适量&quot;。\n<\/li><li>\n<strong>产物线索<\/strong>：题里明说的产物、颜色变化、气体、沉淀。\n<\/li><li>\n<strong>环境<\/strong>：酸性、碱性、中性，还是熔融盐、水溶液。\n<\/li><li>\n<strong>价态变化<\/strong>：有没有元素化合价升降，这是判断氧化还原的关键。\n<\/ul>\n<p>例：&quot;向含碘废液中加入稍过量的 Na₂SO₃ 溶液，将 I₂ 还原为 I⁻&quot;。反应物 I₂、SO₃²⁻；产物 I⁻、SO₄²⁻；环境水溶液；S 从 +4 升到 +6，I 从 0 降到 −1，是氧化还原。<\/p>\n<h3>概念 2：第二步，判断反应类型（难度：进阶）<\/h3>\n<p>三类方程式，写法不同：<\/p>\n<ul><li>\n<strong>化学方程式<\/strong>：写完整化学式，标状态和条件。\n<\/li><li>\n<strong>离子方程式<\/strong>：可溶强电解质拆成离子，难溶物、气体、水、弱电解质不拆。\n<\/li><li>\n<strong>电极反应式<\/strong>：分正负极（或阴阳极），标电子得失，注意电解质环境（酸性/碱性/熔融碳酸盐）。\n<\/ul>\n<p>判断依据是题目问什么。问&quot;离子方程式&quot;就不能写化学方程式；问&quot;正极反应式&quot;就不能写总反应。<\/p>\n<h3>概念 3：第三步，定产物（难度：高难）<\/h3>\n<p>产物不能瞎猜，按三条线索定：<\/p>\n<ol><li>\n<strong>价态守恒<\/strong>：氧化还原中，升多少、降多少要配平。常见产物：Fe²⁺/Fe³⁺、Mn²⁺/MnO₂、Cr³⁺/Cr₂O₇²⁻、SO₂/SO₄²⁻、NO/NO₃⁻。\n<\/li><li>\n<strong>环境守恒<\/strong>：酸性条件补 H⁺ 和 H₂O；碱性条件补 OH⁻ 和 H₂O；熔融碳酸盐中补 CO₃²⁻ 和 CO₂。\n<\/li><li>\n<strong>元素守恒<\/strong>：C、N、S 等元素的去向要合理，比如 CN⁻ 被氧化成 CNO⁻ 再进一步氧化成 N₂ 和 CO₂。\n<\/ol>\n<h3>概念 4：第四步，配平（难度：高难）<\/h3>\n<p>配平顺序：先电子，再原子，最后电荷。<\/p>\n<p>以酸性条件下 KMnO₄ 氧化 H₂C₂O₄ 为例：<\/p>\n<ol><li>\n标价：Mn +7→+2（得 5e），C +3→+4（每个 C 失 1e，H₂C₂O₄ 有两个 C，共失 2e）。\n<\/li><li>\n电子守恒：2MnO₄⁻ 得 10e，需要 5H₂C₂O₄ 失 10e。\n<\/li><li>\n配原子：2MnO₄⁻ + 5H₂C₂O₄ → 2Mn²⁺ + 10CO₂。\n<\/li><li>\n补 H⁺ 和 H₂O：左边 10 个 H，右边需要 10H⁺？先数 O：左边 8 + 20 = 28，右边 20，差 8 个 O，补 8H₂O 在右边；H 左边 10，右边 10H⁺ + 16H（8H₂O）= 26，不平。重算：2MnO₄⁻ + 5H₂C₂O₄ + 6H⁺ → 2Mn²⁺ + 10CO₂ + 8H₂O。\n<p>检查：Mn2，C10，O 8+20=28 → 20+8=28；H 10+6=16 → 16；电荷 −2−6+6=−2，右边 +4−? 2Mn²⁺ = +4，电荷 +4，不平。调整 H⁺：需要 −2 + x = +4 → x = 6，已写 6H⁺，左边电荷 −2 + 6 = +4，右边 +4，平。H：左边 10+6=16，右边 8H₂O=16，平。正确：2MnO₄⁻ + 5H₂C₂O₄ + 6H⁺ → 2Mn²⁺ + 10CO₂↑ + 8H₂O。<\/p>\n<\/ol>\n<p>这段推导说明：配平不是一次成功，数是靠&quot;电荷平&quot;倒推 H⁺ 个数。考试时按这个顺序检查，比死记系数可靠。<\/p>\n<h3>概念 5：第五步，检查四件事（难度：进阶）<\/h3>\n<ol><li>\n<strong>原子守恒<\/strong>：每种元素左右相等。\n<\/li><li>\n<strong>电荷守恒<\/strong>：离子方程式左右电荷代数和相等。\n<\/li><li>\n<strong>电子守恒<\/strong>：氧化还原得失电子总数相等。\n<\/li><li>\n<strong>符号规范<\/strong>：气体 ↑、沉淀 ↓、条件（点燃、加热、催化剂）、可逆号。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[读题] --&gt; B[提取反应物 产物 环境 价态]\n  B --&gt; C{反应类型}\n  C --&gt;|无价态变化| D[化学/离子方程式]\n  C --&gt;|有价态变化| E[氧化还原配平]\n  D --&gt; F[拆写规则]\n  E --&gt; G[电子守恒 补H+/OH-]\n  F --&gt; H[检查原子 电荷]\n  G --&gt; H\n  H --&gt; I[标条件与符号]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条分支的区别只在&quot;有没有价态变化&quot;。有价态变化的题，电子守恒是主线；没有的题，拆写规则是主线。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：写陌生方程式像拼装家具。说明书只给几张图（题目信息），你得先认出零件（反应物）、看明白成品长什么样（产物线索）、按装配顺序装（配平）、最后检查螺丝有没有拧紧（守恒检查）。这个类比在&quot;产物需要自己推断&quot;这一点上要补一句：家具图给了成品，化学题常常不给，要靠价态和环境推。<\/p>\n<p>实例：写出 Na₂S₂O₃ 在酸性溶液中分解的离子方程式。 信息：S₂O₃²⁻ 在酸性条件下不稳定，生成黄色沉淀（硫）和刺激性气体（SO₂）。 价态：S 平均 +2，一部分升到 +4（SO₂），一部分降到 0（S）。 配平：S₂O₃²⁻ → S + SO₂，先让 S 守恒：S₂O₃²⁻ → S + SO₂ 已有 2 个 S；O 3 → 2，差 1 个 O，补 H₂O；H 补 H⁺。 S₂O₃²⁻ + 2H⁺ → S↓ + SO₂↑ + H₂O。检查：S2，O3=2+1，H2，电荷 −2+2=0。正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;题里没说的产物不能写&quot;——产物常常要自己推，推的依据是价态、环境、元素守恒。\n<\/li><li>\n别以为&quot;离子方程式里所有化合物都要拆&quot;——难溶物、气体、水、弱电解质、氧化物不拆。\n<\/li><li>\n别以为&quot;配平只要原子平就行&quot;——离子方程式还必须电荷平，氧化还原还必须电子平。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出 Cl₂ 在碱性条件下氧化 CN⁻ 为 CNO⁻ 的离子方程式。\n<p>（答案：CN⁻ + ClO⁻ → CNO⁻ + Cl⁻；解析：Cl₂ 在碱性条件下先生成 ClO⁻，Cl 从 0 降到 −1，C 从 +2 升到 +4，1:1 配平。）<\/p>\n<\/ol>\n<ol><li>\n写出酸性条件下 MnO₂ 氧化 H₃AsO₃ 的离子方程式。\n<p>（答案：H₃AsO₃ + MnO₂ + 2H⁺ → H₃AsO₄ + Mn²⁺ + H₂O；解析：As +3→+5 失 2e，Mn +4→+2 得 2e，1:1；补 2H⁺ 和 1H₂O。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;离子方程式两边只要原子守恒，电荷可以不守恒。&quot;\n<p>（答案：不对。电荷必须守恒，这是离子方程式的硬性要求。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步：读信息 → 判类型 → 定产物 → 配平 → 检查。\n<\/li><li>\n酸性补 H⁺，碱性补 OH⁻，熔融碳酸盐补 CO₃²⁻。\n<\/li><li>\n三守恒：原子、电荷、电子。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：《陌生方程式的书写查缺补漏》<\/div><h1>陌生方程式五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把陌生方程式拆成&quot;读信息 → 判类型 → 定产物 → 配平 → 检查&quot;五个固定步骤，按顺序推进。<\/p>\n<h2>为什么重要<\/h2>\n<p>考试里的方程式题，90% 不是不会化学，而是漏了某一步：产物猜错、该拆没拆、电荷不平。固定流程能把&quot;凭感觉&quot;变成&quot;按清单核对&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[读信息] --&gt; B[判类型]\n  B --&gt; C[定产物]\n  C --&gt; D[配平]\n  D --&gt; E[检查]\n  E --&gt;|不过| C\n  E --&gt;|通过| F[写答案]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>读信息时划四样：反应物、产物线索、环境、价态。这一步决定后面所有判断。<\/p>\n<p>判类型：问化学方程式、离子方程式还是电极反应式。类型不同，拆写和符号规则不同。<\/p>\n<p>定产物：氧化还原看价态升降，非氧化还原看复分解条件（沉淀、气体、水），电极反应看电解质环境。<\/p>\n<p>配平：先电子守恒，再原子守恒，最后电荷守恒。酸性补 H⁺，碱性补 OH⁻，熔融碳酸盐补 CO₃²⁻。<\/p>\n<p>检查：原子、电荷、电子、符号四件事。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;产物题里没写就不能写&quot;——多数产物要自己推。\n<\/li><li>\n别以为&quot;配平一次就能成&quot;——电荷不平就回去改 H⁺/OH⁻ 个数。\n<\/li><li>\n别以为&quot;写对就行，符号无所谓&quot;——气体、沉淀、条件都是得分点。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>陌生第 1 章<\/td><td>五步法<\/td><td>固定流程<\/td><\/tr><tr><td>入门第 4、6、7 章<\/td><td>基础<\/td><td>配平、拆写、氧化还原<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：离子方程式、氧化还原\n<\/li><li>\n后续：电极反应、工艺流程题\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先学五步法<\/strong><br>阅读：<a href=\"#/book/equation-diagnosis/chapter/ch01\">第 1 章：陌生方程式书写的五步法<\/a><br>检查点：能复述五步并写出 2 个陌生方程式<\/li><li class='path-step' id='path-02'><strong>步骤 02：做题诊断<\/strong><br>阅读：<a href=\"#/book/equation-diagnosis/chapter/ch01\">第 1 章：陌生方程式书写的五步法<\/a><br>检查点：诊断测试答对 4/5<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：陌生方程式书写的五步法<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> Na2S2O3 在酸性溶液中分解，生成黄色沉淀和刺激性气体，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> S2O3^2- + 2H+ → S↓ + SO2↑ + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> S2O3^2- + H+ → S↓ + SO2↑ + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> S2O3^2- + 2H+ → S↓ + SO3^2- + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> S2O3^2- + 2H+ → H2S↑ + SO2↑ + H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> Na2S2O3 被 Cl2 氧化为 SO4^2-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> S2O3^2- + 4Cl2 + 5H2O → 2SO4^2- + 8Cl- + 10H+<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> S2O3^2- + 2Cl2 + 3H2O → 2SO4^2- + 4Cl- + 6H+<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> S2O3^2- + 4Cl2 + 3H2O → 2SO4^2- + 8Cl- + 6H+<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> S2O3^2- + Cl2 + H2O → SO4^2- + 2Cl- + 2H+<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> NaBH4 与水反应生成 NaBO2 和 H2，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> NaBH4 + 2H2O → NaBO2 + 4H2↑<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='1'> NaBH4 + H2O → NaBO2 + 2H2↑<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='2'> NaBH4 + 3H2O → NaBO2 + 5H2↑<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='3'> NaBH4 + 2H2O → NaOH + B(OH)3 + 2H2↑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q04' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 硫与热的 NaOH 溶液反应，产物中硫的最高价为 +4，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q04' value='0'> 3S + 6OH- → 2S^2- + SO3^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q04' value='1'> 3S + 6OH- → 2S^2- + SO4^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q04' value='2'> S + 2OH- → S^2- + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q04' value='3'> 2S + 4OH- → S^2- + SO2↑ + 2H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q05' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q5.<\/b> NaClO3 与盐酸反应生成 ClO2，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q05' value='0'> 2NaClO3 + 4HCl → 2ClO2↑ + Cl2↑ + 2NaCl + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q05' value='1'> NaClO3 + 2HCl → ClO2↑ + Cl2↑ + NaCl + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q05' value='2'> 2NaClO3 + 2HCl → 2ClO2↑ + 2NaCl + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q05' value='3'> NaClO3 + 6HCl → ClO2↑ + 3Cl2↑ + NaCl + 3H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q06' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q6.<\/b> 足量铁粉与稀硝酸反应生成 NO，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q06' value='0'> Fe + 4HNO3(稀) → Fe(NO3)3 + NO↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q06' value='1'> Fe + 4HNO3(稀) → Fe(NO3)2 + 2NO2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q06' value='2'> 3Fe + 8HNO3(稀) → 3Fe(NO3)2 + 2NO↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q06' value='3'> Fe + 2HNO3(稀) → Fe(NO3)2 + H2↑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q07' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q7.<\/b> 酸性溶液中 Ca(NO2)2 分解产生 NO，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q07' value='0'> 3NO2- + 2H+ → 2NO↑ + NO3- + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q07' value='1'> 2NO2- + 2H+ → NO↑ + NO3- + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q07' value='2'> NO2- + H+ → NO↑ + OH-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q07' value='3'> 3NO2- + 2H+ → 2NO↑ + NO3- + 2H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q08' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q8.<\/b> H3AsO3 被 MnO2 氧化为 H3AsO4，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q08' value='0'> H3AsO3 + MnO2 + 2H+ → H3AsO4 + Mn2+ + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q08' value='1'> H3AsO3 + MnO2 → H3AsO4 + Mn2+ + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q08' value='2'> H3AsO3 + MnO2 + 4H+ → H3AsO4 + Mn2+ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q08' value='3'> 2H3AsO3 + MnO2 → 2H3AsO4 + Mn2+<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q09' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q9.<\/b> K4[Fe(CN)6] 爆炸分解，生成 KCN 和三种稳定单质，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q09' value='0'> K4[Fe(CN)6] → 4KCN + Fe + 2C + N2↑<\/label><label class='quiz-opt'><input type='radio' name='ch01-q09' value='1'> K4[Fe(CN)6] → 4KCN + Fe + C + N2↑<\/label><label class='quiz-opt'><input type='radio' name='ch01-q09' value='2'> K4[Fe(CN)6] → 2KCN + Fe + 2C + 2N2↑<\/label><label class='quiz-opt'><input type='radio' name='ch01-q09' value='3'> K4[Fe(CN)6] → 4KCN + FeC2 + N2↑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q10' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q10.<\/b> 碱性条件下 ClO- 将 CN- 氧化为 CNO-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q10' value='0'> CN- + ClO- → CNO- + Cl-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q10' value='1'> CN- + 2ClO- → CNO- + 2Cl-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q10' value='2'> CN- + ClO- + H2O → CNO- + Cl- + 2H+<\/label><label class='quiz-opt'><input type='radio' name='ch01-q10' value='3'> 2CN- + ClO- → 2CNO- + Cl-<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q11' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q11.<\/b> 酸性条件下 CNO- 继续被 ClO- 氧化为 N2 和 CO2，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q11' value='0'> 2CNO- + 3ClO- + 2H+ → N2↑ + 2CO2↑ + 3Cl- + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q11' value='1'> 2CNO- + 3ClO- + H2O → N2↑ + 2CO2↑ + 3Cl- + 2OH-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q11' value='2'> CNO- + ClO- + H+ → N2↑ + CO2↑ + Cl- + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q11' value='3'> 2CNO- + 2ClO- + 2H+ → N2↑ + 2CO2↑ + 2Cl- + H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q12' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q12.<\/b> 丙烷燃料电池以熔融碳酸盐为电解质，正极反应式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q12' value='0'> O2 + 2CO2 + 4e- → 2CO3^2-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q12' value='1'> O2 + 4e- → 2O^2-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q12' value='2'> O2 + 2H2O + 4e- → 4OH-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q12' value='3'> CO3^2- + H2O → CO2 + 2OH-<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q13' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q13.<\/b> 镁着火不能用 CO2 灭火，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q13' value='0'> 2Mg + CO2 → 2MgO + C<\/label><label class='quiz-opt'><input type='radio' name='ch01-q13' value='1'> Mg + CO2 → MgO + CO<\/label><label class='quiz-opt'><input type='radio' name='ch01-q13' value='2'> Mg + 2CO2 → MgO + 2CO<\/label><label class='quiz-opt'><input type='radio' name='ch01-q13' value='3'> 2Mg + 2CO2 → 2MgO + C2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q14' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q14.<\/b> AgCl 白色沉淀遇 KBr 转化为淡黄色沉淀，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q14' value='0'> AgCl(s) + Br- → AgBr(s) + Cl-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q14' value='1'> AgCl + Br- → AgBr + Cl<\/label><label class='quiz-opt'><input type='radio' name='ch01-q14' value='2'> Ag+ + Br- → AgBr↓<\/label><label class='quiz-opt'><input type='radio' name='ch01-q14' value='3'> AgCl + KBr → AgBr + KCl<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q15' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q15.<\/b> 酸性条件下 MnO4- 氧化 C2O4^2-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q15' value='0'> 2MnO4- + 5C2O4^2- + 16H+ → 2Mn2+ + 10CO2↑ + 8H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q15' value='1'> 2MnO4- + 5C2O4^2- + 8H+ → 2Mn2+ + 10CO2↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q15' value='2 quiz-item' data-qid='ch01-q11' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q11.<\/b> 酸性条件下 CNO- 继续被 ClO- 氧化为 N2 和 CO2，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q11' value='0'> 2CNO- + 3ClO- + 2H+ → N2↑ + 2CO2↑ + 3Cl- + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q11' value='1'> 2CNO- + 3ClO- + H2O → N2↑ + 2CO2↑ + 3Cl- + 2OH-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q11' value='2'> CNO- + ClO- + H+ → N2↑ + CO2↑ + Cl- + H2O<\/label><label class='quiz-opt'><input type='radio' name='ch01-q11' value='3'> 2CNO- + 2ClO- + 2H+ → N2↑ + 2CO2↑ + 2Cl- + H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q12' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q12.<\/b> 丙烷燃料电池以熔融碳酸盐为电解质，正极反应式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q12' value='0'> O2 + 2CO2 + 4e- → 2CO3^2-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q12' value='1'> O2 + 4e- → 2O^2-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q12' value='2'> O2 + 2H2O + 4e- → 4OH-<\/label><label class='quiz-opt'><input type='radio' name='ch01-q12' value='3'> CO3^2- + H2O → CO2 + 2OH-<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q13' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q13.<\/b> 镁着火不能用 CO2 灭火，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q13' value='0'> 2Mg + CO2 → 2MgO + C<\/label><label class='quiz-opt'><input type='radio' name='ch01-q13' value='1'> Mg + CO2 → MgO + CO<\/label><label class='quiz-opt'><input type='radio' name='ch01-q13' value='2'> Mg + 2CO2 → MgO + 2CO
