<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>陌生方程式：诊断与训练</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/picocss/2.0.6/dist/css/pico.min.css">
<link rel="stylesheet" href="https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>陌生方程式：诊断与训练</h1>
    <div class="sub">把一份题型讲义变成能倒推根因的诊断系统</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>
<script>
const DATA = {"manifest": {"slug": "equation-diagnosis", "title": "陌生方程式：诊断与训练", "subtitle": "把一份题型讲义变成能倒推根因的诊断系统", "book": {"title": "陌生方程式的书写查缺补漏", "author": "高中化学讲义（整理）", "source": ["陌生方程式的书写查缺补漏.docx"]}, "audience": "已学完离子反应与氧化还原，准备应试", "goal": "掌握信息型、离子型、电极型方程式的书写与配平，答错能倒推根因", "learningPath": [{"step": "01", "title": "先学五步法", "chapterIds": ["ch01"], "checkpoint": "能复述五步并写出 2 个陌生方程式"}, {"step": "02", "title": "做题诊断", "chapterIds": ["ch01"], "checkpoint": "诊断测试答对 4/5"}], "chapters": [{"id": "ch01", "title": "第 1 章：陌生方程式书写的五步法", "file": "chapters/ch01-陌生方程式五步法.md", "difficulty": 3, "source": "《陌生方程式的书写查缺补漏》增分点一至三", "prerequisites": []}], "concepts": [{"id": "c01", "title": "陌生方程式五步法", "file": "concepts/c01-五步法.md", "chapterIds": ["ch01"], "difficulty": "进阶", "source": "《陌生方程式的书写查缺补漏》", "prerequisites": []}], "glossary": [{"term": "信息型方程式", "def": "题干给出现象或流程，需要自己推断产物的方程式", "chapterId": "ch01"}, {"term": "电荷守恒", "def": "离子方程式左右两边电荷代数和相等", "chapterId": "ch01"}, {"term": "电子守恒", "def": "氧化还原中得失电子总数相等", "chapterId": "ch01"}, {"term": "电极反应式", "def": "只写正极或负极（阳极或阴极）的半反应式", "chapterId": "ch01"}, {"term": "熔融碳酸盐环境", "def": "燃料电池中以 CO3^2- 为载流子的电解质环境", "chapterId": "ch01"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "Na2S2O3 在酸性溶液中分解，生成黄色沉淀和刺激性气体，离子方程式是？", "options": ["S2O3^2- + 2H+ → S↓ + SO2↑ + H2O", "S2O3^2- + H+ → S↓ + SO2↑ + H2O", "S2O3^2- + 2H+ → S↓ + SO3^2- + H2O", "S2O3^2- + 2H+ → H2S↑ + SO2↑ + H2O"], "answer": 0, "explain": "S 歧化为 0 价和 +4 价，补 2H+ 和 1H2O，电荷 -2+2=0。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q02", "chapterId": "ch01", "type": "single", "question": "Na2S2O3 被 Cl2 氧化为 SO4^2-，离子方程式是？", "options": ["S2O3^2- + 4Cl2 + 5H2O → 2SO4^2- + 8Cl- + 10H+", "S2O3^2- + 2Cl2 + 3H2O → 2SO4^2- + 4Cl- + 6H+", "S2O3^2- + 4Cl2 + 3H2O → 2SO4^2- + 8Cl- + 6H+", "S2O3^2- + Cl2 + H2O → SO4^2- + 2Cl- + 2H+"], "answer": 0, "explain": "两个 S 共失 8e，需要 4 个 Cl2；补 5H2O 和 10H+ 后电荷 -2 对 -2。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q03", "chapterId": "ch01", "type": "single", "question": "NaBH4 与水反应生成 NaBO2 和 H2，化学方程式是？", "options": ["NaBH4 + 2H2O → NaBO2 + 4H2↑", "NaBH4 + H2O → NaBO2 + 2H2↑", "NaBH4 + 3H2O → NaBO2 + 5H2↑", "NaBH4 + 2H2O → NaOH + B(OH)3 + 2H2↑"], "answer": 0, "explain": "Na1、B1、O2；H 左边 4+4=8，右边 4H2=8。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q04", "chapterId": "ch01", "type": "single", "question": "硫与热的 NaOH 溶液反应，产物中硫的最高价为 +4，离子方程式是？", "options": ["3S + 6OH- → 2S^2- + SO3^2- + 3H2O", "3S + 6OH- → 2S^2- + SO4^2- + 3H2O", "S + 2OH- → S^2- + H2O", "2S + 4OH- → S^2- + SO2↑ + 2H2O"], "answer": 0, "explain": "S 歧化：2 个降到 -2，1 个升到 +4；电荷左边 -6，右边 -4-2=-6。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q05", "chapterId": "ch01", "type": "single", "question": "NaClO3 与盐酸反应生成 ClO2，化学方程式是？", "options": ["2NaClO3 + 4HCl → 2ClO2↑ + Cl2↑ + 2NaCl + 2H2O", "NaClO3 + 2HCl → ClO2↑ + Cl2↑ + NaCl + H2O", "2NaClO3 + 2HCl → 2ClO2↑ + 2NaCl + H2O", "NaClO3 + 6HCl → ClO2↑ + 3Cl2↑ + NaCl + 3H2O"], "answer": 0, "explain": "2 个 Cl(+5) 得 2e，2 个 Cl(-1) 失 2e 生成 Cl2；补 2NaCl 和 2H2O。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q06", "chapterId": "ch01", "type": "single", "question": "足量铁粉与稀硝酸反应生成 NO，化学方程式是？", "options": ["Fe + 4HNO3(稀) → Fe(NO3)3 + NO↑ + 2H2O", "Fe + 4HNO3(稀) → Fe(NO3)2 + 2NO2↑ + 2H2O", "3Fe + 8HNO3(稀) → 3Fe(NO3)2 + 2NO↑ + 4H2O", "Fe + 2HNO3(稀) → Fe(NO3)2 + H2↑"], "answer": 0, "explain": "Fe 0→+3 失 3e，N +5→+2 得 3e，1:1；再补 3 个 NO3- 和 2H2O。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q07", "chapterId": "ch01", "type": "single", "question": "酸性溶液中 Ca(NO2)2 分解产生 NO，离子方程式是？", "options": ["3NO2- + 2H+ → 2NO↑ + NO3- + H2O", "2NO2- + 2H+ → NO↑ + NO3- + H2O", "NO2- + H+ → NO↑ + OH-", "3NO2- + 2H+ → 2NO↑ + NO3- + 2H2O"], "answer": 0, "explain": "N 歧化：2 个降到 +2，1 个升到 +5；电荷 -3+2=-1 对 -1。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q08", "chapterId": "ch01", "type": "single", "question": "H3AsO3 被 MnO2 氧化为 H3AsO4，离子方程式是？", "options": ["H3AsO3 + MnO2 + 2H+ → H3AsO4 + Mn2+ + H2O", "H3AsO3 + MnO2 → H3AsO4 + Mn2+ + H2O", "H3AsO3 + MnO2 + 4H+ → H3AsO4 + Mn2+ + 2H2O", "2H3AsO3 + MnO2 → 2H3AsO4 + Mn2+"], "answer": 0, "explain": "As +3→+5 失 2e，Mn +4→+2 得 2e，1:1；补 2H+ 和 1H2O。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q09", "chapterId": "ch01", "type": "single", "question": "K4[Fe(CN)6] 爆炸分解，生成 KCN 和三种稳定单质，化学方程式是？", "options": ["K4[Fe(CN)6] → 4KCN + Fe + 2C + N2↑", "K4[Fe(CN)6] → 4KCN + Fe + C + N2↑", "K4[Fe(CN)6] → 2KCN + Fe + 2C + 2N2↑", "K4[Fe(CN)6] → 4KCN + FeC2 + N2↑"], "answer": 0, "explain": "三种单质是 Fe、C、N2；C 6=4+2，N 6=4+2。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q10", "chapterId": "ch01", "type": "single", "question": "碱性条件下 ClO- 将 CN- 氧化为 CNO-，离子方程式是？", "options": ["CN- + ClO- → CNO- + Cl-", "CN- + 2ClO- → CNO- + 2Cl-", "CN- + ClO- + H2O → CNO- + Cl- + 2H+", "2CN- + ClO- → 2CNO- + Cl-"], "answer": 0, "explain": "C +2→+4 失 2e，Cl +1→-1 得 2e，1:1；原子和电荷都平。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q11", "chapterId": "ch01", "type": "single", "question": "酸性条件下 CNO- 继续被 ClO- 氧化为 N2 和 CO2，离子方程式是？", "options": ["2CNO- + 3ClO- + 2H+ → N2↑ + 2CO2↑ + 3Cl- + H2O", "2CNO- + 3ClO- + H2O → N2↑ + 2CO2↑ + 3Cl- + 2OH-", "CNO- + ClO- + H+ → N2↑ + CO2↑ + Cl- + H2O", "2CNO- + 2ClO- + 2H+ → N2↑ + 2CO2↑ + 2Cl- + H2O"], "answer": 0, "explain": "N -3→0 共失 6e，3 个 ClO- 共得 6e；O 左边 2+3=5，右边 4+1=5。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q12", "chapterId": "ch01", "type": "single", "question": "丙烷燃料电池以熔融碳酸盐为电解质，正极反应式是？", "options": ["O2 + 2CO2 + 4e- → 2CO3^2-", "O2 + 4e- → 2O^2-", "O2 + 2H2O + 4e- → 4OH-", "CO3^2- + H2O → CO2 + 2OH-"], "answer": 0, "explain": "正极 O2 得电子，在碳酸盐环境中与 CO2 结合生成 CO3^2-；电荷 -4 对 -4。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q13", "chapterId": "ch01", "type": "single", "question": "镁着火不能用 CO2 灭火，化学方程式是？", "options": ["2Mg + CO2 → 2MgO + C", "Mg + CO2 → MgO + CO", "Mg + 2CO2 → MgO + 2CO", "2Mg + 2CO2 → 2MgO + C2"], "answer": 0, "explain": "Mg 0→+2 失 4e，C +4→0 得 4e；2:1 配平。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q14", "chapterId": "ch01", "type": "single", "question": "AgCl 白色沉淀遇 KBr 转化为淡黄色沉淀，离子方程式是？", "options": ["AgCl(s) + Br- → AgBr(s) + Cl-", "AgCl + Br- → AgBr + Cl", "Ag+ + Br- → AgBr↓", "AgCl + KBr → AgBr + KCl"], "answer": 0, "explain": "沉淀转化；AgCl 难溶写化学式不拆，K+ 是旁观离子。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q15", "chapterId": "ch01", "type": "single", "question": "酸性条件下 MnO4- 氧化 C2O4^2-，离子方程式是？", "options": ["2MnO4- + 5C2O4^2- + 16H+ → 2Mn2+ + 10CO2↑ + 8H2O", "2MnO4- + 5C2O4^2- + 8H+ → 2Mn2+ + 10CO2↑ + 4H2O", "MnO4- + C2O4^2- + 8H+ → Mn2+ + 2CO2↑ + 4H2O", "2MnO4- + 3C2O4^2- + 12H+ → 2Mn2+ + 6CO2↑ + 6H2O"], "answer": 0, "explain": "Mn 得 5e×2=10e，5 个 C2O4^2- 失 10e；补 16H+ 和 8H2O 后电荷 +4 对 +4。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q16", "chapterId": "ch01", "type": "single", "question": "NH3 与 NO2 反应生成 N2 和 H2O，化学方程式是？", "options": ["8NH3 + 6NO2 → 7N2 + 12H2O", "4NH3 + 6NO2 → 5N2 + 6H2O", "8NH3 + 6NO2 → 7N2 + 6H2O", "2NH3 + 3NO2 → 3N2 + 2H2O"], "answer": 0, "explain": "N 从 -3 和 +4 归中到 0；N 8+6=14，7N2=14，H 24=24。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q17", "chapterId": "ch01", "type": "single", "question": "少量 NH3 与过量 Cl2 反应生成酸性气体和 NCl3，化学方程式是？", "options": ["NH3 + 3Cl2 → NCl3 + 3HCl", "NH3 + Cl2 → NCl3 + HCl", "2NH3 + 3Cl2 → 2NCl3 + 3H2", "NH3 + 2Cl2 → NCl2 + 2HCl"], "answer": 0, "explain": "N -3→+3 失 6e，3 个 Cl2 共得 6e；NCl3 中 N、Cl 均满足 8 电子结构。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q18", "chapterId": "ch01", "type": "single", "question": "酸性条件下 Cr2O7^2- 氧化 SO3^2- 为 SO4^2-，离子方程式是？", "options": ["Cr2O7^2- + 3SO3^2- + 8H+ → 2Cr3+ + 3SO4^2- + 4H2O", "Cr2O7^2- + 3SO3^2- + 6H+ → 2Cr3+ + 3SO4^2- + 3H2O", "Cr2O7^2- + SO3^2- + 8H+ → 2Cr3+ + SO4^2- + 4H2O", "Cr2O7^2- + 3SO3^2- + 14H+ → 2Cr3+ + 3SO4^2- + 7H2O"], "answer": 0, "explain": "Cr 得 3e×2=6e，S 失 2e×3=6e；补 8H+ 和 4H2O 后电荷 0 对 0。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q19", "chapterId": "ch01", "type": "single", "question": "CeO2 在稀硫酸和 H2O2 作用下生成 Ce3+，化学方程式是？", "options": ["2CeO2 + H2O2 + 3H2SO4 → Ce2(SO4)3 + O2↑ + 4H2O", "CeO2 + H2O2 + H2SO4 → CeSO4 + O2↑ + 2H2O", "2CeO2 + H2O2 + 2H2SO4 → Ce2(SO4)3 + O2↑ + 2H2O", "CeO2 + H2O2 + 2H2SO4 → Ce(SO4)2 + 3H2O"], "answer": 0, "explain": "Ce +4→+3 得 1e×2=2e；H2O2 中 O -1→0 失 2e；补 3H2SO4 成盐。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q20", "chapterId": "ch01", "type": "blank", "question": "EDTA 滴定：2.6826 g 样品配成 250 mL，取 25.00 mL 用 0.04000 mol/L EDTA 消耗 25.50 mL，NiSO4·nH2O 的 n 是多少？（填整数）", "options": [], "answer": "6", "explain": "25.00 mL 中 Ni2+ 为 0.04000×0.02550=1.020×10^-3 mol，250 mL 中 1.020×10^-2 mol；M=2.6826/0.01020=263.0，减去 NiSO4 的 154.75 得 108.2，除以 18.02 得 6。", "relatedConceptId": "c01", "optionMisconceptions": []}, {"id": "q21", "chapterId": "ch01", "type": "blank", "question": "金属钠与 H2 反应生成甲，4.80 g 甲完全分解得到 2.24 L（标况）H2，甲的化学式是？", "options": [], "answer": "NaH", "explain": "2.24 L H2 为 0.1 mol，含 H 0.2 mol；4.80 g 中 Na 为 0.2 mol（4.6 g），H 0.2 mol（0.2 g），故为 NaH。", "relatedConceptId": "c01", "optionMisconceptions": []}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "陌生方程式书写的五步法：一句话核心是什么？", "back": "陌生方程式靠信息、类型、产物、配平、检查这条固定流水线推出来。", "tags": ["ch01"]}, {"id": "f02", "chapterId": "ch01", "front": "陌生方程式书写的五步法最容易错在哪？", "back": "产物多数要自己推，题里不会全给。", "tags": ["ch01", "易错"]}], "companion": "学习伴侣.html"}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：《陌生方程式的书写查缺补漏》增分点一至三<\/div><h1>第 1 章：陌生方程式书写的五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：入门篇第 4、6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n从一段陌生信息里提取反应物、产物、环境和价态；\n<\/li><li>\n判断该写化学方程式、离子方程式还是电极反应式；\n<\/li><li>\n按五步法配平并检查电荷、原子、条件；\n<\/li><li>\n避开&quot;该拆不拆、该标不标、电荷不平&quot;三类高频失分点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>陌生方程式不是靠背，而是靠&quot;信息 → 类型 → 产物 → 配平 → 检查&quot;这条固定流水线，一步一步推出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：第一步，把信息拆成四件事（难度：基础）<\/h3>\n<p>拿到题先划四样东西：<\/p>\n<ul><li>\n<strong>反应物<\/strong>：谁和谁反应，注意&quot;少量&quot;&quot;过量&quot;&quot;适量&quot;。\n<\/li><li>\n<strong>产物线索<\/strong>：题里明说的产物、颜色变化、气体、沉淀。\n<\/li><li>\n<strong>环境<\/strong>：酸性、碱性、中性，还是熔融盐、水溶液。\n<\/li><li>\n<strong>价态变化<\/strong>：有没有元素化合价升降，这是判断氧化还原的关键。\n<\/ul>\n<p>例：&quot;向含碘废液中加入稍过量的 Na₂SO₃ 溶液，将 I₂ 还原为 I⁻&quot;。反应物 I₂、SO₃²⁻；产物 I⁻、SO₄²⁻；环境水溶液；S 从 +4 升到 +6，I 从 0 降到 −1，是氧化还原。<\/p>\n<h3>概念 2：第二步，判断反应类型（难度：进阶）<\/h3>\n<p>三类方程式，写法不同：<\/p>\n<ul><li>\n<strong>化学方程式<\/strong>：写完整化学式，标状态和条件。\n<\/li><li>\n<strong>离子方程式<\/strong>：可溶强电解质拆成离子，难溶物、气体、水、弱电解质不拆。\n<\/li><li>\n<strong>电极反应式<\/strong>：分正负极（或阴阳极），标电子得失，注意电解质环境（酸性/碱性/熔融碳酸盐）。\n<\/ul>\n<p>判断依据是题目问什么。问&quot;离子方程式&quot;就不能写化学方程式；问&quot;正极反应式&quot;就不能写总反应。<\/p>\n<h3>概念 3：第三步，定产物（难度：高难）<\/h3>\n<p>产物不能瞎猜，按三条线索定：<\/p>\n<ol><li>\n<strong>价态守恒<\/strong>：氧化还原中，升多少、降多少要配平。常见产物：Fe²⁺/Fe³⁺、Mn²⁺/MnO₂、Cr³⁺/Cr₂O₇²⁻、SO₂/SO₄²⁻、NO/NO₃⁻。\n<\/li><li>\n<strong>环境守恒<\/strong>：酸性条件补 H⁺ 和 H₂O；碱性条件补 OH⁻ 和 H₂O；熔融碳酸盐中补 CO₃²⁻ 和 CO₂。\n<\/li><li>\n<strong>元素守恒<\/strong>：C、N、S 等元素的去向要合理，比如 CN⁻ 被氧化成 CNO⁻ 再进一步氧化成 N₂ 和 CO₂。\n<\/ol>\n<h3>概念 4：第四步，配平（难度：高难）<\/h3>\n<p>配平顺序：先电子，再原子，最后电荷。<\/p>\n<p>以酸性条件下 KMnO₄ 氧化 H₂C₂O₄ 为例：<\/p>\n<ol><li>\n标价：Mn +7→+2（得 5e），C +3→+4（每个 C 失 1e，H₂C₂O₄ 有两个 C，共失 2e）。\n<\/li><li>\n电子守恒：2MnO₄⁻ 得 10e，需要 5H₂C₂O₄ 失 10e。\n<\/li><li>\n配原子：2MnO₄⁻ + 5H₂C₂O₄ → 2Mn²⁺ + 10CO₂。\n<\/li><li>\n补 H⁺ 和 H₂O：左边 10 个 H，右边需要 10H⁺？先数 O：左边 8 + 20 = 28，右边 20，差 8 个 O，补 8H₂O 在右边；H 左边 10，右边 10H⁺ + 16H（8H₂O）= 26，不平。重算：2MnO₄⁻ + 5H₂C₂O₄ + 6H⁺ → 2Mn²⁺ + 10CO₂ + 8H₂O。\n<p>检查：Mn2，C10，O 8+20=28 → 20+8=28；H 10+6=16 → 16；电荷 −2−6+6=−2，右边 +4−? 2Mn²⁺ = +4，电荷 +4，不平。调整 H⁺：需要 −2 + x = +4 → x = 6，已写 6H⁺，左边电荷 −2 + 6 = +4，右边 +4，平。H：左边 10+6=16，右边 8H₂O=16，平。正确：2MnO₄⁻ + 5H₂C₂O₄ + 6H⁺ → 2Mn²⁺ + 10CO₂↑ + 8H₂O。<\/p>\n<\/ol>\n<p>这段推导说明：配平不是一次成功，数是靠&quot;电荷平&quot;倒推 H⁺ 个数。考试时按这个顺序检查，比死记系数可靠。<\/p>\n<h3>概念 5：第五步，检查四件事（难度：进阶）<\/h3>\n<ol><li>\n<strong>原子守恒<\/strong>：每种元素左右相等。\n<\/li><li>\n<strong>电荷守恒<\/strong>：离子方程式左右电荷代数和相等。\n<\/li><li>\n<strong>电子守恒<\/strong>：氧化还原得失电子总数相等。\n<\/li><li>\n<strong>符号规范<\/strong>：气体 ↑、沉淀 ↓、条件（点燃、加热、催化剂）、可逆号。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[读题] --&gt; B[提取反应物 产物 环境 价态]\n  B --&gt; C{反应类型}\n  C --&gt;|无价态变化| D[化学/离子方程式]\n  C --&gt;|有价态变化| E[氧化还原配平]\n  D --&gt; F[拆写规则]\n  E --&gt; G[电子守恒 补H+/OH-]\n  F --&gt; H[检查原子 电荷]\n  G --&gt; H\n  H --&gt; I[标条件与符号]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条分支的区别只在&quot;有没有价态变化&quot;。有价态变化的题，电子守恒是主线；没有的题，拆写规则是主线。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：写陌生方程式像拼装家具。说明书只给几张图（题目信息），你得先认出零件（反应物）、看明白成品长什么样（产物线索）、按装配顺序装（配平）、最后检查螺丝有没有拧紧（守恒检查）。这个类比在&quot;产物需要自己推断&quot;这一点上要补一句：家具图给了成品，化学题常常不给，要靠价态和环境推。<\/p>\n<p>实例：写出 Na₂S₂O₃ 在酸性溶液中分解的离子方程式。 信息：S₂O₃²⁻ 在酸性条件下不稳定，生成黄色沉淀（硫）和刺激性气体（SO₂）。 价态：S 平均 +2，一部分升到 +4（SO₂），一部分降到 0（S）。 配平：S₂O₃²⁻ → S + SO₂，先让 S 守恒：S₂O₃²⁻ → S + SO₂ 已有 2 个 S；O 3 → 2，差 1 个 O，补 H₂O；H 补 H⁺。 S₂O₃²⁻ + 2H⁺ → S↓ + SO₂↑ + H₂O。检查：S2，O3=2+1，H2，电荷 −2+2=0。正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;题里没说的产物不能写&quot;——产物常常要自己推，推的依据是价态、环境、元素守恒。\n<\/li><li>\n别以为&quot;离子方程式里所有化合物都要拆&quot;——难溶物、气体、水、弱电解质、氧化物不拆。\n<\/li><li>\n别以为&quot;配平只要原子平就行&quot;——离子方程式还必须电荷平，氧化还原还必须电子平。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出 Cl₂ 在碱性条件下氧化 CN⁻ 为 CNO⁻ 的离子方程式。\n<p>（答案：CN⁻ + ClO⁻ → CNO⁻ + Cl⁻；解析：Cl₂ 在碱性条件下先生成 ClO⁻，Cl 从 0 降到 −1，C 从 +2 升到 +4，1:1 配平。）<\/p>\n<\/ol>\n<ol><li>\n写出酸性条件下 MnO₂ 氧化 H₃AsO₃ 的离子方程式。\n<p>（答案：H₃AsO₃ + MnO₂ + 2H⁺ → H₃AsO₄ + Mn²⁺ + H₂O；解析：As +3→+5 失 2e，Mn +4→+2 得 2e，1:1；补 2H⁺ 和 1H₂O。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;离子方程式两边只要原子守恒，电荷可以不守恒。&quot;\n<p>（答案：不对。电荷必须守恒，这是离子方程式的硬性要求。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步：读信息 → 判类型 → 定产物 → 配平 → 检查。\n<\/li><li>\n酸性补 H⁺，碱性补 OH⁻，熔融碳酸盐补 CO₃²⁻。\n<\/li><li>\n三守恒：原子、电荷、电子。\n<\/ul>", "kind": "chapter", "title": "第 1 章：陌生方程式书写的五步法"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：《陌生方程式的书写查缺补漏》<\/div><h1>陌生方程式五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把陌生方程式拆成&quot;读信息 → 判类型 → 定产物 → 配平 → 检查&quot;五个固定步骤，按顺序推进。<\/p>\n<h2>为什么重要<\/h2>\n<p>考试里的方程式题，90% 不是不会化学，而是漏了某一步：产物猜错、该拆没拆、电荷不平。固定流程能把&quot;凭感觉&quot;变成&quot;按清单核对&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[读信息] --&gt; B[判类型]\n  B --&gt; C[定产物]\n  C --&gt; D[配平]\n  D --&gt; E[检查]\n  E --&gt;|不过| C\n  E --&gt;|通过| F[写答案]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>读信息时划四样：反应物、产物线索、环境、价态。这一步决定后面所有判断。<\/p>\n<p>判类型：问化学方程式、离子方程式还是电极反应式。类型不同，拆写和符号规则不同。<\/p>\n<p>定产物：氧化还原看价态升降，非氧化还原看复分解条件（沉淀、气体、水），电极反应看电解质环境。<\/p>\n<p>配平：先电子守恒，再原子守恒，最后电荷守恒。酸性补 H⁺，碱性补 OH⁻，熔融碳酸盐补 CO₃²⁻。<\/p>\n<p>检查：原子、电荷、电子、符号四件事。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;产物题里没写就不能写&quot;——多数产物要自己推。\n<\/li><li>\n别以为&quot;配平一次就能成&quot;——电荷不平就回去改 H⁺/OH⁻ 个数。\n<\/li><li>\n别以为&quot;写对就行，符号无所谓&quot;——气体、沉淀、条件都是得分点。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>陌生第 1 章<\/td><td>五步法<\/td><td>固定流程<\/td><\/tr><tr><td>入门第 4、6、7 章<\/td><td>基础<\/td><td>配平、拆写、氧化还原<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：离子方程式、氧化还原\n<\/li><li>\n后续：电极反应、工艺流程题\n<\/ul>", "kind": "concept", "title": "陌生方程式五步法"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先学五步法<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：陌生方程式书写的五步法<\/a><br>检查点：能复述五步并写出 2 个陌生方程式<\/li><li class='path-step' id='path-02'><strong>步骤 02：做题诊断<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：陌生方程式书写的五步法<\/a><br>检查点：诊断测试答对 4/5<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：陌生方程式书写的五步法<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> Na2S2O3 在酸性溶液中分解，生成黄色沉淀和刺激性气体，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> S2O3^2- + 2H+ → S↓ + SO2↑ + H2O<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> S2O3^2- + H+ → S↓ + SO2↑ + H2O<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> S2O3^2- + 2H+ → S↓ + SO3^2- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> S2O3^2- + 2H+ → H2S↑ + SO2↑ + H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> Na2S2O3 被 Cl2 氧化为 SO4^2-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> S2O3^2- + 4Cl2 + 5H2O → 2SO4^2- + 8Cl- + 10H+<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> S2O3^2- + 2Cl2 + 3H2O → 2SO4^2- + 4Cl- + 6H+<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> S2O3^2- + 4Cl2 + 3H2O → 2SO4^2- + 8Cl- + 6H+<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> S2O3^2- + Cl2 + H2O → SO4^2- + 2Cl- + 2H+<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> NaBH4 与水反应生成 NaBO2 和 H2，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> NaBH4 + 2H2O → NaBO2 + 4H2↑<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> NaBH4 + H2O → NaBO2 + 2H2↑<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> NaBH4 + 3H2O → NaBO2 + 5H2↑<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> NaBH4 + 2H2O → NaOH + B(OH)3 + 2H2↑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 硫与热的 NaOH 溶液反应，产物中硫的最高价为 +4，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 3S + 6OH- → 2S^2- + SO3^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 3S + 6OH- → 2S^2- + SO4^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> S + 2OH- → S^2- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 2S + 4OH- → S^2- + SO2↑ + 2H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q5.<\/b> NaClO3 与盐酸反应生成 ClO2，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 2NaClO3 + 4HCl → 2ClO2↑ + Cl2↑ + 2NaCl + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> NaClO3 + 2HCl → ClO2↑ + Cl2↑ + NaCl + H2O<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 2NaClO3 + 2HCl → 2ClO2↑ + 2NaCl + H2O<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> NaClO3 + 6HCl → ClO2↑ + 3Cl2↑ + NaCl + 3H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q6.<\/b> 足量铁粉与稀硝酸反应生成 NO，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> Fe + 4HNO3(稀) → Fe(NO3)3 + NO↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> Fe + 4HNO3(稀) → Fe(NO3)2 + 2NO2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 3Fe + 8HNO3(稀) → 3Fe(NO3)2 + 2NO↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> Fe + 2HNO3(稀) → Fe(NO3)2 + H2↑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q7.<\/b> 酸性溶液中 Ca(NO2)2 分解产生 NO，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 3NO2- + 2H+ → 2NO↑ + NO3- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 2NO2- + 2H+ → NO↑ + NO3- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> NO2- + H+ → NO↑ + OH-<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 3NO2- + 2H+ → 2NO↑ + NO3- + 2H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q8.<\/b> H3AsO3 被 MnO2 氧化为 H3AsO4，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> H3AsO3 + MnO2 + 2H+ → H3AsO4 + Mn2+ + H2O<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> H3AsO3 + MnO2 → H3AsO4 + Mn2+ + H2O<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> H3AsO3 + MnO2 + 4H+ → H3AsO4 + Mn2+ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 2H3AsO3 + MnO2 → 2H3AsO4 + Mn2+<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q9.<\/b> K4[Fe(CN)6] 爆炸分解，生成 KCN 和三种稳定单质，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> K4[Fe(CN)6] → 4KCN + Fe + 2C + N2↑<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> K4[Fe(CN)6] → 4KCN + Fe + C + N2↑<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> K4[Fe(CN)6] → 2KCN + Fe + 2C + 2N2↑<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> K4[Fe(CN)6] → 4KCN + FeC2 + N2↑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q10.<\/b> 碱性条件下 ClO- 将 CN- 氧化为 CNO-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> CN- + ClO- → CNO- + Cl-<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> CN- + 2ClO- → CNO- + 2Cl-<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> CN- + ClO- + H2O → CNO- + Cl- + 2H+<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 2CN- + ClO- → 2CNO- + Cl-<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q11.<\/b> 酸性条件下 CNO- 继续被 ClO- 氧化为 N2 和 CO2，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 2CNO- + 3ClO- + 2H+ → N2↑ + 2CO2↑ + 3Cl- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 2CNO- + 3ClO- + H2O → N2↑ + 2CO2↑ + 3Cl- + 2OH-<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> CNO- + ClO- + H+ → N2↑ + CO2↑ + Cl- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 2CNO- + 2ClO- + 2H+ → N2↑ + 2CO2↑ + 2Cl- + H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q12.<\/b> 丙烷燃料电池以熔融碳酸盐为电解质，正极反应式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> O2 + 2CO2 + 4e- → 2CO3^2-<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> O2 + 4e- → 2O^2-<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> O2 + 2H2O + 4e- → 4OH-<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> CO3^2- + H2O → CO2 + 2OH-<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q13.<\/b> 镁着火不能用 CO2 灭火，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 2Mg + CO2 → 2MgO + C<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> Mg + CO2 → MgO + CO<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> Mg + 2CO2 → MgO + 2CO<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 2Mg + 2CO2 → 2MgO + C2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q14.<\/b> AgCl 白色沉淀遇 KBr 转化为淡黄色沉淀，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> AgCl(s) + Br- → AgBr(s) + Cl-<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> AgCl + Br- → AgBr + Cl<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> Ag+ + Br- → AgBr↓<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> AgCl + KBr → AgBr + KCl<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q15.<\/b> 酸性条件下 MnO4- 氧化 C2O4^2-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 2MnO4- + 5C2O4^2- + 16H+ → 2Mn2+ + 10CO2↑ + 8H2O<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 2MnO4- + 5C2O4^2- + 8H+ → 2Mn2+ + 10CO2↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> MnO4- + C2O4^2- + 8H+ → Mn2+ + 2CO2↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 2MnO4- + 3C2O4^2- + 12H+ → 2Mn2+ + 6CO2↑ + 6H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q16.<\/b> NH3 与 NO2 反应生成 N2 和 H2O，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 8NH3 + 6NO2 → 7N2 + 12H2O<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 4NH3 + 6NO2 → 5N2 + 6H2O<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 8NH3 + 6NO2 → 7N2 + 6H2O<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 2NH3 + 3NO2 → 3N2 + 2H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q17.<\/b> 少量 NH3 与过量 Cl2 反应生成酸性气体和 NCl3，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> NH3 + 3Cl2 → NCl3 + 3HCl<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> NH3 + Cl2 → NCl3 + HCl<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 2NH3 + 3Cl2 → 2NCl3 + 3H2<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> NH3 + 2Cl2 → NCl2 + 2HCl<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q18.<\/b> 酸性条件下 Cr2O7^2- 氧化 SO3^2- 为 SO4^2-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> Cr2O7^2- + 3SO3^2- + 8H+ → 2Cr3+ + 3SO4^2- + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> Cr2O7^2- + 3SO3^2- + 6H+ → 2Cr3+ + 3SO4^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> Cr2O7^2- + SO3^2- + 8H+ → 2Cr3+ + SO4^2- + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> Cr2O7^2- + 3SO3^2- + 14H+ → 2Cr3+ + 3SO4^2- + 7H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q19.<\/b> CeO2 在稀硫酸和 H2O2 作用下生成 Ce3+，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 2CeO2 + H2O2 + 3H2SO4 → Ce2(SO4)3 + O2↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> CeO2 + H2O2 + H2SO4 → CeSO4 + O2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 2CeO2 + H2O2 + 2H2SO4 → Ce2(SO4)3 + O2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> CeO2 + H2O2 + 2H2SO4 → Ce(SO4)2 + 3H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='blank' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q20.<\/b> EDTA 滴定：2.6826 g 样品配成 250 mL，取 25.00 mL 用 0.04000 mol/L EDTA 消耗 25.50 mL，NiSO4·nH2O 的 n 是多少？（填整数）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='blank' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q21.<\/b> 金属钠与 H2 反应生成甲，4.80 g 甲完全分解得到 2.24 L（标况）H2，甲的化学式是？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='信息型方程式'>信息型方程式 — 题干给出现象或流程，需要自己推断产物的方程式 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电荷守恒'>电荷守恒 — 离子方程式左右两边电荷代数和相等 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电子守恒'>电子守恒 — 氧化还原中得失电子总数相等 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电极反应式'>电极反应式 — 只写正极或负极（阳极或阴极）的半反应式 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='熔融碳酸盐环境'>熔融碳酸盐环境 — 燃料电池中以 CO3^2- 为载流子的电解质环境 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：五步流水线<\/h2>\n<p>读信息（反应物、产物线索、环境、价态）→ 判类型（化学式/离子式/电极式）→ 定产物（价态、环境、元素守恒）→ 配平（电子、原子、电荷）→ 检查（原子、电荷、电子、符号）。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n有化合价变化：先电子守恒，再配原子，最后用 H+ 或 OH- 调电荷。\n<\/li><li>\n酸性补 H+，碱性补 OH-，熔融碳酸盐补 CO3^2-。\n<\/li><li>\n离子方程式：难溶物、气体、水、弱电解质、氧化物一律不拆。\n<\/li><li>\n电极反应：先定正负极，再写半反应，最后按电解质环境补离子。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只数原子不管电荷。离子方程式电荷不平，一定错。\n<\/li><li>\n产物全靠猜。产物要由价态、环境、元素守恒三条线索推。\n<\/li><li>\n气体、沉淀符号漏标。符号也是得分点。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>五步<\/h2>\n<ol><li>\n读信息：反应物、产物线索、环境、价态\n<\/li><li>\n判类型：化学式 / 离子式 / 电极式\n<\/li><li>\n定产物：价态、环境、元素守恒\n<\/li><li>\n配平：电子 → 原子 → 电荷\n<\/li><li>\n检查：原子、电荷、电子、符号\n<\/ol>\n<h2>环境补项<\/h2>\n<table><thead><tr><th>环境<\/th><th>补什么<\/th><\/tr><\/thead><tbody><tr><td>酸性<\/td><td>H+ 和 H2O<\/td><\/tr><tr><td>碱性<\/td><td>OH- 和 H2O<\/td><\/tr><tr><td>熔融碳酸盐<\/td><td>CO3^2- 和 CO2<\/td><\/tr><\/tbody><\/table>\n<h2>高频产物<\/h2>\n<table><thead><tr><th>元素<\/th><th>常见产物<\/th><\/tr><\/thead><tbody><tr><td>Mn<\/td><td>Mn2+（酸性）、MnO2（中性/弱碱）<\/td><\/tr><tr><td>Cr<\/td><td>Cr3+（还原）、CrO4^2-（碱性氧化）<\/td><\/tr><tr><td>S<\/td><td>SO2、SO4^2-、S<\/td><\/tr><tr><td>N<\/td><td>NO、NO3-、N2<\/td><\/tr><tr><td>C<\/td><td>CO2、CO3^2-<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38453368250906626/化学知枢/05-陌生方程式诊断", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：陌生方程式书写的五步法", "href": "#/chapter/ch01"}]}, {"label": "概念", "children": [{"label": "陌生方程式五步法", "href": "#/concept/c01"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：陌生方程式书写的五步法", "href": "#/quiz/ch01"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：《陌生方程式的书写查缺补漏》增分点一至三<\/div><h1>第 1 章：陌生方程式书写的五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：1.5 小时 | <strong>前置<\/strong>：入门篇第 4、6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n从一段陌生信息里提取反应物、产物、环境和价态；\n<\/li><li>\n判断该写化学方程式、离子方程式还是电极反应式；\n<\/li><li>\n按五步法配平并检查电荷、原子、条件；\n<\/li><li>\n避开&quot;该拆不拆、该标不标、电荷不平&quot;三类高频失分点。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>陌生方程式不是靠背，而是靠&quot;信息 → 类型 → 产物 → 配平 → 检查&quot;这条固定流水线，一步一步推出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：第一步，把信息拆成四件事（难度：基础）<\/h3>\n<p>拿到题先划四样东西：<\/p>\n<ul><li>\n<strong>反应物<\/strong>：谁和谁反应，注意&quot;少量&quot;&quot;过量&quot;&quot;适量&quot;。\n<\/li><li>\n<strong>产物线索<\/strong>：题里明说的产物、颜色变化、气体、沉淀。\n<\/li><li>\n<strong>环境<\/strong>：酸性、碱性、中性，还是熔融盐、水溶液。\n<\/li><li>\n<strong>价态变化<\/strong>：有没有元素化合价升降，这是判断氧化还原的关键。\n<\/ul>\n<p>例：&quot;向含碘废液中加入稍过量的 Na₂SO₃ 溶液，将 I₂ 还原为 I⁻&quot;。反应物 I₂、SO₃²⁻；产物 I⁻、SO₄²⁻；环境水溶液；S 从 +4 升到 +6，I 从 0 降到 −1，是氧化还原。<\/p>\n<h3>概念 2：第二步，判断反应类型（难度：进阶）<\/h3>\n<p>三类方程式，写法不同：<\/p>\n<ul><li>\n<strong>化学方程式<\/strong>：写完整化学式，标状态和条件。\n<\/li><li>\n<strong>离子方程式<\/strong>：可溶强电解质拆成离子，难溶物、气体、水、弱电解质不拆。\n<\/li><li>\n<strong>电极反应式<\/strong>：分正负极（或阴阳极），标电子得失，注意电解质环境（酸性/碱性/熔融碳酸盐）。\n<\/ul>\n<p>判断依据是题目问什么。问&quot;离子方程式&quot;就不能写化学方程式；问&quot;正极反应式&quot;就不能写总反应。<\/p>\n<h3>概念 3：第三步，定产物（难度：高难）<\/h3>\n<p>产物不能瞎猜，按三条线索定：<\/p>\n<ol><li>\n<strong>价态守恒<\/strong>：氧化还原中，升多少、降多少要配平。常见产物：Fe²⁺/Fe³⁺、Mn²⁺/MnO₂、Cr³⁺/Cr₂O₇²⁻、SO₂/SO₄²⁻、NO/NO₃⁻。\n<\/li><li>\n<strong>环境守恒<\/strong>：酸性条件补 H⁺ 和 H₂O；碱性条件补 OH⁻ 和 H₂O；熔融碳酸盐中补 CO₃²⁻ 和 CO₂。\n<\/li><li>\n<strong>元素守恒<\/strong>：C、N、S 等元素的去向要合理，比如 CN⁻ 被氧化成 CNO⁻ 再进一步氧化成 N₂ 和 CO₂。\n<\/ol>\n<h3>概念 4：第四步，配平（难度：高难）<\/h3>\n<p>配平顺序：先电子，再原子，最后电荷。<\/p>\n<p>以酸性条件下 KMnO₄ 氧化 H₂C₂O₄ 为例：<\/p>\n<ol><li>\n标价：Mn +7→+2（得 5e），C +3→+4（每个 C 失 1e，H₂C₂O₄ 有两个 C，共失 2e）。\n<\/li><li>\n电子守恒：2MnO₄⁻ 得 10e，需要 5H₂C₂O₄ 失 10e。\n<\/li><li>\n配原子：2MnO₄⁻ + 5H₂C₂O₄ → 2Mn²⁺ + 10CO₂。\n<\/li><li>\n补 H⁺ 和 H₂O：左边 10 个 H，右边需要 10H⁺？先数 O：左边 8 + 20 = 28，右边 20，差 8 个 O，补 8H₂O 在右边；H 左边 10，右边 10H⁺ + 16H（8H₂O）= 26，不平。重算：2MnO₄⁻ + 5H₂C₂O₄ + 6H⁺ → 2Mn²⁺ + 10CO₂ + 8H₂O。\n<p>检查：Mn2，C10，O 8+20=28 → 20+8=28；H 10+6=16 → 16；电荷 −2−6+6=−2，右边 +4−? 2Mn²⁺ = +4，电荷 +4，不平。调整 H⁺：需要 −2 + x = +4 → x = 6，已写 6H⁺，左边电荷 −2 + 6 = +4，右边 +4，平。H：左边 10+6=16，右边 8H₂O=16，平。正确：2MnO₄⁻ + 5H₂C₂O₄ + 6H⁺ → 2Mn²⁺ + 10CO₂↑ + 8H₂O。<\/p>\n<\/ol>\n<p>这段推导说明：配平不是一次成功，数是靠&quot;电荷平&quot;倒推 H⁺ 个数。考试时按这个顺序检查，比死记系数可靠。<\/p>\n<h3>概念 5：第五步，检查四件事（难度：进阶）<\/h3>\n<ol><li>\n<strong>原子守恒<\/strong>：每种元素左右相等。\n<\/li><li>\n<strong>电荷守恒<\/strong>：离子方程式左右电荷代数和相等。\n<\/li><li>\n<strong>电子守恒<\/strong>：氧化还原得失电子总数相等。\n<\/li><li>\n<strong>符号规范<\/strong>：气体 ↑、沉淀 ↓、条件（点燃、加热、催化剂）、可逆号。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[读题] --&gt; B[提取反应物 产物 环境 价态]\n  B --&gt; C{反应类型}\n  C --&gt;|无价态变化| D[化学/离子方程式]\n  C --&gt;|有价态变化| E[氧化还原配平]\n  D --&gt; F[拆写规则]\n  E --&gt; G[电子守恒 补H+/OH-]\n  F --&gt; H[检查原子 电荷]\n  G --&gt; H\n  H --&gt; I[标条件与符号]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条分支的区别只在&quot;有没有价态变化&quot;。有价态变化的题，电子守恒是主线；没有的题，拆写规则是主线。<\/p>\n<h2>类比与实例<\/h2>\n<p>类比：写陌生方程式像拼装家具。说明书只给几张图（题目信息），你得先认出零件（反应物）、看明白成品长什么样（产物线索）、按装配顺序装（配平）、最后检查螺丝有没有拧紧（守恒检查）。这个类比在&quot;产物需要自己推断&quot;这一点上要补一句：家具图给了成品，化学题常常不给，要靠价态和环境推。<\/p>\n<p>实例：写出 Na₂S₂O₃ 在酸性溶液中分解的离子方程式。 信息：S₂O₃²⁻ 在酸性条件下不稳定，生成黄色沉淀（硫）和刺激性气体（SO₂）。 价态：S 平均 +2，一部分升到 +4（SO₂），一部分降到 0（S）。 配平：S₂O₃²⁻ → S + SO₂，先让 S 守恒：S₂O₃²⁻ → S + SO₂ 已有 2 个 S；O 3 → 2，差 1 个 O，补 H₂O；H 补 H⁺。 S₂O₃²⁻ + 2H⁺ → S↓ + SO₂↑ + H₂O。检查：S2，O3=2+1，H2，电荷 −2+2=0。正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;题里没说的产物不能写&quot;——产物常常要自己推，推的依据是价态、环境、元素守恒。\n<\/li><li>\n别以为&quot;离子方程式里所有化合物都要拆&quot;——难溶物、气体、水、弱电解质、氧化物不拆。\n<\/li><li>\n别以为&quot;配平只要原子平就行&quot;——离子方程式还必须电荷平，氧化还原还必须电子平。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n写出 Cl₂ 在碱性条件下氧化 CN⁻ 为 CNO⁻ 的离子方程式。\n<p>（答案：CN⁻ + ClO⁻ → CNO⁻ + Cl⁻；解析：Cl₂ 在碱性条件下先生成 ClO⁻，Cl 从 0 降到 −1，C 从 +2 升到 +4，1:1 配平。）<\/p>\n<\/ol>\n<ol><li>\n写出酸性条件下 MnO₂ 氧化 H₃AsO₃ 的离子方程式。\n<p>（答案：H₃AsO₃ + MnO₂ + 2H⁺ → H₃AsO₄ + Mn²⁺ + H₂O；解析：As +3→+5 失 2e，Mn +4→+2 得 2e，1:1；补 2H⁺ 和 1H₂O。）<\/p>\n<\/ol>\n<ol><li>\n判断：&quot;离子方程式两边只要原子守恒，电荷可以不守恒。&quot;\n<p>（答案：不对。电荷必须守恒，这是离子方程式的硬性要求。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五步：读信息 → 判类型 → 定产物 → 配平 → 检查。\n<\/li><li>\n酸性补 H⁺，碱性补 OH⁻，熔融碳酸盐补 CO₃²⁻。\n<\/li><li>\n三守恒：原子、电荷、电子。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：《陌生方程式的书写查缺补漏》<\/div><h1>陌生方程式五步法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把陌生方程式拆成&quot;读信息 → 判类型 → 定产物 → 配平 → 检查&quot;五个固定步骤，按顺序推进。<\/p>\n<h2>为什么重要<\/h2>\n<p>考试里的方程式题，90% 不是不会化学，而是漏了某一步：产物猜错、该拆没拆、电荷不平。固定流程能把&quot;凭感觉&quot;变成&quot;按清单核对&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[读信息] --&gt; B[判类型]\n  B --&gt; C[定产物]\n  C --&gt; D[配平]\n  D --&gt; E[检查]\n  E --&gt;|不过| C\n  E --&gt;|通过| F[写答案]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>读信息时划四样：反应物、产物线索、环境、价态。这一步决定后面所有判断。<\/p>\n<p>判类型：问化学方程式、离子方程式还是电极反应式。类型不同，拆写和符号规则不同。<\/p>\n<p>定产物：氧化还原看价态升降，非氧化还原看复分解条件（沉淀、气体、水），电极反应看电解质环境。<\/p>\n<p>配平：先电子守恒，再原子守恒，最后电荷守恒。酸性补 H⁺，碱性补 OH⁻，熔融碳酸盐补 CO₃²⁻。<\/p>\n<p>检查：原子、电荷、电子、符号四件事。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;产物题里没写就不能写&quot;——多数产物要自己推。\n<\/li><li>\n别以为&quot;配平一次就能成&quot;——电荷不平就回去改 H⁺/OH⁻ 个数。\n<\/li><li>\n别以为&quot;写对就行，符号无所谓&quot;——气体、沉淀、条件都是得分点。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>陌生第 1 章<\/td><td>五步法<\/td><td>固定流程<\/td><\/tr><tr><td>入门第 4、6、7 章<\/td><td>基础<\/td><td>配平、拆写、氧化还原<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：离子方程式、氧化还原\n<\/li><li>\n后续：电极反应、工艺流程题\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先学五步法<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：陌生方程式书写的五步法<\/a><br>检查点：能复述五步并写出 2 个陌生方程式<\/li><li class='path-step' id='path-02'><strong>步骤 02：做题诊断<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：陌生方程式书写的五步法<\/a><br>检查点：诊断测试答对 4/5<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：陌生方程式书写的五步法<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> Na2S2O3 在酸性溶液中分解，生成黄色沉淀和刺激性气体，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> S2O3^2- + 2H+ → S↓ + SO2↑ + H2O<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> S2O3^2- + H+ → S↓ + SO2↑ + H2O<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> S2O3^2- + 2H+ → S↓ + SO3^2- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> S2O3^2- + 2H+ → H2S↑ + SO2↑ + H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> Na2S2O3 被 Cl2 氧化为 SO4^2-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> S2O3^2- + 4Cl2 + 5H2O → 2SO4^2- + 8Cl- + 10H+<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> S2O3^2- + 2Cl2 + 3H2O → 2SO4^2- + 4Cl- + 6H+<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> S2O3^2- + 4Cl2 + 3H2O → 2SO4^2- + 8Cl- + 6H+<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> S2O3^2- + Cl2 + H2O → SO4^2- + 2Cl- + 2H+<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> NaBH4 与水反应生成 NaBO2 和 H2，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> NaBH4 + 2H2O → NaBO2 + 4H2↑<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> NaBH4 + H2O → NaBO2 + 2H2↑<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> NaBH4 + 3H2O → NaBO2 + 5H2↑<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> NaBH4 + 2H2O → NaOH + B(OH)3 + 2H2↑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 硫与热的 NaOH 溶液反应，产物中硫的最高价为 +4，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 3S + 6OH- → 2S^2- + SO3^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 3S + 6OH- → 2S^2- + SO4^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> S + 2OH- → S^2- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 2S + 4OH- → S^2- + SO2↑ + 2H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q5.<\/b> NaClO3 与盐酸反应生成 ClO2，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 2NaClO3 + 4HCl → 2ClO2↑ + Cl2↑ + 2NaCl + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> NaClO3 + 2HCl → ClO2↑ + Cl2↑ + NaCl + H2O<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 2NaClO3 + 2HCl → 2ClO2↑ + 2NaCl + H2O<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> NaClO3 + 6HCl → ClO2↑ + 3Cl2↑ + NaCl + 3H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q6.<\/b> 足量铁粉与稀硝酸反应生成 NO，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> Fe + 4HNO3(稀) → Fe(NO3)3 + NO↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> Fe + 4HNO3(稀) → Fe(NO3)2 + 2NO2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 3Fe + 8HNO3(稀) → 3Fe(NO3)2 + 2NO↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> Fe + 2HNO3(稀) → Fe(NO3)2 + H2↑<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q7.<\/b> 酸性溶液中 Ca(NO2)2 分解产生 NO，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 3NO2- + 2H+ → 2NO↑ + NO3- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 2NO2- + 2H+ → NO↑ + NO3- + H2O<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> NO2- + H+ → NO↑ + OH-<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 3NO2- + 2H+ → 2NO↑ + NO3- + 2H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q8.<\/b> H3AsO3 被 MnO2 氧化为 H3AsO4，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> H3AsO3 + MnO2 + 2H+ → H3AsO4 + Mn2+ + H2O<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> H3AsO3 + MnO2 → H3AsO4 + Mn2+ + H2O<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> H3AsO3 + MnO2 + 4H+ → H3AsO4 + Mn2+ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 2H3AsO3 + MnO2 → 2H3AsO4 + Mn2+<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q9.<\/b> K4[Fe(CN)6] 爆炸分解，生成 KCN 和三种稳定单质，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> K4[Fe(CN)6] → 4KCN + Fe + 2C + N2↑<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> K4[Fe(CN)6] → 4KCN + Fe + C + N2↑<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> K4[Fe(CN)6] → 2KCN + Fe + 2C + 2N2↑<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> K4[Fe(CN)6] → 4KCN + FeC2 + ata-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q18.<\/b> 酸性条件下 Cr2O7^2- 氧化 SO3^2- 为 SO4^2-，离子方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> Cr2O7^2- + 3SO3^2- + 8H+ → 2Cr3+ + 3SO4^2- + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> Cr2O7^2- + 3SO3^2- + 6H+ → 2Cr3+ + 3SO4^2- + 3H2O<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> Cr2O7^2- + SO3^2- + 8H+ → 2Cr3+ + SO4^2- + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> Cr2O7^2- + 3SO3^2- + 14H+ → 2Cr3+ + 3SO4^2- + 7H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q19.<\/b> CeO2 在稀硫酸和 H2O2 作用下生成 Ce3+，化学方程式是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 2CeO2 + H2O2 + 3H2SO4 → Ce2(SO4)3 + O2↑ + 4H2O<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> CeO2 + H2O2 + H2SO4 → CeSO4 + O2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 2CeO2 + H2O2 + 2H2SO4 → Ce2(SO4)3 + O2↑ + 2H2O<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> CeO2 + H2O2 + 2H2SO4 → Ce(SO4)2 + 3H2O<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='blank' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q20.<\/b> EDTA 滴定：2.6826 g 样品配成 250 mL，取 25.00 mL 用 0.04000 mol/L EDTA 消耗 25.50 mL，NiSO4·nH2O 的 n 是多少？（填整数）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='blank' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q21.<\/b> 金属钠与 H2 反应生成甲，4.80 g 甲完全分解得到 2.24 L（标况）H2，甲的化学式是？<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='信息型方程式'>信息型方程式 — 题干给出现象或流程，需要自己推断产物的方程式 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电荷守恒'>电荷守恒 — 离子方程式左右两边电荷代数和相等 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电子守恒'>电子守恒 — 氧化还原中得失电子总数相等 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='电极反应式'>电极反应式 — 只写正极或负极（阳极或阴极）的半反应式 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><li data-term='熔融碳酸盐环境'>熔融碳酸盐环境 — 燃料电池中以 CO3^2- 为载流子的电解质环境 <span class=glossary-ref>（第 1 章：陌生方程式书写的五步法）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：五步流水线<\/h2>\n<p>读信息（反应物、产物线索、环境、价态）→ 判类型（化学式/离子式/电极式）→ 定产物（价态、环境、元素守恒）→ 配平（电子、原子、电荷）→ 检查（原子、电荷、电子、符号）。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n有化合价变化：先电子守恒，再配原子，最后用 H+ 或 OH- 调电荷。\n<\/li><li>\n酸性补 H+，碱性补 OH-，熔融碳酸盐补 CO3^2-。\n<\/li><li>\n离子方程式：难溶物、气体、水、弱电解质、氧化物一律不拆。\n<\/li><li>\n电极反应：先定正负极，再写半反应，最后按电解质环境补离子。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n只数原子不管电荷。离子方程式电荷不平，一定错。\n<\/li><li>\n产物全靠猜。产物要由价态、环境、元素守恒三条线索推。\n<\/li><li>\n气体、沉淀符号漏标。符号也是得分点。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>五步<\/h2>\n<ol><li>\n读信息：反应物、产物线索、环境、价态\n<\/li><li>\n判类型：化学式 / 离子式 / 电极式\n<\/li><li>\n定产物：价态、环境、元素守恒\n<\/li><li>\n配平：电子 → 原子 → 电荷\n<\/li><li>\n检查：原子、电荷、电子、符号\n<\/ol>\n<h2>环境补项<\/h2>\n<table><thead><tr><th>环境<\/th><th>补什么<\/th><\/tr><\/thead><tbody><tr><td>酸性<\/td><td>H+ 和 H2O<\/td><\/tr><tr><td>碱性<\/td><td>OH- 和 H2O<\/td><\/tr><tr><td>熔融碳酸盐<\/td><td>CO3^2- 和 CO2<\/td><\/tr><\/tbody><\/table>\n<h2>高频产物<\/h2>\n<table><thead><tr><th>元素<\/th><th>常见产物<\/th><\/tr><\/thead><tbody><tr><td>Mn<\/td><td>Mn2+（酸性）、MnO2（中性/弱碱）<\/td><\/tr><tr><td>Cr<\/td><td>Cr3+（还原）、CrO4^2-（碱性氧化）<\/td><\/tr><tr><td>S<\/td><td>SO2、SO4^2-、S<\/td><\/tr><tr><td>N<\/td><td>NO、NO3-、N2<\/td><\/tr><tr><td>C<\/td><td>CO2、CO3^2-<\/td><\/tr><\/tbody><\/table>"}};

      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;

  build(DATA.nav);

}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 掌握度（简化 BKT） ---------- */
function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=boot;
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
